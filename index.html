<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="어려운 뉴스를 눈높이에 맞게 쉽게 읽고, 사실과 의견을 스스로 구별해 보는 초등학생용 AI 뉴스 학습 사이트">
<title>AI 어린이 뉴스 연구소</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F5BEA'/%3E%3Ccircle cx='14.5' cy='14.5' r='6.5' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Cpath d='M19.5 19.5l5 5' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<script>
  /* 화면이 뜨기 전에 고른 밝기를 먼저 적용해 깜박임을 막아요 (처음 오면 밝은 화면) */
  try{var s=JSON.parse(localStorage.getItem('kidsNewsLab:settings')||'{}');document.documentElement.dataset.theme=s.theme==='dark'?'dark':'light'}catch(e){document.documentElement.dataset.theme='light'}
</script>
<style>
/* AI 어린이 뉴스 연구소 — 선생님이 만든 다른 사이트(그림책 전시회·좋은탴월드)와 같은 규칙:
   하얀(어두운 화면은 검은) 바탕, Pretendard, 회색 단계 + 강조색 하나(파랑), 선 아이콘, 알약 모양 단추 */
:root{
  --ink:#111113;--ink-2:#55565E;--ink-3:#85868F;--line:#E6E6EA;--line-2:#D4D5DB;--bg:#F4F4F6;
  --page:#fff;--surface:#fff;--surface-hover:#EBEBEF;--hd-bg:rgba(255,255,255,.92);
  --main:#2F5BEA;--main-d:#2149CC;--main-soft:#EEF2FF;--on-main:#fff;
  --fact:#0E7A5F;--fact-soft:#E4F4EC;--opinion:#C2410C;--opinion-soft:#FFF0E6;
  --ok:#0B7A55;--ok-soft:#E3F8EF;--err:#C2343A;--err-soft:#FFEDEE;--think:#FFF7DD;
  --shadow:rgba(17,17,19,.10);
  --c-science:#2563EB;--c-society:#B45309;--c-economy:#0E7A5F;--c-world:#0E7490;--c-kids:#DB2777;--c-culture:#7C3AED;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:16px;
  color-scheme:light;
}
[data-theme=dark]{
  --ink:#F5F5F7;--ink-2:#B4B4BC;--ink-3:#85858E;--line:#2A2A2E;--line-2:#3A3A40;--bg:#17171A;
  --page:#000;--surface:#111113;--surface-hover:#222226;--hd-bg:rgba(0,0,0,.84);
  --main:#7C9BFF;--main-d:#9AB2FF;--main-soft:#151B2E;--on-main:#0B1230;
  --fact:#5FD3A6;--fact-soft:#0F2A20;--opinion:#FF9F6B;--opinion-soft:#2E1B10;
  --ok:#62D8A8;--ok-soft:#12352C;--err:#FF8C95;--err-soft:#3A1A20;--think:#262111;
  --shadow:rgba(0,0,0,.6);
  --c-science:#82A8FF;--c-society:#F2B05E;--c-economy:#5FD3A6;--c-world:#5CC8DC;--c-kids:#FF8FC0;--c-culture:#B79CFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.6 var(--sans);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,dl,dd{margin:0;padding:0}ul{list-style:none}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--main);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ic{width:20px;height:20px;display:block;flex:none}
.sent{display:block}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:24px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--bg);padding:1px 6px;border-radius:5px}

/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 20px;border:0;border-radius:999px;font:700 15px var(--sans);white-space:nowrap;background:var(--bg);color:var(--ink);transition:background .15s,box-shadow .15s,opacity .15s}
.btn:hover{background:var(--surface-hover)}
.btn .ic{width:18px;height:18px}
.btn--main{background:var(--main);color:var(--on-main)}.btn--main:hover{background:var(--main-d)}
.btn--ink{background:var(--ink);color:var(--page)}.btn--ink:hover{background:var(--ink);opacity:.86}
.btn--line{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}.btn--line:hover{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.btn--sm{height:36px;padding:0 14px;font-size:14px;gap:5px}.btn--sm .ic{width:16px;height:16px}
.btn--full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg)}
.seg button{height:32px;padding:0 13px;border:0;border-radius:999px;background:none;font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
[data-theme=dark] .seg button[aria-pressed=true]{background:var(--surface-hover)}

/* 머리 */
.hd{position:sticky;top:0;z-index:40;background:var(--hd-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.hd__top{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:9px;flex:none;height:46px;padding:0;border:0;background:none;font-size:18px;font-weight:500;letter-spacing:-.035em;color:var(--ink)}
.logo b{font-weight:800}
.logo__m{width:32px;height:32px;flex:none}
.search{flex:1;min-width:0;max-width:440px;margin-inline:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 16px;border:1.5px solid transparent;border-radius:999px;background:var(--bg);cursor:text}
.search:focus-within{background:var(--surface);border-color:var(--main)}
.search .ic{width:18px;height:18px;color:var(--ink-3)}
.search input{flex:1;width:0;min-width:0;border:0;background:none;outline:0;font:500 15px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search__x{width:30px;height:30px;border:0;border-radius:50%;background:var(--surface-hover);display:grid;place-items:center;color:var(--ink-2)}
.search__x .ic{width:15px;height:15px}
.search__x[hidden]{display:none}
.hd__r{display:flex;align-items:center;gap:8px;flex:none}
.round{width:42px;height:42px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink);transition:background .15s}
.round:hover{background:var(--surface-hover)}
.me{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border:0;border-radius:999px;background:var(--bg);font-weight:700;font-size:14.5px;transition:background .15s}
.me:hover{background:var(--surface-hover)}
.me[aria-current=page]{background:var(--ink);color:var(--page)}
.me .ic{width:19px;height:19px}
.me__pt{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:999px;background:var(--main);color:var(--on-main);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.gnb .wrap{display:flex;gap:2px;height:50px;overflow-x:auto;scrollbar-width:none}
.gnb .wrap::-webkit-scrollbar{display:none}
.gnb button{position:relative;flex:none;display:flex;align-items:center;padding:0 14px;border:0;background:none;font-size:15.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.gnb button:hover{color:var(--ink)}
.gnb button[aria-current=true]{color:var(--ink)}
.gnb button[aria-current=true]::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--main)}
.gnb .dot{width:7px;height:7px;border-radius:50%;background:var(--cc);margin-right:7px}
.gnb i{font-style:normal;margin-left:5px;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 처음 화면 */
.intro{padding-top:40px}
.intro__k{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--main)}
.intro h1{margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.3}
.intro p.intro__line{margin-top:6px;font-size:16.5px;color:var(--ink-2)}
.clause{display:inline-block}
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:26px}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:0;padding:36px 40px;border-radius:20px;background:var(--bg);cursor:pointer}
.feat__k{font-size:12.5px;font-weight:800;color:var(--page);background:var(--ink);border-radius:6px;padding:3px 10px}
.feat__meta{display:flex;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-2)}
.feat__meta>*+*::before{content:'';display:inline-block;width:1px;height:11px;margin:0 10px;background:var(--line-2);vertical-align:-1px}
.feat__meta b{color:var(--cc);font-weight:800}
.feat h2{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.32;max-width:680px}
.feat:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.feat__ex{font-size:16px;color:var(--ink-2);max-width:640px}
.feat .btn{margin-top:auto}
.mycard{display:flex;flex-direction:column;gap:14px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.mycard__k{font-size:13px;font-weight:800;color:var(--main)}
.mycard__h{display:flex;align-items:center;gap:12px}
.mycard__h b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.mycard__h small{display:block;font-size:13px;color:var(--ink-2)}
.mycard dl{display:grid;gap:8px;font-size:14.5px}
.mycard dl div{display:flex;justify-content:space-between;gap:8px}
.mycard dt{color:var(--ink-2)}.mycard dd{font-weight:800;font-variant-numeric:tabular-nums}
.mycard .btn{margin-top:auto}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:26px;line-height:1}
.bar{display:block;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--main);transition:width .6s cubic-bezier(.3,1,.4,1)}

/* 구역 제목 */
.sec{padding-top:52px}
.sec__h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.sec__h h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.sec__h h2 small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
.sec__r{flex:none;font-size:14px;font-weight:600;color:var(--ink-2)}
.sec__r b{color:var(--main)}

/* 뉴스 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.nc{display:flex;flex-direction:column;gap:10px;min-width:0;padding:20px 22px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.nc:hover{border-color:var(--ink-3);box-shadow:0 12px 26px -14px var(--shadow);transform:translateY(-2px)}
.nc__top{display:flex;align-items:center;gap:8px;height:30px}
.kick{font-size:13px;font-weight:800;color:var(--cc)}
.read-tag{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700}
.read-tag .ic{width:13px;height:13px}
.bm{margin-left:auto;width:34px;height:34px;margin-right:-8px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.bm:hover{background:var(--bg);color:var(--ink)}
.bm[aria-pressed=true]{color:var(--main)}
.bm[aria-pressed=true] path,.bm-btn[aria-pressed=true] path{fill:currentColor}
.nc h3{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.42;min-height:2.84em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc[data-read="1"] h3{color:var(--ink-2)}
.nc__ex{font-size:14.5px;line-height:1.6;color:var(--ink-2);min-height:3.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc__meta{display:flex;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.nc__meta>*+*::before{content:'';display:inline-block;width:1px;height:10px;margin:0 9px;background:var(--line-2);vertical-align:-1px}
.nc__meta b{font-weight:700;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.nc__meta span{display:inline-flex;align-items:center;gap:4px}
.nc__meta .ic{width:14px;height:14px}
.nc__meta span::before{flex:none}
.more{display:flex;justify-content:center;margin-top:28px}
.more__n{color:var(--main)}
.empty{display:grid;justify-items:center;gap:14px;padding:64px 20px;border-radius:var(--r);background:var(--bg);text-align:center;color:var(--ink-2)}
.empty>.ic{width:34px;height:34px;color:var(--ink-3)}

/* 기사 화면 */
.art{max-width:800px;margin:0 auto;padding:28px 24px 0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:22px;font-size:13.5px;color:var(--ink-2)}
.crumb button{padding:0;border:0;background:none;font:inherit;color:inherit}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.crumb>*+*::before{content:'›';margin-right:6px;color:var(--ink-3)}
.art__k{font-size:14px;font-weight:800;color:var(--cc)}
.art h1{margin-top:6px;font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.3}
.art__meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:18px;padding:12px 0;border-block:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.art__meta>span{display:inline-flex;align-items:center;gap:6px}
.art__meta .ic{width:16px;height:16px;color:var(--ink-3)}
.art__meta b{color:var(--ink);font-weight:700}
.art__meta .btn{margin-left:auto}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-top:16px}
.tool{display:flex;align-items:center;gap:8px}
.tool__l{font-size:13px;font-weight:700;color:var(--ink-3)}
.seg--fs button{width:36px;padding:0}
.body{margin-top:28px;font-size:var(--fs,17px);line-height:1.9}
.body p+p{margin-top:1.2em}
.verify{margin-top:34px;padding:22px 24px;border-radius:var(--r);background:var(--bg)}
.verify h2{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.verify h2 .ic{color:var(--main)}
.verify dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;margin-top:14px;font-size:14.5px}
.verify dt{font-weight:700;color:var(--ink-3);white-space:nowrap}
.verify dd{font-weight:600}
.verify__note{margin-top:14px;font-size:14px;color:var(--ink-2)}
.verify .btn{margin-top:16px}

/* AI 읽기 도우미 */
.helper{padding-top:48px}
.mtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mtab{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;transition:border-color .15s,background .15s}
.mtab:hover{border-color:var(--ink-3)}
.mtab[aria-pressed=true]{border-color:var(--main);background:var(--main-soft)}
.mtab__i{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.mtab[aria-pressed=true] .mtab__i{background:var(--main);color:var(--on-main)}
.mtab b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.mtab small{display:block;margin-top:1px;font-size:13.5px;color:var(--ink-2)}
.panel{margin-top:14px;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.panel__h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.panel__h h3{font-size:19px;font-weight:800;letter-spacing:-.03em}
.ai-tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:3px 9px}
.easy{font-size:18px;line-height:1.85;font-weight:500}
.sub{display:flex;align-items:baseline;gap:8px;margin:26px 0 10px;font-size:15px;font-weight:800}
.sub small{font-size:13px;font-weight:600;color:var(--ink-3)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.voc{padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.55;color:var(--ink-2)}
.voc b{display:block;margin-bottom:2px;font-size:15px;color:var(--ink)}
.think{display:flex;gap:12px;margin-top:24px;padding:16px 18px;border-radius:14px;background:var(--think)}
.think>.ic{width:22px;height:22px;color:#B7791F}
[data-theme=dark] .think>.ic{color:#F2C14E}
.think b{display:block;margin-bottom:2px;font-weight:800}
.ai-note{display:flex;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.ai-note .ic{width:16px;height:16px;margin-top:2px}
.ratio{display:grid;gap:10px}
.ratio__bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg)}
.ratio__bar i{display:block;height:100%}
.ratio__bar .f,.ratio__lg .f{background:var(--fact)}
.ratio__bar .o,.ratio__lg .o{background:var(--opinion)}
.ratio__lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2)}
.ratio__lg span{display:inline-flex;align-items:center;gap:6px}
.ratio__lg i{width:10px;height:10px;border-radius:3px}
.ratio__lg b{color:var(--ink)}
.fl{display:grid;gap:10px}
.fi{padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--fact);border-radius:12px}
.fi.o{border-left-color:var(--opinion)}
.fi__tag{display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:6px;background:var(--fact-soft);color:var(--fact);font-size:12px;font-weight:800}
.fi.o .fi__tag{background:var(--opinion-soft);color:var(--opinion)}
.fi p{font-weight:600;line-height:1.6}
.fi small{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.none{padding:14px 16px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--ink-2)}
.qz{display:grid;gap:26px}
.q__t{display:flex;gap:10px;margin-bottom:12px;font-size:16.5px;font-weight:800;line-height:1.5}
.q__n{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;background:var(--ink);color:var(--page);display:grid;place-items:center;font-size:13px}
.q__opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:15px;font-weight:600;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt__l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink-2)}
.opt[data-selected="1"]{border-color:var(--main);background:var(--main-soft)}
.opt[data-selected="1"] .opt__l{background:var(--main);color:var(--on-main)}

.wn{display:grid;gap:12px}
.wn__c{padding:16px 18px;border:1px solid var(--line);border-radius:14px}

<script>
(function(){
'use strict';

/* =========================================================
   DATA
========================================================= */
const CATEGORIES = [
  {id:'all',     label:'전체'},
  {id:'science', label:'IT/과학'},
  {id:'society', label:'사회'},
  {id:'economy', label:'경제'},
  {id:'world',   label:'세계'},
  {id:'kids',    label:'어린이'},
  {id:'culture', label:'문화'},
];
function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0]; }

const LEVELS = [
  {id:'1-2', label:'1~2학년', desc:'초등학교 1~2학년 (한글을 막 뗀 수준이라고 가정하고, 아주 쉬운 낱말과 아주 짧은 문장만 사용)'},
  {id:'3-4', label:'3~4학년', desc:'초등학교 3~4학년 (일상적인 낱말은 이해 가능, 어려운 개념은 예를 들어 풀어서 설명)'},
  {id:'5-6', label:'5~6학년', desc:'초등학교 5~6학년 (조금 더 다양한 어휘를 사용해도 되고, 배경지식을 한 문장 정도 덧붙여도 됨)'},
];

const RANKS = [
  {min:0, name:'뉴스 새싹', icon:'🌱'},
  {min:20, name:'호기심 탐정', icon:'🧐'},
  {min:45, name:'초보 탐정', icon:'🔎'},
  {min:75, name:'길잡이 탐정', icon:'🧭'},
  {min:110, name:'뉴스 탐정', icon:'🕵️'},
  {min:150, name:'베테랑 탐정', icon:'🎯'},
  {min:195, name:'명탐정', icon:'🎖️'},
  {min:245, name:'수석 탐정', icon:'🏆'},
  {min:300, name:'뉴스 박사', icon:'👑'},
  {min:360, name:'전설의 탐정', icon:'🌟'},
];
function getRank(points){
  let cur = RANKS[0], next = RANKS[1] || null;
  for(let i=0;i<RANKS.length;i++){
    if(points >= RANKS[i].min){ cur = RANKS[i]; next = RANKS[i+1] || null; }
  }
  return {cur, next};
}

/* =========================================================
   기사 목록 (실제 보도된 기사)
   - body: 원문 기사를 어린이가 읽기 쉽게 짧게 다시 정리한 글
   - origTitle / source / date / url: 원문 확인용 정보 (date는 보도 날짜, YYYY-MM-DD)
   - 새 기사를 넣을 때는 아래 형식대로 한 덩어리를 추가하면 날짜순으로 자동 정렬돼요.
========================================================= */
const ARTICLES = [
  {id:`r1117-voyager`, category:`science`, source:`파이낸셜뉴스`, date:`2026-11-17`,
   url:`https://www.fnnews.com/news/202611170941577117`,
   origTitle:`롯데월드타워, 오늘 밤 황금빛으로…보이저 1호 '1광일' 도달 기념`,
   title:`49년 날아간 보이저 1호, 빛으로 하루 걸리는 곳에 닿아요`,
   excerpt:`1977년에 떠난 우주 탐사선 보이저 1호가 지구에서 빛으로 하루 걸리는 거리에 도착해요.`,
   body:`1977년 9월에 발사된 미국 항공우주국(NASA)의 우주 탐사선 보이저 1호가 약 49년 만에 지구에서 '1광일' 떨어진 곳에 도착합니다. 1광일은 빛이 하루 동안 달리는 거리로, 약 259억 km나 됩니다. NASA는 한국 시간으로 11월 18일 오후 7시 16분쯤 보이저 1호가 이 지점에 닿을 것으로 예상했습니다. 사람이 만든 물체가 이 거리에 닿는 것은 처음입니다.

이를 기념해 서울 롯데월드타워는 11월 17일 오후 7시부터 10시까지 건물을 황금빛 조명으로 밝힙니다. 매시 정각과 30분에는 약 1분 동안 불빛을 깜빡여 보이저의 약자인 'VGR'을 모스 부호로 보여 줍니다.

롯데물산의 이미현 마케팅팀 리더는 "인류의 위대한 여정을 기리는 글로벌 캠페인에 동참하게 돼 뜻깊다"고 말했습니다. 또 서울 어디서나 보이는 조명으로 많은 사람이 역사적인 순간을 함께 나누길 바란다고 했습니다.`},

  {id:`r1117-csat`, category:`society`, source:`전자신문`, date:`2026-11-17`,
   url:`https://www.etnews.com/20261117000423`,
   origTitle:`정부, 수능 연기 대신 감독·제재 강화…"AI 부정행위 끝까지 추적"`,
   title:`수능에서 'AI 부정행위' 막으려 검사를 늘려요`,
   excerpt:`정부가 수능에서 인공지능을 이용한 부정행위를 막기 위해 감독을 강화하기로 했어요.`,
   body:`정부는 인공지능(AI)을 이용한 부정행위를 걱정하는 목소리가 커지자, 11월 19일 치러지는 2027학년도 대학수학능력시험(수능)을 미루지 않는 대신 감독을 강화하기로 했습니다. 정부는 시험을 미루는 방법도 살펴봤지만, 수험생들이 겪을 혼란이 더 크다고 판단했습니다.

시험 날에는 1교시 전에 모든 수험생의 안경을 검사해 스마트안경인지 확인합니다. 아주 작은 카메라를 숨기지 못하도록 옷깃과 단추도 살피고, 단추에는 스티커를 붙입니다. 전국 1312개 시험장에는 감독관 7만5000여 명에 더해 스마트기기 전담 인력 등 8400여 명이 추가로 배치됩니다.

부정행위를 하면 수능을 볼 수 없는 기간을 지금의 1년에서 10년으로 늘리는 방안도 추진됩니다. 배경훈 과학기술정보통신부 장관은 "통신 차단 자체와 전파 차단은 현재 기술상으로 불가능하다"며 시험이 끝난 뒤 통신 기록을 분석해 끝까지 찾아내겠다고 말했습니다.`},

  {id:`r1117-rights`, category:`kids`, source:`데일리안`, date:`2026-11-17`,
   url:`https://www.dailian.co.kr/news/view/1716066/%ED%99%94%EC%84%B1%EC%86%8C%EC%8B%9D%ED%99%94%EC%84%B1%EC%8B%9C%EC%96%B4%EB%A6%B0%EC%9D%B4%EB%AC%B8%ED%99%94%EC%84%BC%ED%84%B0-2026-2026`,
   origTitle:`[화성소식]화성시어린이문화센터, '2026 아동권리 주간' 운영`,
   title:`영화와 그림책으로 어린이 권리를 배워요`,
   excerpt:`화성시어린이문화센터가 11월 19일부터 22일까지 '2026 아동권리주간' 행사를 열어요.`,
   body:`경기도 화성시어린이문화센터가 11월 19일부터 22일까지 나흘 동안 '2026 아동권리주간' 행사를 엽니다. 11월 19일 아동학대 예방의 날과 11월 20일 세계 어린이의 날을 맞아 어린이의 권리에 대한 관심을 높이기 위한 행사입니다. 센터는 어린이 구호 단체인 세이브더칠드런과 함께 행사를 준비했습니다.

아이누리극장에서는 '세이브더칠드런 아동권리영화제'에 올랐던 단편영화 가운데 어린이가 보기에 알맞은 작품을 상영합니다. 주말에는 영화를 보고 느낀 감정을 엽서에 적는 활동도 합니다. 모모라운지에는 어린이가 직접 만든 그림책을 읽는 공간과, 어린이의 눈으로 '어린이'를 표현한 포토존이 마련됩니다.

이번 행사에는 센터의 키즈체험관을 예약한 사람이 참여할 수 있습니다. 평일에는 미리 모집한 단체가, 주말에는 개인 관람객이 자유롭게 참여합니다.`},

  {id:`r1116-kimjang`, category:`economy`, source:`파이낸셜뉴스`, date:`2026-11-16`,
   url:`https://www.fnnews.com/news/202611160701209048`,
   origTitle:`올해 4인 가족 김장비용 28만8천원…2020년대 들어 '최저'`,
   title:`배춧값이 내려 올해 김장 비용이 줄었어요`,
   excerpt:`4인 가족 김장 비용이 전통시장 기준 28만8500원으로 2020년대 들어 가장 낮아요.`,
   body:`가격 조사 기관인 한국물가정보는 올해 4인 가족이 김장을 하는 데 드는 비용이 전통시장에서 28만8500원, 대형마트에서 36만340원이라고 발표했습니다. 작년보다 전통시장은 14.8%, 대형마트는 10.9% 줄었습니다. 전통시장 비용은 2020년대 들어 가장 낮습니다.

가격이 내린 가장 큰 이유는 가을 날씨가 좋아 배추와 무, 쪽파 같은 채소가 잘 자랐기 때문입니다. 전통시장에서 배추 20포기 값은 8만원으로 33.3% 내렸고, 쪽파 값은 절반으로 떨어졌습니다. 반대로 새우젓은 바다 온도가 높아 새우를 잡기 어려워지면서 33.3% 올랐고, 천일염도 비싸졌습니다.

한국물가정보는 포장김치를 사 먹는 사람이 늘면서 김장철에 사람들이 한꺼번에 재료를 사는 일이 줄어든 것도 가격 안정에 영향을 줬다고 분석했습니다. 김장하기 좋은 때는 중부 지방이 11월 하순에서 12월 초, 남부 지방이 12월 초에서 중순으로 예상됩니다.`},

  {id:`r1116-econbook`, category:`economy`, source:`중도일보`, date:`2026-11-16`,
   url:`https://joongdo.co.kr/web/view.php?key=20261116010005200`,
   origTitle:`경북교육청, 유아 경제교육 워크북 전국 최초 보급`,
   title:`유치원 동생들도 놀이로 경제를 배워요`,
   excerpt:`경북교육청이 읍·면 지역 유치원과 어린이집 유아를 위한 경제교육 워크북을 만들었어요.`,
   body:`경상북도교육청이 유아를 위한 경제교육 워크북 '토리와 모디의 차곡차곡 경제놀이'를 만들어 11월 중에 나눠 줄 예정입니다. 기사는 유아 경제교육 워크북을 이렇게 보급하는 것이 전국에서 처음이라고 전했습니다. 대상은 경북의 읍·면 지역 유치원과 어린이집에 다니는 만 3~5세 어린이입니다.

워크북은 화폐, 생산, 저축, 소비, 기부의 다섯 가지 영역으로 이루어져 있습니다. 어린이들은 만들기, 스티커 붙이기, 색칠하기 같은 놀이로 경제 개념을 배웁니다. 선생님과 부모님이 함께 쓸 수 있도록 지도 방법을 담은 책도 함께 나옵니다.

임종식 경상북도교육감은 "유아기 경제교육은 놀이를 통해 경제 개념을 익히고 생활 속에서 실천하도록 돕는 것이 중요하다"고 말했습니다. 또 교육 기회가 적은 지역의 어린이들에게 다양한 배움의 기회를 주겠다고 밝혔습니다.`},

  {id:`r1115-kdh`, category:`culture`, source:`스포츠월드`, date:`2026-11-15`,
   url:`https://www.sportsworldi.com/newsView/20261115502820`,
   origTitle:`'케이팝 데몬 헌터스', 전 세계 50개 도시 월드투어…내년 6월 개막`,
   title:`'케이팝 데몬 헌터스', 세계 50개 도시에서 공연해요`,
   excerpt:`인기 애니메이션 '케이팝 데몬 헌터스'가 2027년 6월부터 세계 50개 도시에서 공연을 열어요.`,
   body:`넷플릭스 애니메이션 '케이팝 데몬 헌터스'가 세계를 도는 공연을 엽니다. 넷플릭스와 공연 기획사 AEG 프레젠츠는 11월 13일(현지 시간) '케이팝 데몬 헌터스 골든 월드투어' 계획을 발표했습니다. 투어는 2027년 6월 5일 미국 볼티모어에서 시작해 약 2년 동안 북미, 유럽, 아시아·태평양, 중남미의 50개 도시에서 150회 넘게 열릴 예정입니다.

공연에서는 영화 속 걸그룹 헌트릭스의 루미, 미라, 조이가 첨단 영상 기술로 관객과 실시간으로 소통합니다. 라이벌 그룹 사자보이즈와 호랑이 캐릭터 더피의 애니메이션 무대, 댄서들의 라이브 공연도 펼쳐집니다. 아시아·태평양과 중남미 공연 일정은 나중에 발표됩니다.

지난해 6월 공개된 이 영화는 넷플릭스에서 누적 조회 수 6억 7000만 회를 넘었습니다. 넷플릭스의 매리언 리 최고마케팅책임자는 "'케이팝 데몬 헌터스'는 폭발적인 히트작에서 한 세대를 아우르는 문화적 현상으로 변모했다"고 말했습니다.`},

  {id:`r1113-pepero`, category:`economy`, source:`뉴스1`, date:`2026-11-13`,
   url:`https://www.news1.kr/industry/distribution/6352217`,
   origTitle:`"빼빼로에 키링·담요까지"…편의점 빼빼로데이 매출 이끈 캐릭터 굿즈`,
   title:`빼빼로데이 편의점 매출, 캐릭터 상품이 이끌었어요`,
   excerpt:`올해 빼빼로데이에는 키링이나 담요가 함께 든 캐릭터 상품 세트가 인기를 끌었어요.`,
   body:`11월 11일 빼빼로데이를 맞아 편의점 GS25, CU, 세븐일레븐의 관련 상품 매출이 모두 늘었습니다. 특히 과자에 키링이나 담요 같은 캐릭터 상품을 함께 담은 세트가 인기를 끌었습니다.

GS25에서는 캐릭터 굿즈 세트 매출이 155.1% 늘었습니다. CU에서는 다른 편의점과 차별화한 상품이 차지하는 비중이 39.1%로 커졌습니다. 세븐일레븐은 빼빼로데이 관련 매출이 3배 수준으로 늘었고, 캐릭터 기획상품 비중이 70%로 작년보다 25%포인트 높아졌습니다.

기사는 이렇게 캐릭터를 활용한 상품이 올해 빼빼로데이 매출을 이끌었다고 분석했습니다.`},

  {id:`r1111-aifesta`, category:`kids`, source:`한국NGO신문`, date:`2026-11-11`,
   url:`https://www.ngonews.kr/news/articleView.html?idxno=242834`,
   origTitle:`'2026 더아동페스타' 개최…디지털 세상 속 아이들의 외로움과 불안, 해법 찾는다`,
   title:`디지털 세상 속 어린이 마음 건강, 함께 고민해요`,
   excerpt:`유니세프 한국위원회가 세계 어린이의 날을 맞아 어린이 마음 건강을 주제로 행사를 열어요.`,
   body:`유니세프 한국위원회가 세계 어린이의 날을 맞아 11월 19일과 20일 이틀 동안 서울 마포구 유니세프 블루홀에서 '2026 더아동페스타'를 엽니다. 올해 주제는 디지털 환경 속 어린이의 마음 건강입니다. 온라인 세상이 어린이의 감정과 친구 관계에 어떤 영향을 주는지 살펴봅니다.

행사에서는 안전한 디지털 환경, 건강한 인간관계, 어린이의 선택권, 사회가 함께 지는 책임이라는 네 가지 주제를 이야기합니다. 대한민국아동총회 의장단 같은 어린이 대표도 참여하고, 행사장에는 체험 부스 5개가 운영됩니다. 현장 참가는 하루 200명씩 선착순이고 참가비는 무료이며, 온라인 생중계도 합니다.

허금주 유니세프 한국위원회 사무총장은 "디지털 공간에서 아이들이 겪는 어려움을 사회가 먼저 발견하고 함께 해결해야 한다"고 말했습니다. 유니세프는 디지털 기기를 쓰는 시간을 줄이는 것만으로는 어린이를 보호하기 어렵고, 처음부터 안전하게 설계된 디지털 환경이 중요하다고 강조했습니다.`},

  {id:`r1111-robot`, category:`science`, source:`국제뉴스`, date:`2026-11-11`,
   url:`https://www.gukjenews.com/news/articleView.html?idxno=3749214`,
   origTitle:`동대문구 첫 AI·로봇 경진대회…초등학생 100명, 팀으로 과제 도전`,
   title:`초등학생 100명, AI·로봇 대회에서 팀으로 도전했어요`,
   excerpt:`서울 동대문구에서 처음 열린 AI·로봇 경진대회에 초등학생 29개 팀이 참가했어요.`,
   body:`서울 동대문구청이 11월 8일 구청 2층 다목적강당에서 '제1회 동대문구 AI·로봇 경진대회'를 열었습니다. 동대문구에 사는 초등학교 3~6학년 학생 100명이 29개 팀을 이뤄 참가했습니다. 학생들은 대회 전에 교구 쓰는 법과 경기 규칙, 안전 수칙을 미리 배웠습니다.

로봇 부문에서 3~4학년은 로봇을 조립해 축구 대결을 했고, 5~6학년은 로봇팔로 화물을 나누는 과제에 도전했습니다. AI 부문에서 3~4학년은 AI로 컬러콘을 모으는 대결을, 5~6학년은 AI 미션 릴레이 경주를 펼쳤습니다. 모두 16개 팀이 구청장상을, 13개 팀이 창의상을 받았습니다.

최동민 동대문구청장은 학생들이 첨단 기술을 직접 경험하고 팀워크로 문제를 해결하는 기회가 됐기를 바란다고 말했습니다. 또 앞으로도 AI와 로봇에 관심 있는 학생들을 돕겠다고 밝혔습니다.`},

  {id:`r1109-firstgrade`, category:`society`, source:`서울일보`, date:`2026-11-09`,
   url:`https://www.seoulilbo.co.kr/news/articleView.html?idxno=22373`,
   origTitle:`초등 신입생 30만명선 붕괴 눈앞…저출생에 교육 현장 비상`,
   title:`내년 초등학교 1학년, 처음으로 30만 명보다 적을 듯`,
   excerpt:`태어나는 아기가 줄면서 내년 초등학교 입학생이 20만 명대로 줄어들 것으로 보여요.`,
   body:`내년(2027년)에 초등학교에 들어가는 1학년 학생 수가 처음으로 30만 명 아래로 내려갈 것으로 보입니다. 올해 초등학교 입학생은 30만1442명으로, 1964년 통계를 내기 시작한 뒤 가장 적었습니다. 내년 입학생들이 태어난 2020년에는 아기가 27만2337명 태어나, 그 전해보다 3만 명 넘게 줄었습니다.

초등학교 입학생이 가장 많았던 해는 1968년으로, 105만 명이 넘었습니다. 내년 입학생이 27만 명 안팎이 되면 그때의 약 4분의 1 수준이 됩니다. 2017년과 비교해도 9년 동안 약 15만8000명이 줄었습니다.

기사는 농어촌과 지방 중소도시에서는 학생을 모으기가 더 어려워질 수 있다고 전했습니다. 다만 학교를 합치는 일은 학생 수만으로 정하기 어려우니 신중하게 결정해야 한다는 지적도 함께 실었습니다.`},

  {id:`r1108-cop31`, category:`world`, source:`경향신문`, date:`2026-11-08`,
   url:`https://www.khan.co.kr/article/202611081543001/`,
   origTitle:`COP31 개막…화석연료 전환·기후재원 확대 '미뤄둔 과제' 풀어낼까`,
   title:`기후 위기를 막으려 세계가 튀르키예에 모여요`,
   excerpt:`제31차 유엔기후변화협약 당사국총회(COP31)가 11월 9일 튀르키예 안탈리아에서 열려요.`,
   body:`지구가 뜨거워지는 기후 위기에 함께 대응하기 위한 국제회의인 제31차 유엔기후변화협약 당사국총회(COP31)가 11월 9일 튀르키예 안탈리아에서 막을 올립니다. 이 회의는 1995년 독일 베를린에서 처음 열린 뒤 해마다 열리고 있으며, 이번에는 약 10만 명이 참석할 것으로 예상됩니다. 우리나라도 김성환 기후에너지환경부 장관을 대표로 정부대표단을 보냅니다.

이번 회의에서는 석탄과 석유 같은 화석연료 사용을 줄이는 방법과, 기후 변화로 피해를 입는 개발도상국을 돕는 돈을 어떻게 마련할지가 중요하게 다뤄집니다. 인공지능(AI) 데이터센터가 전기를 많이 쓰면서 생기는 환경 문제도 논의될 것으로 보입니다.

전의찬 세종대 석좌교수는 "선진국들이 명확한 부담 규모를 제시하기를 꺼리고 있다"며 돈을 마련하는 방안에 합의하기가 쉽지 않을 것이라고 내다봤습니다. 시민단체들은 우리나라가 온실가스를 더 많이 줄이겠다는 목표를 세워야 한다고 요구했습니다.`},

  {id:`r1108-panda`, category:`world`, source:`스페셜타임스`, date:`2026-11-08`,
   url:`https://www.specialtimes.co.kr/news/articleView.html?idxno=483131`,
   origTitle:`중국 판다 핑핑·푸솽, 미 애틀랜타 동물원서 첫 대중 공개`,
   title:`미국 애틀랜타 동물원에 판다 '핑핑'과 '푸솽'이 왔어요`,
   excerpt:`중국에서 온 판다 두 마리가 미국 애틀랜타 동물원에서 처음으로 관람객을 만났어요.`,
   body:`중국에서 온 자이언트판다 두 마리가 11월 6일(현지 시간) 미국 조지아주 애틀랜타 동물원에서 처음으로 관람객을 만났습니다. 수컷 '핑핑'과 암컷 '푸솽'으로, 둘 다 올해 6살입니다. 두 판다는 9월 27일 애틀랜타에 도착해 그동안 새 환경에 적응하는 시간을 가졌습니다.

애틀랜타에서 판다를 볼 수 있게 된 것은 2024년 원래 있던 판다 네 마리가 중국으로 돌아간 뒤 약 2년 만입니다. 핑핑과 푸솽은 중국 청두에 있는 판다 번식연구기지에서 태어났고, 10년 동안 애틀랜타에 머물기로 했습니다. 지금 미국에서 판다를 기르는 동물원은 애틀랜타, 워싱턴DC, 샌디에이고의 세 곳입니다.

판다를 보려고 여행 일정을 하루 늘렸다는 8살 레이철 서덜랜드는 "내 인생에서 가장 최고의 순간"이라고 말했습니다. 셰펑 주미 중국대사는 두 판다가 건강하게 자라 판다를 사랑하는 모든 사람에게 기쁨을 주기를 바란다고 말했습니다.`},

  {id:`r1108-lions`, category:`culture`, source:`뉴스1`, date:`2026-11-08`,
   url:`https://www.news1.kr/life-culture/general-cultural/6346896`,
   origTitle:`'V9' 삼성, KT 꺾고 12년 만에 한국시리즈 우승…MVP 구자욱(종합)`,
   title:`삼성 라이온즈, 12년 만에 한국시리즈 우승`,
   excerpt:`프로야구 삼성 라이온즈가 KT 위즈를 꺾고 12년 만에 한국시리즈 정상에 올랐어요.`,
   body:`프로야구 삼성 라이온즈가 11월 8일 대구 삼성라이온즈파크에서 열린 2026 한국시리즈 5차전에서 KT 위즈를 12대 1로 이겼습니다. 이로써 삼성은 시리즈 전적 4승 1패로 우승을 확정했습니다. 삼성이 한국시리즈에서 우승한 것은 12년 만이며, 팀 역사상 아홉 번째입니다.

이날 삼성은 5회에만 8점을 뽑아내며 승리를 굳혔습니다. 상대 팀 KT는 올해 정규리그에서 1위를 한 팀이었습니다.

한국시리즈 최우수선수(MVP)에는 삼성의 주장 구자욱 선수가 뽑혔습니다. 구자욱 선수는 이번 시리즈에서 타율 5할에 홈런 1개, 6타점을 기록했습니다.`},

  {id:`r1108-snow`, category:`society`, source:`머니투데이`, date:`2026-11-08`,
   url:`https://www.mt.co.kr/society/2026/11/08/2026110811135460309`,
   origTitle:`서울 '첫눈'…작년보다 26일 빨라`,
   title:`서울에 첫눈이 왔어요, 작년보다 26일 빨라요`,
   excerpt:`11월 8일 서울에 첫눈이 날려 작년보다 26일, 평년보다 12일 빨랐어요.`,
   body:`기상청은 11월 8일 오전 10시쯤 서울과 인천, 경기 북부에서 빗방울이 떨어지거나 눈이 날리는 것이 관측됐다고 밝혔습니다. 서울의 첫눈은 작년 12월 4일보다 26일 빨랐고, 평년 첫눈 날짜인 11월 20일보다도 12일 빨랐습니다.

서울의 첫눈은 종로구 송월동에 있는 서울기상관측소에서 눈이 관측된 날을 기준으로 정합니다. 이날 눈은 약하게 내려서 쌓이지는 않을 것으로 예상됐습니다.

기상청은 경기 북동부와 강원 내륙·산지를 중심으로 내린 비나 눈이 얼어 도로에 살얼음이 생기는 곳이 있을 것이라며 교통안전에 주의해 달라고 당부했습니다.`},

  {id:`r1104-braille`, category:`culture`, source:`아시아경제`, date:`2026-11-04`,
   url:`https://view.asiae.co.kr/article/2026110406491072859`,
   origTitle:`훈맹정음 반포 100주년…기념식·국제학술대회 등 다양한 행사 개최`,
   title:`한글 점자 '훈맹정음'이 100살이 됐어요`,
   excerpt:`박두성 선생이 만든 한글 점자 훈맹정음이 반포 100주년을 맞아 기념식이 열려요.`,
   body:`시각장애인을 위한 한글 점자인 '훈맹정음'이 올해로 반포 100주년을 맞았습니다. 훈맹정음은 1926년 송암 박두성 선생이 제자들과 함께 몰래 연구해 발표했으며, '눈먼 이를 가르치는 바른 소리'라는 뜻입니다. 정부는 2020년 훈맹정음이 반포된 11월 4일을 '한글 점자의 날'로 정했습니다.

문화체육관광부와 한국시각장애인연합회는 11월 4일 서울 마포구 누리꿈스퀘어에서 기념식을 열고, 한글 점자 발전에 힘쓴 사람들에게 상을 줍니다. 11월 5일과 6일에는 인천에서 여러 나라 전문가 약 150명이 모여 점자의 미래를 이야기하는 국제학술대회도 열립니다. 전국의 점자도서관과 점자교육원에서도 체험 행사가 마련됩니다.

최휘영 문화체육관광부 장관은 "한글 점자는 시각장애인의 읽고 쓸 권리를 보장하고, 그들에게 배움과 소통의 길을 열어 준 소중한 문자"라고 말했습니다.`},

  {id:`r1104-sky`, category:`science`, source:`이코노미사이언스`, date:`2026-11-04`,
   url:`https://www.e-science.co.kr/news/articleView.html?idxno=138813`,
   origTitle:`유성우·화성·목성·슈퍼문…NASA가 꼽은 11월 밤하늘 관측 포인트`,
   title:`별똥별부터 슈퍼문까지, 11월 밤하늘을 올려다봐요`,
   excerpt:`NASA가 11월에 꼭 볼 만한 밤하늘 현상으로 유성우와 슈퍼문 등을 골랐어요.`,
   body:`미국 항공우주국(NASA)이 11월에 관측하기 좋은 밤하늘 현상을 소개했습니다. 11월 17일부터 18일 새벽까지는 사자자리 유성우가 가장 많이 떨어집니다. 조건이 좋으면 한 시간에 별똥별을 15개쯤 볼 수 있고, 달이 진 뒤 해 뜨기 전에 보는 것이 좋습니다.

11월 15일과 16일 새벽에는 해 뜨기 전 남동쪽 하늘에서 화성과 목성이 아주 가깝게 붙어 보입니다. 하지만 두 행성이 실제로 가까워지는 것은 아니고, 지구에서 바라보는 방향이 비슷해져서 그렇게 보이는 것입니다.

11월 24일에는 평소보다 크고 밝게 보이는 슈퍼문이 뜹니다. NASA는 12월과 2027년 1월까지 세 번 연달아 슈퍼문이 뜰 것이라고 내다봤습니다.`},

  {id:`r1102-silla`, category:`culture`, source:`뉴스1`, date:`2026-11-02`,
   url:`https://www.news1.kr/life-culture/cultural-policy/6339352`,
   origTitle:`신라 고분을 발굴한 학생들 이야기…특별전 '같이 발굴, 가치 전시' 3일 개막`,
   title:`대학생들이 직접 발굴한 신라 유물, 전시회로 만나요`,
   excerpt:`국립경주문화유산연구소와 동국대 학생들이 함께 발굴한 유물을 보여 주는 특별전이 열려요.`,
   body:`국립경주문화유산연구소와 동국대학교 WISE캠퍼스가 함께 발굴한 성과를 소개하는 특별전 '같이 발굴, 가치 전시'가 11월 3일 문을 엽니다. 전시는 2027년 5월 30일까지 이어집니다.

이번 전시의 주인공은 발굴 현장에 직접 참여한 동국대 WISE캠퍼스 학생들입니다. 학생들이 발굴하면서 쓴 기록과 실습 수첩을 볼 수 있습니다. 경주 구황동 지석묘(고인돌)와 신라 무덤인 쪽샘 K170호에서 나온 유물도 함께 공개됩니다.`},

  {id:`r1029-kultepe`, category:`world`, source:`아주경제`, date:`2026-10-29`,
   url:`https://www.ajunews.com/view/20261028092456202`,
   origTitle:`한국 기술로 찾았다…튀르키예 땅속에 잠든 2000년 전 도시`,
   title:`우리 기술로 튀르키예 땅속 2000년 전 유적을 찾았어요`,
   excerpt:`한국과 튀르키예 연구자들이 고대 도시 퀼테페에서 헬레니즘 시대 건물터를 찾아냈어요.`,
   body:`우리나라 국가유산청 국립문화유산연구원과 튀르키예가 함께 발굴하고 있는 퀼테페 유적에서 약 2000년 전 헬레니즘 시대의 건물터가 확인됐습니다. 퀼테페는 튀르키예 중부 카이세리에 있는 유적으로, 옛날 메소포타미아와 아나톨리아를 잇는 무역의 중심지였습니다.

연구팀은 먼저 우리나라의 땅속 탐사 기술로 땅 밑에 무언가 있다는 신호를 찾은 뒤 발굴을 시작했습니다. 그 결과 모자이크 바닥이 남아 있는 건물터와 길이 10m가 넘는 돌로 쌓은 시설, 동물 모양 토기 등을 찾았습니다. 나온 유물은 3차원(3D) 디지털 측량으로 꼼꼼하게 기록했습니다.

튀르키예 앙카라대학교의 피크리 쿨라코울루 교수는 한국과 함께한 발굴 성과가 퀼테페 발굴 역사에서 유례없는 일이라고 평가했습니다. 그는 모자이크가 있는 것으로 보아 이곳이 제사를 지내던 장소였을 것이라고 추측했습니다. 두 나라는 내년에 국립고궁박물관에서 퀼테페 유적 전시를 열 계획입니다.`},

  {id:`r1027-shubao`, category:`kids`, source:`경향신문`, date:`2026-10-27`,
   url:`https://www.khan.co.kr/article/202610271052001/`,
   origTitle:`아기 판다 슈바오, 30일 공개…쌍둥이 언니들과 마지막 동반 관람`,
   title:`아기 판다 '슈바오', 10월 30일부터 만날 수 있어요`,
   excerpt:`우리나라에서 태어난 네 번째 아기 판다 슈바오가 에버랜드에서 처음 관람객을 만나요.`,
   body:`지난 6월 3일 에버랜드에서 태어난 아기 판다 '슈바오'가 10월 30일부터 판다월드에서 관람객을 만납니다. 슈바오는 엄마 아이바오와 아빠 러바오 사이에서 태어난 암컷 판다로, 푸바오와 쌍둥이 루이바오·후이바오에 이어 우리나라에서 태어난 네 번째 아기 판다입니다. 태어날 때 171g이었던 몸무게는 지금 9kg이 넘었습니다.

'슈바오'라는 이름은 생후 100일을 맞아 국민 이름 공모로 정했고, 투표 22만 건 가운데 42%를 얻었습니다. 이름에는 '새벽빛처럼 밝은 보물'이라는 뜻이 담겨 있습니다. 에버랜드는 슈바오의 건강과 적응을 먼저 생각해 공개 시간과 관람 인원을 조금씩 늘릴 계획입니다.

쌍둥이 언니 루이바오와 후이바오는 중국으로 떠날 준비를 하고 있어, 에버랜드에서 볼 수 있는 마지막 날은 12월 11일로 예정돼 있습니다. '판다 할부지'로 불리는 강철원 사육사는 슈바오가 "엄마 아이바오에게 의지하면서도 스스로 주변을 살피고 탐색하며 조금씩 세상을 넓혀가고 있다"고 말했습니다.`},

  {id:`r1007-nuri`, category:`science`, source:`경향신문`, date:`2026-10-07`,
   url:`https://www.khan.co.kr/article/202610071506001`,
   origTitle:`누리호 5차 발사 성공…'대량 우주수송 시대' 서막 열렸다`,
   title:`누리호 5차 발사 성공, 위성 15기를 우주로 보냈어요`,
   excerpt:`우리 기술로 만든 로켓 누리호가 다섯 번째 발사에 성공했어요.`,
   body:`우리나라가 독자 기술로 개발한 우주 발사체 누리호가 10월 7일 낮 12시 25분 전남 고흥 나로우주센터에서 발사돼 성공했습니다. 이번 누리호에는 위성 15기가 실렸는데, 지금까지 누리호가 실은 위성 가운데 가장 많습니다. 누리호가 일정을 미루지 않고 예정된 시간에 바로 발사된 것도 이번이 처음입니다.

function articleDate(a, withYear, noWeekday){
  const p = String(a.date||'').split('-').map(Number);
  if(p.length !== 3 || !p[0]) return '';
  const wd = WEEKDAYS[new Date(Date.UTC(p[0], p[1]-1, p[2])).getUTCDay()];
  return (withYear ? p[0]+'년 ' : '') + p[1]+'월 '+p[2]+'일' + (noWeekday ? '' : ' ('+wd+')');
}

const hasStorage = (typeof window !== 'undefined') && !!window.storage;
const hasLocalStorage = (function(){
  try{ return (typeof window !== 'undefined') && !!window.localStorage; }catch(e){ return false; }
})();
const LS_PREFIX = 'kidsNewsLab:';

async function storageGet(key){
  if(hasStorage){
    try{
      const res = await window.storage.get(key, false);
      return res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ return null; }
  }
  if(hasLocalStorage){
    try{
      const raw = window.localStorage.getItem(LS_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  return null;
}
async function storageSet(key, value){
  if(hasStorage){
    try{ await window.storage.set(key, JSON.stringify(value), false); }catch(e){ /* ignore */ }
    return;
  }
  if(hasLocalStorage){
    try{ window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }catch(e){ /* ignore */ }
  }
}

async function loadProfile(){
  const p = await storageGet('profile');
  if(p) state.profile = Object.assign({
    points:0, bookmarks:[], readArticles:[], quizResults:{},
    streak:{count:0, lastDate:null}, masteredCategories:[], vocabNotebook:[],
    wrongAnswers:[], readDates:[]
  }, p);
  const cache = await storageGet(AI_CACHE_KEY);
  if(cache && typeof cache === 'object') state.aiCache = cache;
  const settings = await storageGet('settings');
  if(settings && settings.theme) state.theme = settings.theme;
  // 예전 버전에서 학생 브라우저에 저장했을 수 있는 API 키·옛 AI 결과는 지워요.
  if(hasLocalStorage){
    try{
      window.localStorage.removeItem(LS_PREFIX + 'api-settings');
      window.localStorage.removeItem(LS_PREFIX + 'ai-cache');
    }catch(e){}
  }
}

function escapeHtml(str){

    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg, ms){
  const c = document.getElementById('toast-container');
  if(!c) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 300);
  }, ms || 2400);
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yesterdayStr(){
  const d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function updateStreak(){
  const t = todayStr();
  if(!state.profile.streak) state.profile.streak = {count:0, lastDate:null};
  const s = state.profile.streak;
  if(s.lastDate === t) return;
  s.count = (s.lastDate === yesterdayStr()) ? s.count + 1 : 1;
  s.lastDate = t;
  if(!state.profile.readDates) state.profile.readDates = [];
  if(state.profile.readDates.indexOf(t) === -1) state.profile.readDates.push(t);
  saveProfile();
  if([3,7,14,30].indexOf(s.count) !== -1){
    addPoints(s.count * 2, s.count + '일 연속 출석 보너스');
    setTimeout(function(){ toast(s.count + '일 연속 출석! 정말 대단해요'); }, 300);
  } else if(s.count > 1){
    toast(s.count + '일째 연속으로 읽고 있어요');
  }
}

function categoryProgress(){
  const map = {};
  CATEGORIES.filter(function(c){ return c.id !== 'all'; }).forEach(function(c){
    const total = ARTICLES.filter(function(a){ return a.category === c.id; }).length;
    const read = ARTICLES.filter(function(a){ return a.category === c.id && state.profile.readArticles.indexOf(a.id) !== -1; }).length;
    map[c.id] = {read:read, total:total};
  });
  return map;
}
function categoryTier(read, total){
  const pct = total ? (read/total*100) : 0;
  if(total > 0 && read >= total) return {label:'마스터', step:4};
  if(pct >= 75) return {label:'전문 탐정', step:3};
  if(pct >= 40) return {label:'탐사 중', step:2};
  if(pct > 0)   return {label:'탐색 시작', step:1};
  return {label:'아직 안 읽음', step:0};
}
function checkCategoryMastery(category){
  const prog = categoryProgress()[category];
  if(!prog || prog.total === 0 || prog.read < prog.total) return;
  if(!state.profile.masteredCategories) state.profile.masteredCategories = [];
  if(state.profile.masteredCategories.indexOf(category) !== -1) return;
  state.profile.masteredCategories.push(category);
  saveProfile();

// AI 요청은 같은 사이트의 서버 함수(/api/ai)가 대신 보내요.
// API 키는 서버(Vercel 환경변수)에만 있고, 학생 브라우저에는 절대 저장되지 않아요.
function aiError(code, detail){
  const e = new Error(detail || code);
  e.code = code;
  return e;
}

async function callAI(type, article, level){
  if(location.protocol === 'file:') throw aiError('NO_SERVER', '파일을 직접 열면 서버 함수가 없어요.');
  let res;
  try{
    res = await fetch('/api/ai', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type:type, level:level || null, title:article.title, body:article.body})
    });
  }catch(e){
    throw aiError('NETWORK', e && e.message);
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 404) throw aiError('NO_SERVER', 'HTTP 404 — /api/ai 함수가 배포되지 않았어요.');
  if(!res.ok || !data || !data.ok) throw aiError((data && data.code) || 'UPSTREAM', 'HTTP ' + res.status);
  return data.data;
}

async function ensureAI(articleId, type, level){
  if(getCached(articleId, type, level)) return;
  const key = loadingKey(articleId, type, level);
  if(state.aiLoading[key]) return;
  state.aiLoading[key] = true;
  delete state.aiError[key];
  renderApp();
  const article = findArticle(articleId);
  try{
    const result = await callAI(type, article, level);
    setCached(articleId, type, level, result);
    if(type === 'easy'){
      let added = 0;
      (result.vocabulary||[]).forEach(function(v){
        if(!v || !v.word) return;
        const exists = state.profile.vocabNotebook.some(function(x){ return x.word === v.word; });
        if(!exists){
          state.profile.vocabNotebook.push({word:v.word, meaning:v.meaning, from:article.title});
          added++;
        }
      });
      if(added) saveProfile();
    }
    if(type !== 'quiz'){
      const tag = type + ':' + articleId;
      if(state.profile.readArticles.indexOf(tag) === -1){
        state.profile.readArticles.push(tag);
        addPoints(8, type === 'easy' ? '쉽게 읽기 완료' : '사실과 의견 살펴보기 완료');
      }
    }
  }catch(e){
    state.aiError[key] = {code:(e && e.code) || 'UPSTREAM', detail:(e && e.message) || ''};
  }finally{
    delete state.aiLoading[key];
    renderApp();
  }
}
function ensureEasy(articleId, level){ return ensureAI(articleId, 'easy', level); }
function ensureFacts(articleId){ return ensureAI(articleId, 'facts', null); }
function ensureQuiz(articleId){ return ensureAI(articleId, 'quiz', null); }

// 한 문장이 끝나면 줄을 바꿔서 보여 줘요. (따옴표 안의 문장부호는 문장 끝으로 보지 않아요)
function splitSentences(text){
  const out = [];
  String(text || '').split(/\n+/).forEach(function(line){
    line = line.trim();
    if(!line) return;
    let buf = '', inQuote = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      buf += ch;
      if(ch === '"' || ch === '“' || ch === '”') inQuote = (ch === '“') ? true : (ch === '”') ? false : !inQuote;
      if(!inQuote && (ch === '.' || ch === '?' || ch === '!') && (i === line.length - 1 || line[i+1] === ' ')){
        out.push(buf.trim()); buf = '';
      }
    }
    if(buf.trim()) out.push(buf.trim());
  });
  return out;
}
function sentencesHtml(text){
  return splitSentences(text).map(function(s){ return '<span class="sent">'+escapeHtml(s)+'</span>'; }).join('');
}
function readMinutes(a){ return Math.max(1, Math.ceil(a.body.replace(/\s/g,'').length / 200)); }

  // 아직 안 읽은 기사 중에서 날마다 하나씩 골라 추천해요.
  const unread = ARTICLES.filter(function(a){ return !isRead(a.id); });
  const pool = unread.length ? unread : ARTICLES;
  const d = new Date();
  const dayNo = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  const pick = pool[dayNo % pool.length];
  const ci = catInfo(pick.category);
  return '<article class="feat" data-action="go-article" data-id="'+pick.id+'"'+catStyle(pick.category)+'>' +
    '<span class="feat__k">오늘의 추천 기사</span>' +
    '<p class="feat__meta"><b>'+ci.label+'</b><span>'+escapeHtml(pick.source)+'</span><span>'+articleDate(pick, true)+'</span></p>' +
    '<h2>'+escapeHtml(pick.title)+'</h2>' +
    '<p class="feat__ex">'+escapeHtml(pick.excerpt)+'</p>' +
    '<button type="button" class="btn btn--ink" data-action="go-article" data-id="'+pick.id+'">기사 읽기'+ic('right')+'</button>' +
  '</article>';
}

function renderMyCard(){
  const r = getRank(state.profile.points);
  const readN = ARTICLES.filter(function(a){ return isRead(a.id); }).length;
  const streak = (state.profile.streak && state.profile.streak.count) || 0;
  const vocabN = (state.profile.vocabNotebook || []).length;
  return '<aside class="mycard" aria-label="내 탐정 수첩">' +
    '<p class="mycard__k">내 탐정 수첩</p>' +
    '<div class="mycard__h">'+avatar(r.cur)+'<div><b>'+r.cur.name+'</b><small>'+state.profile.points+'P'+(r.next ? ' · 다음 등급까지 '+(r.next.min - state.profile.points)+'P' : ' · 최고 등급')+'</small></div></div>' +
    '<span class="bar" role="progressbar" aria-label="다음 등급까지" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+rankPct(r)+'"><i style="width:'+rankPct(r)+'%"></i></span>' +
    '<dl>' +
      '<div><dt>읽은 기사</dt><dd>'+readN+' / '+ARTICLES.length+'</dd></div>' +
      '<div><dt>연속 출석</dt><dd>'+streak+'일</dd></div>' +
      '<div><dt>단어 수첩</dt><dd>'+vocabN+'개</dd></div>' +
    '</dl>' +
    '<button type="button" class="btn btn--line btn--full" data-action="go-mypage">수첩 열기</button>' +

function renderHome(){
  const all = filteredArticles();
  const q = state.search.trim();
  const isSearching = q !== '';
  const list = isSearching ? all : all.slice(0, state.listLimit);
  const remaining = all.length - list.length;
  const readCount = all.filter(function(a){ return isRead(a.id); }).length;
  const ci = catInfo(state.category);
  const title = isSearching ? '“'+escapeHtml(q)+'” 검색 결과' : (state.category === 'all' ? '전체 뉴스' : ci.label+' 뉴스');

  let body;
  if(!list.length){
    body = '<div class="empty">'+ic('search') +
      '<p><span class="sent">찾는 뉴스가 없어요.</span><span class="sent">다른 낱말로 찾아볼까요?</span></p>' +
      '<button type="button" class="btn btn--line btn--sm" data-action="clear-search">전체 뉴스 보기</button></div>';
  } else {
    body = '<div class="grid">' + list.map(renderNewsCard).join('') + '</div>' +
      (remaining > 0 ? '<div class="more"><button type="button" class="btn btn--line" data-action="show-more">뉴스 더 보기 <span class="more__n">'+remaining+'개</span></button></div>' : '');
  }

  const showTop = !isSearching && state.category === 'all';
  return (showTop ?
    '<section class="wrap intro">' +
      '<p class="intro__k">초등학생을 위한 AI 뉴스 읽기</p>' +
      '<h1>AI 어린이 뉴스 연구소</h1>' +
      '<p class="intro__line"><span class="clause">기사를 눈높이에 맞게 쉽게 설명해 주고,</span> <span class="clause">사실과 의견을 스스로 구별하는 힘을 길러 줘요.</span></p>' +
    '</section>' +
    '<section class="wrap top">'+renderFeatured()+renderMyCard()+'</section>' : '') +
  '<section class="wrap sec">' +
    '<div class="sec__h"><h2>'+title+' <small>'+all.length+'개</small></h2>' +
      (all.length ? '<span class="sec__r">읽은 뉴스 <b>'+readCount+'</b> / '+all.length+'</span>' : '') + '</div>' +
    body +

function levelLabel(){ return LEVELS.find(function(l){ return l.id === state.level; }).label; }

function thinkBox(question){
  if(!question) return '';
  return '<div class="think">'+ic('bulb')+'<div><b>생각해 볼 질문</b>'+sentencesHtml(question)+'</div></div>';

function aiNote(){
  return '<p class="ai-note">'+ic('spark')+'<span><span class="sent">이 내용은 AI가 만들었어요.</span><span class="sent">기사 원문과 비교하며 읽어 보세요.</span></span></p>';

function panelWrap(title, right, inner){
  return '<div class="panel" id="ai-panel"><div class="panel__h"><h3>'+title+'</h3>'+(right||'')+'</div>'+inner+'</div>';
}
function loadingBox(msg){
  return '<div class="load" role="status"><p class="load__t"><span class="spin"></span>'+escapeHtml(msg)+'</p>' +

function renderEasyPanel(article){
  const wrap = function(inner){ return panelWrap('쉽게 읽기', levelSeg(), inner); };
  const key = loadingKey(article.id,'easy',state.level);
  if(state.aiLoading[key]) return wrap(loadingBox('AI가 '+levelLabel()+' 눈높이로 다시 쓰고 있어요'));
  if(state.aiError[key]) return wrap(errorBox('easy', state.aiError[key]));
  const data = getCached(article.id,'easy',state.level);
  if(!data){
    ensureEasy(article.id, state.level);
    return wrap(loadingBox('AI가 기사를 쉽게 바꾸고 있어요'));
  }
  const lines = Array.isArray(data.simplified) ? data.simplified : [String(data.simplified || '')];
  const vocab = (data.vocabulary||[]).map(function(v){
    return '<div class="voc"><b>'+escapeHtml(v.word)+'</b>'+escapeHtml(v.meaning)+'</div>';
  }).join('');
  return wrap(
    '<div class="easy">'+lines.map(sentencesHtml).join('')+'</div>' +
    (vocab ? '<p class="sub">새로 배운 낱말 <small>단어 수첩에 저장했어요</small></p><div class="vocab">'+vocab+'</div>' : '') +
    thinkBox(data.question) + aiNote()
  );
}

function renderFactsPanel(article){
  const wrap = function(inner){ return panelWrap('사실과 의견', '<span class="ai-tag">AI가 나눈 결과</span>', inner); };
  const key = loadingKey(article.id,'facts',null);
  if(state.aiLoading[key]) return wrap(loadingBox('AI가 사실과 의견을 나누고 있어요'));
  if(state.aiError[key]) return wrap(errorBox('facts', state.aiError[key]));
  const data = getCached(article.id,'facts');
  if(!data){
    ensureFacts(article.id);
    return wrap(loadingBox('AI가 기사를 자세히 살펴보고 있어요'));
  }
  const facts = data.facts || [], opinions = data.opinions || [];
  const nf = facts.length, no = opinions.length;
  const pct = (nf + no) ? Math.round(nf / (nf + no) * 100) : 0;
  const item = function(it, o){
    return '<div class="fi'+(o?' o':'')+'"><span class="fi__tag">'+(o?'의견':'사실')+'</span>' +
      '<p>'+escapeHtml(it.content)+'</p><small>'+escapeHtml(it.reason)+'</small></div>';
  };
  return wrap(
    '<div class="ratio">' +
      '<div class="ratio__bar" role="img" aria-label="사실 '+nf+'개, 의견 '+no+'개"><i class="f" style="width:'+pct+'%"></i><i class="o" style="width:'+(100-pct)+'%"></i></div>' +
      '<div class="ratio__lg"><span><i class="f"></i>사실 <b>'+nf+'개</b></span><span><i class="o"></i>의견 <b>'+no+'개</b></span><span>사실 문장 <b>'+pct+'%</b></span></div>' +
    '</div>' +
    '<p class="sub">사실로 볼 수 있는 내용</p>' +
    (nf ? '<div class="fl">'+facts.map(function(f){ return item(f,false); }).join('')+'</div>' : '<p class="none">사실로 볼 수 있는 문장을 찾지 못했어요.</p>') +
    '<p class="sub">의견이나 생각이 담긴 내용</p>' +
    (no ? '<div class="fl">'+opinions.map(function(o){ return item(o,true); }).join('')+'</div>' : '<p class="none">이 기사에는 의견이 담긴 문장이 거의 없어요.</p>') +
    thinkBox(data.question) + aiNote()
  );
}

function renderQuizPanel(article){
  const wrap = function(inner){ return panelWrap('탐정 퀴즈', '<span class="ai-tag">AI가 만든 문제</span>', inner); };
  const key = loadingKey(article.id,'quiz',null);
  if(state.aiLoading[key]) return wrap(loadingBox('AI가 퀴즈를 만들고 있어요'));
  if(state.aiError[key]) return wrap(errorBox('quiz', state.aiError[key]));
  const data = getCached(article.id,'quiz');
  if(!data){
    ensureQuiz(article.id);
    return wrap(loadingBox('AI가 퀴즈를 준비하고 있어요'));
  }
  return wrap(renderQuizBody(article, data.quiz||[]));
}

function renderQuizBody(article, questions){
  const qs = state.quizState[article.id] || {answers:{}, submitted:false};
  state.quizState[article.id] = qs;
  const letters = ['1','2','3','4'];
  let score = 0;
  const qHtml = questions.map(function(q, qi){
    const selected = qs.answers[qi];
    const opts = (q.options||[]).map(function(opt, oi){
      let attrs = 'data-selected="'+(selected===oi?1:0)+'"';
      if(qs.submitted){
        if(oi === q.answerIndex) attrs += ' data-correct="1"';
        else if(selected === oi) attrs += ' data-wrong="1"';
      }
      return '<button type="button" class="opt" '+attrs+' '+(qs.submitted ? 'disabled' : 'data-action="quiz-select" data-id="'+article.id+'" data-qi="'+qi+'" data-oi="'+oi+'"')+'>' +
        '<span class="opt__l">'+letters[oi]+'</span><span>'+escapeHtml(opt)+'</span></button>';
    }).join('');
    const right = selected === q.answerIndex;
    if(qs.submitted && right) score++;
    return '<div class="q">' +
      '<p class="q__t"><span class="q__n">'+(qi+1)+'</span><span>'+escapeHtml(q.question)+'</span></p>' +
      '<div class="q__opts">'+opts+'</div>' +
      (qs.submitted ? '<p class="q__ex"><b>'+(right ? '정답이에요.' : '정답은 '+letters[q.answerIndex]+'번이에요.')+'</b> '+escapeHtml(q.explanation||'')+'</p>' : '') +
    '</div>';
  }).join('');
  const allAnswered = questions.every(function(q,qi){ return qs.answers[qi] !== undefined; });
  const foot = qs.submitted ?
    '<div class="qz__foot"><p class="qz__score">'+questions.length+'문제 중 <b>'+score+'문제</b>를 맞혔어요.</p>' +
      '<button type="button" class="btn btn--line btn--sm" data-action="quiz-retry" data-id="'+article.id+'">'+ic('refresh')+'다시 풀기</button></div>' :
    '<div class="qz__foot"><button type="button" class="btn btn--main" data-action="quiz-submit" data-id="'+article.id+'" '+(allAnswered?'':'disabled')+'>정답 확인하기</button>' +
      (allAnswered ? '' : '<span class="hint">모든 문제에 답해 주세요.</span>') + '</div>';
  return '<div class="qz">'+qHtml+'</div>' + foot;
}

function renderMyPage(){
  const r = getRank(state.profile.points);
  const pct = rankPct(r);
  const readCount = state.profile.readArticles.filter(function(x){ return !x.includes(':'); }).length;
  const bookmarkCount = state.profile.bookmarks.length;
  const streak = (state.profile.streak && state.profile.streak.count) || 0;
  let correct = 0, total = 0;
  Object.keys(state.profile.quizResults).forEach(function(k){
    correct += state.profile.quizResults[k].correct;
    total += state.profile.quizResults[k].total;
  });

  const catProg = categoryProgress();
  const progRows = CATEGORIES.filter(function(c){ return c.id !== 'all'; }).map(function(c){
    const p = catProg[c.id];
    const tier = categoryTier(p.read, p.total);
    const w = p.total ? Math.round(p.read / p.total * 100) : 0;
    return '<div class="pr"'+catStyle(c.id)+'>' +
      '<span class="pr__n"><i></i>'+c.label+'</span>' +
      '<span class="bar"><i style="width:'+w+'%"></i></span>' +
      '<span class="pr__t'+(tier.step === 4 ? ' is-top' : '')+'">'+tier.label+'</span>' +
      '<span class="pr__c"><b>'+p.read+'</b> / '+p.total+'</span>' +
    '</div>';
  }).join('');

  const rankRows = RANKS.map(function(rk){
    const on = state.profile.points >= rk.min;
    const now = rk.name === r.cur.name;
    return '<div class="rk'+(on ? ' is-on' : '')+(now ? ' is-now' : '')+'">' + avatar(rk) +
      '<div class="rk__t"><b>'+rk.name+'</b><small>'+rk.min+'P 이상</small></div>' +
      '<span class="rk__s">'+(now ? '지금 등급' : on ? '달성' : '아직')+'</span></div>';
  }).join('');

  const vocab = state.profile.vocabNotebook || [];
  const vocabHtml = vocab.length ?
    '<div class="vocab">' + vocab.slice().reverse().map(function(v){
      return '<div class="voc"><b>'+escapeHtml(v.word)+'</b>'+escapeHtml(v.meaning)+'</div>';
    }).join('') + '</div>' :
    '<p class="note"><span class="sent">기사에서 \'쉽게 읽기\'를 하면 새로 배운 낱말이 여기에 모여요.</span></p>';

  const wrongList = state.profile.wrongAnswers || [];
  const wrongHtml = wrongList.length ?
    '<div class="wn">' + wrongList.map(function(w){
      const opts = (w.options||[]).map(function(opt, oi){
        const cls = oi === w.answerIndex ? ' class="ok"' : (oi === w.userIndex ? ' class="no"' : '');
        return '<span'+cls+'>'+(oi+1)+'. '+escapeHtml(opt)+'</span>';
      }).join('');
      return '<div class="wn__c"><p class="wn__src">'+escapeHtml(w.articleTitle)+'</p>' +
        '<p class="wn__q">'+escapeHtml(w.question)+'</p><div class="wn__o">'+opts+'</div>' +
        '<p class="wn__ex">'+escapeHtml(w.explanation||'')+'</p></div>';
    }).join('') + '</div>' :
    '<p class="note"><span class="sent">아직 틀린 문제가 없어요.</span><span class="sent">탐정 퀴즈에서 틀린 문제가 여기 모여서 다시 복습할 수 있어요.</span></p>';

  const bookmarked = ARTICLES.filter(function(a){ return state.profile.bookmarks.includes(a.id); });
  const bookmarkHtml = bookmarked.length ?
    '<div class="grid">' + bookmarked.map(renderNewsCard).join('') + '</div>' :
    '<p class="note"><span class="sent">아직 스크랩한 기사가 없어요.</span><span class="sent">마음에 드는 기사에서 책갈피 단추를 눌러 보세요.</span></p>';

  const sec = function(title, count, inner){
    return '<section class="sec"><div class="sec__h"><h2>'+title+(count !== null ? ' <small>'+count+'개</small>' : '')+'</h2></div>'+inner+'</section>';
  };

  return '<div class="mp">' +
    '<section class="mp__hero">' + avatar(r.cur) +
      '<div class="mp__hi"><p class="mp__k">내 탐정 수첩</p><h1>'+r.cur.name+'</h1>' +
        '<p class="mp__p">'+state.profile.points+'P · '+(r.next ? '다음 등급 「'+r.next.name+'」까지 '+(r.next.min - state.profile.points)+'P' : '가장 높은 등급이에요')+'</p>' +
        '<span class="bar"><i style="width:'+pct+'%"></i></span></div>' +
    '</section>' +
    '<div class="stats">' +
      '<div class="stat"><b>'+readCount+'</b><span>읽은 기사</span></div>' +
      '<div class="stat"><b>'+bookmarkCount+'</b><span>스크랩한 기사</span></div>' +
      '<div class="stat"><b'+(total ? '' : ' class="muted"')+'>'+(total ? Math.round(correct/total*100)+'%' : '–')+'</b><span>퀴즈 정답률</span></div>' +
      '<div class="stat"><b>'+streak+'일</b><span>연속 출석</span></div>' +
    '</div>' +
    sec('분야별 읽기', null, '<div>'+progRows+'</div>') +
    sec('탐정 등급', null, '<div>'+rankRows+'</div>') +
    sec('읽기 달력', null, renderCalendar()) +
    sec('단어 수첩', vocab.length, vocabHtml) +
    sec('오답 노트', wrongList.length, wrongHtml) +
    sec('스크랩한 기사', bookmarked.length, bookmarkHtml) +
    '<div class="reset"><span>기록을 모두 지우고 처음부터 다시 시작할 수 있어요.</span>' +
      '<button type="button" class="btn btn--line btn--sm btn--danger" data-action="reset-data">기록 지우기</button></div>' +
  '</div>';
}

function renderCalendar(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + state.calendarOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayVal = todayStr();
  const readSet = state.profile.readDates || [];
  let cells = '';
  for(let i = 0; i < firstDow; i++) cells += '<span></span>';
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const on = readSet.indexOf(dateStr) !== -1;
    cells += '<span class="cal__c'+(on ? ' on' : '')+(dateStr === todayVal ? ' today' : '')+'">'+d+'</span>';
  }
  return '<div class="cal">' +
    '<div class="cal__h">' +
      '<button type="button" class="cal__nav" data-action="cal-prev" aria-label="이전 달">'+ic('left')+'</button>' +
      '<b>'+year+'년 '+(month+1)+'월</b>' +
      '<button type="button" class="cal__nav" data-action="cal-next" aria-label="다음 달" '+(state.calendarOffset < 0 ? '' : 'disabled')+'>'+ic('right')+'</button>' +
    '</div>' +
    '<div class="cal__g">' + WEEKDAYS.map(function(l){ return '<span class="cal__d">'+l+'</span>'; }).join('') + cells + '</div>' +
    '<p class="cal__lg"><i></i>뉴스를 읽은 날</p>' +
  '</div>';
}

/* =========================================================
   ROOT RENDER
========================================================= */
function renderApp(){
  document.documentElement.dataset.theme = state.theme;
  const main = document.getElementById('main');
  if(state.view === 'article') main.innerHTML = renderArticleView(state.articleId);
  else if(state.view === 'mypage') main.innerHTML = renderMyPage();
  else main.innerHTML = renderHome();

  renderHeaderBits();

  const modalRoot = document.getElementById('modal-root');
  if(state.badgeModal){
    const more = state.badgeQueue.length;
    modalRoot.innerHTML = '<div class="modal" data-action="close-badge-modal">' +
      '<div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<div class="modal__ic" aria-hidden="true">'+state.badgeModal.icon+'</div>' +
        '<p>'+escapeHtml(state.badgeModal.sub || '새로운 등급을 달성했어요!')+'</p>' +
        '<h3 id="modal-title">'+escapeHtml(state.badgeModal.name)+'</h3>' +
        '<button type="button" class="btn btn--main" data-action="close-badge-modal">'+(more ? '다음 축하 보기' : '확인')+'</button>' +
      '</div>' +
    '</div>';
  } else {
    modalRoot.innerHTML = '';
  }
  fitHeader();
}

/* =========================================================
   ACTIONS
========================================================= */
function goHome(){ stopSpeak(); state.view='home'; state.mode=null; window.scrollTo(0,0); renderApp(); }
function goArticle(id){ stopSpeak(); state.view='article'; state.articleId=id; state.mode=null; window.scrollTo(0,0); renderApp(); }
function goMyPage(){ stopSpeak(); state.view='mypage'; window.scrollTo(0,0); renderApp(); }

function speakArticle(article){
  if(!('speechSynthesis' in window)){ toast('이 브라우저는 읽어 주기를 지원하지 않아요'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(article.title + '. ' + article.body.replace(/\n+/g,' '));
  utter.lang = 'ko-KR';
  utter.rate = state.ttsRate;
  utter.onend = function(){ state.ttsSpeaking = false; renderApp(); };
  utter.onerror = function(){ state.ttsSpeaking = false; renderApp(); };
  window.speechSynthesis.speak(utter);
  state.ttsSpeaking = true;
}
function stopSpeak(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.ttsSpeaking = false;
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action === 'go-home') goHome();
  else if(action === 'go-mypage') goMyPage();
  else if(action === 'go-article') goArticle(el.getAttribute('data-id'));
  else if(action === 'set-category'){
    state.category = el.getAttribute('data-cat');
    state.listLimit = PAGE_SIZE;
    state.search = ''; document.getElementById('search-input').value = '';
    if(state.view !== 'home'){ stopSpeak(); state.view = 'home'; state.mode = null; }
    window.scrollTo(0,0);
    renderApp();
  }
  else if(action === 'show-more'){ state.listLimit += PAGE_SIZE; renderApp(); }
  else if(action === 'clear-search'){ state.search=''; state.category='all'; state.listLimit=PAGE_SIZE; document.getElementById('search-input').value=''; renderApp(); }
  else if(action === 'toggle-bookmark'){
    const id = el.getAttribute('data-id');
    const idx = state.profile.bookmarks.indexOf(id);
    if(idx === -1){ state.profile.bookmarks.push(id); toast('스크랩에 담았어요'); }
    else { state.profile.bookmarks.splice(idx,1); toast('스크랩을 해제했어요'); }
    saveProfile();
    renderApp();
  }
  else if(action === 'set-mode'){
    const m = el.getAttribute('data-mode');
    state.mode = (state.mode === m) ? null : m;
    renderApp();
    const panel = document.getElementById('ai-panel');
    if(panel) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if(action === 'set-level'){
    state.level = el.getAttribute('data-level');
    renderApp();
  }
  else if(action === 'retry-ai'){
    const type = el.getAttribute('data-type');
    const key = loadingKey(state.articleId, type, type==='easy'?state.level:null);
    delete state.aiError[key];
    if(type==='easy') ensureEasy(state.articleId, state.level);
    else if(type==='facts') ensureFacts(state.articleId);
    else if(type==='quiz') ensureQuiz(state.articleId);
    renderApp();
  }
  else if(action === 'toggle-quiz'){ state.mode = 'quiz'; renderApp(); }
  else if(action === 'quiz-select'){
    const id = el.getAttribute('data-id'), qi = +el.getAttribute('data-qi'), oi = +el.getAttribute('data-oi');
    if(!state.quizState[id]) state.quizState[id] = {answers:{}, submitted:false};
    if(!state.quizState[id].submitted){
      state.quizState[id].answers[qi] = oi;
      renderApp();
    }
  }
  else if(action === 'quiz-submit'){
    const id = el.getAttribute('data-id');
    const qs = state.quizState[id];
    const data = getCached(id,'quiz');
    if(qs && data){
      qs.submitted = true;
      let score = 0;
      const article = findArticle(id);
      if(!state.profile.wrongAnswers) state.profile.wrongAnswers = [];
      state.profile.wrongAnswers = state.profile.wrongAnswers.filter(function(w){ return w.articleId !== id; });
      (data.quiz||[]).forEach(function(q,qi){
        const isCorrect = qs.answers[qi] === q.answerIndex;
        if(isCorrect){ score++; }
        else{
          state.profile.wrongAnswers.push({
            articleId:id,
            articleTitle: article ? article.title : '',
            question:q.question,
            options:q.options,
            answerIndex:q.answerIndex,
            userIndex:qs.answers[qi],
            explanation:q.explanation
          });
        }
      });
      const total = (data.quiz||[]).length;
      const firstTime = !state.profile.quizResults[id];
      if(firstTime){
        state.profile.quizResults[id] = {correct:score, total:total};
        addPoints(score*7, '탐정 퀴즈 정답 '+score+'개');
      }
      saveProfile();
      renderApp();
    }
  }
  else if(action === 'quiz-retry'){
    const id = el.getAttribute('data-id');
    state.quizState[id] = {answers:{}, submitted:false};
    renderApp();
  }
  else if(action === 'tts-toggle'){
    const article = findArticle(state.articleId);
    if(state.ttsSpeaking) stopSpeak(); else speakArticle(article);
    renderApp();
  }
  else if(action === 'tts-rate'){
    state.ttsRate = +el.getAttribute('data-rate');
    if(state.ttsSpeaking){ speakArticle(findArticle(state.articleId)); }
    renderApp();
  }
  else if(action === 'font-size'){ state.fontSize = el.getAttribute('data-size'); renderApp(); }
  else if(action === 'cal-prev'){ state.calendarOffset -= 1; renderApp(); }
  else if(action === 'cal-next'){ state.calendarOffset = Math.min(0, state.calendarOffset + 1); renderApp(); }
  else if(action === 'toggle-theme'){
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    saveSettings();
    renderApp();
  }
  else if(action === 'reset-data'){
    if(confirm('정말 모든 기록(포인트, 등급, 스크랩, 단어 수첩, 오답노트 등)을 지울까요? 이 동작은 되돌릴 수 없어요.')){
      state.profile = {
        points:0, bookmarks:[], readArticles:[], quizResults:{},
        streak:{count:0, lastDate:null}, masteredCategories:[], vocabNotebook:[],
        wrongAnswers:[], readDates:[]
      };
      saveProfile();
      toast('기록을 초기화했어요');
      renderApp();
    }
  }
  else if(action === 'close-badge-modal'){ showNextBadge(); }
});

let searchTimer = null;
document.getElementById('search-input').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(function(){
    state.search = val;
    if(val.trim()) state.category = 'all';   // 검색은 모든 분야에서 찾아요
    if(state.view !== 'home') state.view = 'home';
    renderApp();
  }, 250);
});

/* =========================================================
   INIT
========================================================= */
async function init(){
  await loadProfile();
  renderApp();
  window.addEventListener('resize', fitHeader);
}
init();

})();
</script>
