];
function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0]; }

const LEVELS = [
  {id:'1-2', label:'1~2학년', desc:'초등학교 1~2학년 (한글을 막 뗀 수준이라고 가정하고, 아주 쉬운 낱말과 아주 짧은 문장만 사용)'},
  {id:'3-4', label:'3~4학년', desc:'초등학교 3~4학년 (일상적인 낱말은 이해 가능, 어려운 개념은 예를 들어 풀어서 설명)'},
  {id:'5-6', label:'5~6학년', desc:'초등학교 5~6학년 (조금 더 다양한 어휘를 사용해도 되고, 배경지식을 한 문장 정도 덧붙여도 됨)'},
];

const RANKS = [
  {min:0, name:'뉴스 새싹', icon:'🌱'},
  {min:20, name:'호기심 탐정', icon:'🧐'},
  {min:45, name:'초보 탐정', icon:'🔎'},
  {min:75, name:'길잡이 탐정', icon:'🧭'},
  {min:110, name:'뉴스 탐정', icon:'🕵️'},
  {min:150, name:'베테랑 탐정', icon:'🎯'},
  {min:195, name:'명탐정', icon:'🎖️'},
  {min:245, name:'수석 탐정', icon:'🏆'},
  {min:300, name:'뉴스 박사', icon:'👑'},
  {min:360, name:'전설의 탐정', icon:'🌟'},
];
function getRank(points){
  let cur = RANKS[0], next = RANKS[1] || null;
  for(let i=0;i<RANKS.length;i++){
    if(points >= RANKS[i].min){ cur = RANKS[i]; next = RANKS[i+1] || null; }
  }
  return {cur, next};
}

/* =========================================================
   기사 목록 — data/articles.js (매일 아침 검토한 새 기사가 더해져요)
========================================================= */
const NEWS = (window.NEWS_DATA && Array.isArray(window.NEWS_DATA.articles)) ? window.NEWS_DATA : {updated:'', articles:[]};
const ARTICLES = NEWS.articles.filter(function(a){ return a && a.id && a.title && a.body; });
ARTICLES.sort(function(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
// 가장 최근에 실은 기사 묶음에는 '새 기사' 표시를 붙여요 (처음 한꺼번에 실은 묶음은 빼요).
// '분야 둘러보기'용으로 모은 지난 기사(archive)는 새 기사 표시에서 빼요.
const DAILY = ARTICLES.filter(function(a){ return a.archive !== true; });
const LATEST_ADDED = DAILY.reduce(function(m, a){ return (a.added || '') > m ? a.added : m; }, '');
const NEW_IDS = (function(){
  const batch = DAILY.filter(function(a){ return a.added === LATEST_ADDED; });
  return batch.length < DAILY.length ? batch.map(function(a){ return a.id; }) : [];
})();
function isNew(a){ return NEW_IDS.indexOf(a.id) !== -1; }
function findArticle(id){ return ARTICLES.find(a=>a.id===id); }
const WEEKDAYS = ['일','월','화','수','목','금','토'];
function articleDate(a, withYear, noWeekday){
  const p = String(a.date||'').split('-').map(Number);
  if(p.length !== 3 || !p[0]) return '';
  const wd = WEEKDAYS[new Date(Date.UTC(p[0], p[1]-1, p[2])).getUTCDay()];
  return (withYear ? p[0]+'년 ' : '') + p[1]+'월 '+p[2]+'일' + (noWeekday ? '' : ' ('+wd+')');
}
function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : ''; }

/* =========================================================
   STATE
========================================================= */
let state = {
  view:'home',            // 'home' | 'article' | 'mypage'
  articleId:null,
  category:'all',
  search:'',
  listLimit:9,
  mode:null,               // 'easy' | 'facts'
  level:'3-4',
  fontSize:'md',
  ttsSpeaking:false,
  ttsRate:1,
  theme:'dark',             // 'dark'(기본) | 'light'
  calendarOffset:0,          // months from current month (mypage calendar)
  aiCache:{},               // { [articleId]: { easy:{ '1-2':{...} }, facts:{...}, quiz:{...} } }
  aiLoading:{},              // { 'articleId:type:level': true }
  aiError:{},
  quizState:{},              // { [articleId]: {answers:{}, submitted:false} }
  profile:{
    points:0, bookmarks:[], readArticles:[], quizResults:{},
    streak:{count:0, lastDate:null},
    masteredCategories:[],
    vocabNotebook:[],        // [{word, meaning, from}]
    wrongAnswers:[],          // [{articleId, articleTitle, question, options, answerIndex, userIndex, explanation}]
    readDates:[],              // ['2026-08-11', ...] for the reading calendar
    wordStatus:{},             // { 낱말: 'known' | 'again' }
    foResults:{},              // { articleId: {correct, total} } 사실·의견 가려내기
    thoughts:{},               // { articleId: {text, date, title} } 생각 쓰기
    actDone:{},                // { articleId: {words:true} }
    practiceBest:{},           // { wordquiz: 7, fo: 8 } 공부방 최고 기록
    practiceDay:{}             // { wordquiz: '2026-11-18' } 하루 한 번 연습 포인트
  },
  badgeModal:null,
  study:{mode:null},         // 공부방: {mode:'cards'|'wordquiz'|'fo', ...}
  foState:{},                // { articleId: {answers:{}, submitted} }
  thinkDraft:{},             // { articleId: '쓰는 중인 글' }
  wordPop:null,              // 본문 밑줄 낱말을 눌렀을 때 보여 줄 뜻
  badgeQueue:[],
  unreadOnly:false,          // '안 읽은 뉴스만' 보기
};

const FONT_SIZES = {sm:'15px', md:'17px', lg:'19px', xl:'21px'};
const PAGE_SIZE = 9;
const AI_CACHE_KEY = 'ai-cache-v2';

/* =========================================================
   STORAGE
========================================================= */
const hasStorage = (typeof window !== 'undefined') && !!window.storage;
const hasLocalStorage = (function(){
  try{ return (typeof window !== 'undefined') && !!window.localStorage; }catch(e){ return false; }
})();
const LS_PREFIX = 'kidsNewsLab:';

async function storageGet(key){
  if(hasStorage){
    try{
      const res = await window.storage.get(key, false);
      return res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ return null; }
  }
  if(hasLocalStorage){
    try{
      const raw = window.localStorage.getItem(LS_PREFIX + key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  return null;
}
async function storageSet(key, value){
  if(hasStorage){
    try{ await window.storage.set(key, JSON.stringify(value), false); }catch(e){ /* ignore */ }
    return;
  }
  if(hasLocalStorage){
    try{ window.localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); }catch(e){ /* ignore */ }
  }
}

async function loadProfile(){
  const p = await storageGet('profile');
  if(p) state.profile = Object.assign({
    points:0, bookmarks:[], readArticles:[], quizResults:{},
    streak:{count:0, lastDate:null}, masteredCategories:[], vocabNotebook:[],
    wrongAnswers:[], readDates:[],
    wordStatus:{}, foResults:{}, thoughts:{}, actDone:{}, practiceBest:{}, practiceDay:{},
    achievements:[], missionDays:0, bestStreak:0, grade:''
  }, p);
  // 학년을 골라 두었으면 'AI 쉽게 읽기'도 그 학년 눈높이로 시작해요.
  if(LEVELS.some(function(l){ return l.id === state.profile.grade; })) state.level = state.profile.grade;
  const cache = await storageGet(AI_CACHE_KEY);
  if(cache && typeof cache === 'object') state.aiCache = cache;
  const settings = await storageGet('settings');
  if(settings && settings.theme) state.theme = settings.theme;
  // 예전 버전에서 학생 브라우저에 저장했을 수 있는 API 키·옛 AI 결과는 지워요.
  if(hasLocalStorage){
    try{
      window.localStorage.removeItem(LS_PREFIX + 'api-settings');
      window.localStorage.removeItem(LS_PREFIX + 'ai-cache');
    }catch(e){}
  }
}
function saveProfile(){ storageSet('profile', state.profile); }
function saveCache(){ storageSet(AI_CACHE_KEY, state.aiCache); }
function saveSettings(){ storageSet('settings', {theme: state.theme}); }

/* =========================================================
   UTIL
========================================================= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg, ms){
  const c = document.getElementById('toast-container');
  if(!c) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){
    el.classList.remove('show');
    setTimeout(function(){ el.remove(); }, 300);
  }, ms || 2400);
}

function queueBadge(badge){
  state.badgeQueue.push(badge);
  if(!state.badgeModal) showNextBadge();
}
function showNextBadge(){
  state.badgeModal = state.badgeQueue.shift() || null;
  renderApp();
}

function addPoints(n, reason){
  const before = getRank(state.profile.points).cur;
  state.profile.points += n;
  const after = getRank(state.profile.points).cur;
  saveProfile();
  toast('+' + n + 'P · ' + (reason || ''));
  if(after.name !== before.name){
    setTimeout(function(){ queueBadge({icon:after.icon, name:after.name, sub:'새로운 탐정 등급을 달성했어요!'}); }, 500);
  }
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function yesterdayStr(){
  const d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function updateStreak(){
  const t = todayStr();
  if(!state.profile.streak) state.profile.streak = {count:0, lastDate:null};
  const s = state.profile.streak;
  if(s.lastDate === t) return;
  s.count = (s.lastDate === yesterdayStr()) ? s.count + 1 : 1;
  s.lastDate = t;
  state.profile.bestStreak = Math.max(state.profile.bestStreak || 0, s.count);
  if(!state.profile.readDates) state.profile.readDates = [];
  if(state.profile.readDates.indexOf(t) === -1) state.profile.readDates.push(t);
  saveProfile();
  if([3,7,14,30].indexOf(s.count) !== -1){
    addPoints(s.count * 2, s.count + '일 연속 출석 보너스');
    setTimeout(function(){ toast(s.count + '일 연속 출석! 정말 대단해요'); }, 300);
  } else if(s.count > 1){
    toast(s.count + '일째 연속으로 읽고 있어요');
  }
}

function categoryProgress(){
  const map = {};
  CATEGORIES.filter(function(c){ return c.id !== 'all'; }).forEach(function(c){
    const total = ARTICLES.filter(function(a){ return a.category === c.id; }).length;
    const read = ARTICLES.filter(function(a){ return a.category === c.id && state.profile.readArticles.indexOf(a.id) !== -1; }).length;
    map[c.id] = {read:read, total:total};
  });
  return map;
}
function categoryTier(read, total){
  const pct = total ? (read/total*100) : 0;
  if(total > 0 && read >= total) return {label:'마스터', step:4};
  if(pct >= 75) return {label:'전문 탐정', step:3};
  if(pct >= 40) return {label:'탐사 중', step:2};
  if(pct > 0)   return {label:'탐색 시작', step:1};
  return {label:'아직 안 읽음', step:0};
}
function checkCategoryMastery(category){
  const prog = categoryProgress()[category];
  if(!prog || prog.total === 0 || prog.read < prog.total) return;
  if(!state.profile.masteredCategories) state.profile.masteredCategories = [];
  if(state.profile.masteredCategories.indexOf(category) !== -1) return;
  state.profile.masteredCategories.push(category);
  saveProfile();
  const ci = catInfo(category);
  addPoints(15, ci.label + ' 분야 마스터');
  setTimeout(function(){ queueBadge({icon:'🏅', name:ci.label+' 마스터 탐정', sub:'이 분야 기사를 모두 읽었어요!'}); }, 700);
}

function markRead(articleId){
  updateStreak();
  bumpDaily('read', articleId);
  if(state.profile.readArticles.indexOf(articleId) === -1){
    state.profile.readArticles.push(articleId);
    addPoints(10, '기사를 읽었어요');
    const article = findArticle(articleId);
    if(article) checkCategoryMastery(article.category);
  }
}

function cacheKey(type, level){ return type + (level ? ':' + level : ''); }
function getCached(articleId, type, level){
  const a = state.aiCache[articleId];
  if(!a) return null;
  if(type === 'easy') return (a.easy && a.easy[level]) || null;
  return a[type] || null;
}
function setCached(articleId, type, level, value){
  if(!state.aiCache[articleId]) state.aiCache[articleId] = {};
  if(type === 'easy'){
    if(!state.aiCache[articleId].easy) state.aiCache[articleId].easy = {};
    state.aiCache[articleId].easy[level] = value;
  } else {
    state.aiCache[articleId][type] = value;
  }
  saveCache();
}
function loadingKey(articleId, type, level){ return articleId + ':' + type + ':' + (level||''); }

/* =========================================================
   AI CALLS
========================================================= */
// AI 요청은 같은 사이트의 서버 함수(/api/ai)가 대신 보내요.
// API 키는 서버(Vercel 환경변수)에만 있고, 학생 브라우저에는 절대 저장되지 않아요.
function aiError(code, detail){
  const e = new Error(detail || code);
  e.code = code;
  return e;
}

// 'AI 쉽게 읽기'와 'AI 문장 분석'은 기사를 실을 때 AI(Claude)가 미리 만들어 둔 자료(data/ai/<id>.json)를 읽어요.
// 그래서 API 키가 없어도 바로 보여 줄 수 있어요. 자료가 없으면 기사의 핵심 낱말·사실·의견 문장으로 대신 보여 줘요.
const premade = {};
async function loadPremade(id){
  if(premade[id] !== undefined) return premade[id];
  try{
    const r = await fetch('data/ai/'+encodeURIComponent(id)+'.json', {cache:'no-cache'});
    premade[id] = r.ok ? await r.json() : null;
  }catch(e){ premade[id] = null; }
  return premade[id];
}
function localAI(type, article, level){
  if(type === 'facts'){
    const fo = article.fo || [];
    return {
      facts: fo.filter(function(f){ return f.type === 'fact'; }).map(function(f){ return {content:f.text, reason:f.reason}; }),
      opinions: fo.filter(function(f){ return f.type === 'opinion'; }).map(function(f){ return {content:f.text, reason:f.reason}; }),
      question: article.think || ''
    };
  }
  const per = level === '1-2' ? 1 : level === '3-4' ? 2 : 99;
  const lines = [];
  String(article.body || '').split(/\n\n+/).forEach(function(p){ splitSentences(p).slice(0, per).forEach(function(x){ lines.push(x); }); });
  return { simplified: lines, vocabulary: (article.words || []).slice(0, 4), question: article.think || '' };
}
async function callAI(type, article, level){
  if(type === 'easy' || type === 'facts'){
    const pm = await loadPremade(article.id);
    if(pm && type === 'easy' && pm.easy && pm.easy[level]) return pm.easy[level];
    if(pm && type === 'facts' && pm.facts) return pm.facts;
    return localAI(type, article, level);
  }
  if(location.protocol === 'file:') throw aiError('NO_SERVER', '파일을 직접 열면 서버 함수가 없어요.');
  let res;
  try{
    res = await fetch('/api/ai', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({type:type, level:level || null, title:article.title, body:article.body})
    });
  }catch(e){
    throw aiError('NETWORK', e && e.message);
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.status === 404) throw aiError('NO_SERVER', 'HTTP 404 — /api/ai 함수가 배포되지 않았어요.');
  if(!res.ok || !data || !data.ok) throw aiError((data && data.code) || 'UPSTREAM', 'HTTP ' + res.status);
  return data.data;
}

async function ensureAI(articleId, type, level){
  if(getCached(articleId, type, level)) return;
  const key = loadingKey(articleId, type, level);
  if(state.aiLoading[key]) return;
  state.aiLoading[key] = true;
  delete state.aiError[key];
  renderApp();
  const article = findArticle(articleId);
  try{
    const result = await callAI(type, article, level);
    setCached(articleId, type, level, result);
    if(type === 'easy'){
      let added = 0;
      (result.vocabulary||[]).forEach(function(v){
        if(!v || !v.word) return;
        const exists = state.profile.vocabNotebook.some(function(x){ return x.word === v.word; });
        if(!exists){
          state.profile.vocabNotebook.push({word:v.word, meaning:v.meaning, from:article.title});
          added++;
        }
      });
      if(added) saveProfile();
    }
    if(type !== 'quiz'){
      const tag = type + ':' + articleId;
      if(state.profile.readArticles.indexOf(tag) === -1){
        state.profile.readArticles.push(tag);
        addPoints(8, type === 'easy' ? '쉽게 읽기 완료' : '사실과 의견 살펴보기 완료');
      }
    }
  }catch(e){
    state.aiError[key] = {code:(e && e.code) || 'UPSTREAM', detail:(e && e.message) || ''};
  }finally{
    delete state.aiLoading[key];
    renderApp();
  }
}

// 한 문장이 끝나면 줄을 바꿔서 보여 줘요. (따옴표 안의 문장부호는 문장 끝으로 보지 않아요)
function splitSentences(text){
  const out = [];
  String(text || '').split(/\n+/).forEach(function(line){
    line = line.trim();
    if(!line) return;
    let buf = '', inQuote = false;
    for(let i = 0; i < line.length; i++){
      const ch = line[i];
      buf += ch;
      if(ch === '"' || ch === '“' || ch === '”') inQuote = (ch === '“') ? true : (ch === '”') ? false : !inQuote;
      if(!inQuote && (ch === '.' || ch === '?' || ch === '!') && (i === line.length - 1 || line[i+1] === ' ')){
        out.push(buf.trim()); buf = '';
      }
    }
    if(buf.trim()) out.push(buf.trim());
  });
  return out;
}
function sentencesHtml(text){
  return splitSentences(text).map(function(s){ return '<span class="sent">'+escapeHtml(s)+'</span>'; }).join('');
}
function readMinutes(a){ return Math.max(1, Math.ceil(a.body.replace(/\s/g,'').length / 200)); }

function renderFactsPanel(article){
  const wrap = function(inner){ return panelWrap('사실과 의견', '<span class="ai-tag">AI가 나눈 결과</span>', inner); };
  const key = loadingKey(article.id,'facts',null);
  if(state.aiLoading[key]) return wrap(loadingBox('AI가 사실과 의견을 나누고 있어요'));
  if(state.aiError[key]) return wrap(errorBox('facts', state.aiError[key]));
  const data = getCached(article.id,'facts');
  if(!data){
    ensureFacts(article.id);
    return wrap(loadingBox('AI가 기사를 자세히 살펴보고 있어요'));
  }
  const facts = data.facts || [], opinions = data.opinions || [];
  const nf = facts.length, no = opinions.length;
  const pct = (nf + no) ? Math.round(nf / (nf + no) * 100) : 0;
  const item = function(it, o){
    return '<div class="fi'+(o?' o':'')+'"><span class="fi__tag">'+(o?'의견':'사실')+'</span>' +
      '<p>'+escapeHtml(it.content)+'</p><small>'+escapeHtml(it.reason)+'</small></div>';
  };
  return wrap(
    '<div class="ratio">' +
      '<div class="ratio__bar" role="img" aria-label="사실 '+nf+'개, 의견 '+no+'개"><i class="f" style="width:'+pct+'%"></i><i class="o" style="width:'+(100-pct)+'%"></i></div>' +
      '<div class="ratio__lg"><span><i class="f"></i>사실 <b>'+nf+'개</b></span><span><i class="o"></i>의견 <b>'+no+'개</b></span><span>사실 문장 <b>'+pct+'%</b></span></div>' +
    '</div>' +
    '<p class="sub">사실로 볼 수 있는 내용</p>' +
    (nf ? '<div class="fl">'+facts.map(function(f){ return item(f,false); }).join('')+'</div>' : '<p class="none">사실로 볼 수 있는 문장을 찾지 못했어요.</p>') +
    '<p class="sub">의견이나 생각이 담긴 내용</p>' +
    (no ? '<div class="fl">'+opinions.map(function(o){ return item(o,true); }).join('')+'</div>' : '<p class="none">이 기사에는 의견이 담긴 문장이 거의 없어요.</p>') +
    thinkBox(data.question) + aiNote()
  );
}

function renderQuizPanel(article){
  const wrap = function(inner){ return panelWrap('탐정 퀴즈', '<span class="ai-tag">AI가 만든 문제</span>', inner); };
  const key = loadingKey(article.id,'quiz',null);
  if(state.aiLoading[key]) return wrap(loadingBox('AI가 퀴즈를 만들고 있어요'));
  if(state.aiError[key]) return wrap(errorBox('quiz', state.aiError[key]));
  const data = getCached(article.id,'quiz');
  if(!data){
    ensureQuiz(article.id);
    return wrap(loadingBox('AI가 퀴즈를 준비하고 있어요'));
  }
  return wrap(renderQuizBody(article, data.quiz||[]));
}

function renderQuizBody(article, questions){
  const qs = state.quizState[article.id] || {answers:{}, submitted:false};
  state.quizState[article.id] = qs;
  const letters = ['1','2','3','4'];
  let score = 0;
  const qHtml = questions.map(function(q, qi){
    const selected = qs.answers[qi];
    const opts = (q.options||[]).map(function(opt, oi){
      let attrs = 'data-selected="'+(selected===oi?1:0)+'"';
      if(qs.submitted){
        if(oi === q.answerIndex) attrs += ' data-correct="1"';
        else if(selected === oi) attrs += ' data-wrong="1"';
      }
      return '<button type="button" class="opt" '+attrs+' '+(qs.submitted ? 'disabled' : 'data-action="quiz-select" data-id="'+article.id+'" data-qi="'+qi+'" data-oi="'+oi+'"')+'>' +
        '<span class="opt__l">'+letters[oi]+'</span><span>'+escapeHtml(opt)+'</span></button>';
    }).join('');
    const right = selected === q.answerIndex;
    if(qs.submitted && right) score++;
    return '<div class="q">' +
      '<p class="q__t"><span class="q__n">'+(qi+1)+'</span><span>'+escapeHtml(q.question)+'</span></p>' +
      '<div class="q__opts">'+opts+'</div>' +
      (qs.submitted ? '<p class="q__ex"><b>'+(right ? '정답이에요.' : '정답은 '+letters[q.answerIndex]+'번이에요.')+'</b> '+escapeHtml(q.explanation||'')+'</p>' : '') +
    '</div>';
  }).join('');
  const allAnswered = questions.every(function(q,qi){ return qs.answers[qi] !== undefined; });
  const foot = qs.submitted ?
    '<div class="qz__foot"><p class="qz__score">'+questions.length+'문제 중 <b>'+score+'문제</b>를 맞혔어요.</p>' +
      '<button type="button" class="btn btn--line btn--sm" data-action="quiz-retry" data-id="'+article.id+'">'+ic('refresh')+'다시 풀기</button></div>' :
    '<div class="qz__foot"><button type="button" class="btn btn--main" data-action="quiz-submit" data-id="'+article.id+'" '+(allAnswered?'':'disabled')+'>정답 확인하기</button>' +
      (allAnswered ? '' : '<span class="hint">모든 문제에 답해 주세요.</span>') + '</div>';
  return '<div class="qz">'+qHtml+'</div>' + foot;
}

function renderMyPage(){
  const r = getRank(state.profile.points);
  const pct = rankPct(r);
  const readCount = state.profile.readArticles.filter(function(x){ return !x.includes(':'); }).length;
  const bookmarkCount = state.profile.bookmarks.length;
  const streak = (state.profile.streak && state.profile.streak.count) || 0;
  let correct = 0, total = 0;
  Object.keys(state.profile.quizResults).forEach(function(k){
    correct += state.profile.quizResults[k].correct;
    total += state.profile.quizResults[k].total;
  });

  const catProg = categoryProgress();
  const progRows = CATEGORIES.filter(function(c){ return c.id !== 'all'; }).map(function(c){
    const p = catProg[c.id];
    const tier = categoryTier(p.read, p.total);
    const w = p.total ? Math.round(p.read / p.total * 100) : 0;
    return '<div class="pr"'+catStyle(c.id)+'>' +
      '<span class="pr__n"><i></i>'+c.label+'</span>' +
      '<span class="bar"><i style="width:'+w+'%"></i></span>' +
      '<span class="pr__t'+(tier.step === 4 ? ' is-top' : '')+'">'+(p.total ? tier.label : '기사 없음')+'</span>' +
      '<span class="pr__c"><b>'+p.read+'</b> / '+p.total+'</span>' +
    '</div>';
  }).join('');

  const rankRows = RANKS.map(function(rk){
    const on = state.profile.points >= rk.min;
    const now = rk.name === r.cur.name;
    return '<div class="rk'+(on ? ' is-on' : '')+(now ? ' is-now' : '')+'">' + avatar(rk) +
      '<div class="rk__t"><b>'+rk.name+'</b><small>'+rk.min+'P 이상</small></div>' +
      '<span class="rk__s">'+(now ? '지금 등급' : on ? '달성' : '아직')+'</span></div>';
  }).join('');

  const bank = wordBank();
  const known = bank.filter(function(w){ return wordStatus(w.word) === 'known'; });
  const vocabHtml = known.length ?
    '<div class="vocab">' + known.map(function(v){
      return '<div class="voc"><b>'+escapeHtml(v.word)+'</b>'+escapeHtml(v.meaning)+'</div>';
    }).join('') + '</div>' :
    '<p class="note"><span class="sent">공부방의 낱말 카드에서 \'알아요\'를 누른 낱말이 여기에 모여요.</span><span class="sent">기사 속 밑줄 낱말을 눌러도 뜻을 볼 수 있어요.</span></p>';
  const thoughts = Object.keys(state.profile.thoughts || {}).map(function(id){
    const t = state.profile.thoughts[id]; const a = findArticle(id);
    return {id:id, text:t.text, date:t.date, title: a ? a.title : (t.title || '지난 기사')};
  }).sort(function(x, y){ return x.date < y.date ? 1 : -1; });
  const thoughtHtml = thoughts.length ?
    '<div class="wn">' + thoughts.map(function(t){
      return '<div class="wn__c"><p class="wn__src">'+escapeHtml(t.title)+' · '+escapeHtml(t.date)+'</p><p class="tn-text">'+escapeHtml(t.text)+'</p></div>';
    }).join('') + '</div>' :
    '<p class="note"><span class="sent">기사의 학습 활동에서 \'생각 쓰기\'를 하면 여기에 모여요.</span></p>';

  const wrongList = state.profile.wrongAnswers || [];
  const wrongHtml = wrongList.length ?
    '<div class="wn">' + wrongList.map(function(w){
      const opts = (w.options||[]).map(function(opt, oi){
        const cls = oi === w.answerIndex ? ' class="ok"' : (oi === w.userIndex ? ' class="no"' : '');
        return '<span'+cls+'>'+(oi+1)+'. '+escapeHtml(opt)+'</span>';
      }).join('');
      return '<div class="wn__c"><p class="wn__src">'+escapeHtml(w.articleTitle)+'</p>' +
        '<p class="wn__q">'+escapeHtml(w.question)+'</p><div class="wn__o">'+opts+'</div>' +
        '<p class="wn__ex">'+escapeHtml(w.explanation||'')+'</p></div>';
    }).join('') + '</div>' :
    '<p class="note"><span class="sent">아직 틀린 문제가 없어요.</span><span class="sent">탐정 퀴즈에서 틀린 문제가 여기 모여서 다시 복습할 수 있어요.</span></p>';

  const bookmarked = ARTICLES.filter(function(a){ return state.profile.bookmarks.includes(a.id); });
  const bookmarkHtml = bookmarked.length ?
    '<div class="grid">' + bookmarked.map(renderNewsCard).join('') + '</div>' :
    '<p class="note"><span class="sent">아직 스크랩한 기사가 없어요.</span><span class="sent">마음에 드는 기사에서 책갈피 단추를 눌러 보세요.</span></p>';

  const sec = function(title, count, inner){
    return '<section class="sec"><div class="sec__h"><h2>'+title+(count !== null ? ' <small>'+count+'개</small>' : '')+'</h2></div>'+inner+'</section>';
  };

  return '<div class="mp">' +
    '<section class="mp__hero">' + avatar(r.cur) +
      '<div class="mp__hi"><p class="mp__k">내 탐정 수첩</p><h1>'+r.cur.name+'</h1>' +
        '<p class="mp__p">'+state.profile.points+'P · '+(r.next ? '다음 등급 「'+r.next.name+'」까지 '+(r.next.min - state.profile.points)+'P' : '가장 높은 등급이에요')+'</p>' +
        '<span class="bar"><i style="width:'+pct+'%"></i></span></div>' +
    '</section>' +
    '<div class="stats">' +
      '<div class="stat"><b>'+readCount+'</b><span>읽은 기사</span></div>' +
      '<div class="stat"><b>'+known.length+'</b><span>외운 낱말</span></div>' +
      '<div class="stat"><b'+(total ? '' : ' class="muted"')+'>'+(total ? Math.round(correct/total*100)+'%' : '–')+'</b><span>퀴즈 정답률</span></div>' +
      '<div class="stat"><b>'+streak+'일</b><span>연속 출석</span></div>' +
    '</div>' +
    '<section class="sec"><div class="sec__h"><h2>배지 모음 <small>'+(state.profile.achievements || []).length+' / '+ACHIEVEMENTS.length+'</small></h2><span class="sec__r">기사 읽기·낱말·퀴즈·미션으로 모아요</span></div>'+renderBadges()+'</section>' +
    sec('분야별 읽기', null, '<div>'+progRows+'</div>') +
    sec('탐정 등급', null, '<div>'+rankRows+'</div>') +
    sec('읽기 달력', null, renderCalendar()) +
    sec('낱말 수첩', known.length, vocabHtml) +
    sec('생각 노트', thoughts.length, thoughtHtml) +
    sec('오답 노트', wrongList.length, wrongHtml) +
    sec('스크랩한 기사', bookmarked.length, bookmarkHtml) +
    '<div class="reset"><span>기록을 모두 지우고 처음부터 다시 시작할 수 있어요.</span>' +
      '<button type="button" class="btn btn--line btn--sm btn--danger" data-action="reset-data">기록 지우기</button></div>' +
  '</div>';
}

function renderCalendar(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + state.calendarOffset);
  const year = base.getFullYear();
  const month = base.getMonth();
  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayVal = todayStr();
  const readSet = state.profile.readDates || [];
  let cells = '';
  for(let i = 0; i < firstDow; i++) cells += '<span></span>';
  for(let d = 1; d <= daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const on = readSet.indexOf(dateStr) !== -1;

function levelText(lv, long){
  const t = {'1-6':'모든 학년', '3-6':'3학년 이상', '5-6':'5~6학년'}[lv] || '';
  return long && t ? t + ' 추천' : t;
}
function wordStatus(word){ return (state.profile.wordStatus || {})[word] || ''; }
function exampleFor(a, word){
  const s = splitSentences(a.body).find(function(x){ return x.indexOf(word) !== -1; });
  return s || '';
}
// 모든 기사의 핵심 낱말 + 'AI 쉽게 읽기'에서 모은 낱말 (같은 낱말은 한 번만)
function wordBank(){
  const seen = {}, list = [];
  ARTICLES.forEach(function(a){
    (a.words || []).forEach(function(w){
      if(!w || !w.word || seen[w.word]) return;
      seen[w.word] = true;
      list.push({word:w.word, meaning:w.meaning, example:exampleFor(a, w.word), articleId:a.id, articleTitle:a.title});
    });
  });
  (state.profile.vocabNotebook || []).forEach(function(v){
    if(!v || !v.word || seen[v.word]) return;
    seen[v.word] = true;
    list.push({word:v.word, meaning:v.meaning, example:'', articleId:null, articleTitle:v.from || ''});
  });
  return list;
}
function allFoItems(){
  const out = [];
  ARTICLES.forEach(function(a){ (a.fo || []).forEach(function(f){ out.push({text:f.text, type:f.type, reason:f.reason, from:a.title, id:a.id}); }); });
  return out;
}
// 낱말 끝 글자에 받침이 있으면 '이에요', 없으면 '예요'
function hasBatchim(word){
  const c = String(word || '').trim().slice(-1).charCodeAt(0);
  return c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 !== 0 : false;
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function markOne(sentence, word){
  const p = sentence.indexOf(word);
  if(p < 0) return escapeHtml(sentence);
  return escapeHtml(sentence.slice(0, p)) + '<mark>' + escapeHtml(word) + '</mark>' + escapeHtml(sentence.slice(p + word.length));
}
// 본문에서 핵심 낱말이 처음 나오는 곳에 밑줄 단추를 달아요.
function markWords(sentence, words, used, aid){
  const hits = [];
  words.forEach(function(w){
    if(used[w.i]) return;
    const p = sentence.indexOf(w.word);
    if(p === -1) return;
    if(hits.some(function(h){ return p < h.end && p + w.word.length > h.start; })) return;
    hits.push({start:p, end:p + w.word.length, i:w.i});
    used[w.i] = true;
  });
  hits.sort(function(x, y){ return x.start - y.start; });
  let out = '', pos = 0;
  hits.forEach(function(h){
    out += escapeHtml(sentence.slice(pos, h.start)) +
      '<span class="w" role="button" tabindex="0" data-action="word-pop" data-id="'+aid+'" data-i="'+h.i+'">'+escapeHtml(sentence.slice(h.start, h.end))+'</span>';
    pos = h.end;
  });
  return out + escapeHtml(sentence.slice(pos));
}
function bodyWithWords(a){
  const words = (a.words || []).map(function(w, i){ return {word:w.word, i:i}; })
    .filter(function(w){ return w.word; })
    .sort(function(x, y){ return y.word.length - x.word.length; });
  const used = {};
  return a.body.split(/\n\n+/).map(function(p){
    return '<p>' + splitSentences(p).map(function(s){ return '<span class="sent">'+markWords(s, words, used, a.id)+'</span>'; }).join('') + '</p>';
  }).join('');
}
function quizDataFor(a){
  if(a && Array.isArray(a.quiz) && a.quiz.length){
    return {quiz: a.quiz.map(function(q){ return {question:q.question, options:q.options, answerIndex:q.answer, explanation:q.explanation}; })};
  }
  return a ? getCached(a.id, 'quiz') : null;
}

function startPractice(mode){
  if(mode === 'wordquiz'){
    const bank = wordBank();
    if(bank.length < 4){ state.study = {mode:'wordquiz', items:[]}; return; }
    const again = bank.filter(function(w){ return wordStatus(w.word) === 'again'; });
    const rest = bank.filter(function(w){ return wordStatus(w.word) !== 'again'; });
    const pool = shuffle(again).concat(shuffle(rest)).slice(0, 10);
    const items = shuffle(pool).map(function(w){
      const others = shuffle(bank.filter(function(x){ return x.word !== w.word; })).slice(0, 3).map(function(x){ return x.word; });
      const options = shuffle(others.concat([w.word]));
      return {prompt:w.meaning, word:w.word, options:options, answer:options.indexOf(w.word), example:w.example};
    });
    state.study = {mode:'wordquiz', items:items, idx:0, picked:null, score:0, done:false};
  } else if(mode === 'fo'){
    state.study = {mode:'fo', items:shuffle(allFoItems()).slice(0, 10), idx:0, picked:null, score:0, done:false};
  } else if(mode === 'cards'){
    state.study = {mode:'cards', filter:'all', idx:0, flipped:false};
  } else if(mode === 'title'){
    // 기사 첫 문단을 읽고 알맞은 제목(중심 내용)을 고르는 연습
    if(ARTICLES.length < 4){ state.study = {mode:'title', items:[]}; return; }
    const items = shuffle(ARTICLES).slice(0, 10).map(function(a){
      const others = shuffle(ARTICLES.filter(function(x){ return x.id !== a.id; })).slice(0, 3).map(function(x){ return x.title; });
      const options = shuffle(others.concat([a.title]));
      const first = a.body.split(/\n\n+/)[0];
      return {passage:splitSentences(first).slice(0, 3).join(' '), options:options, answer:options.indexOf(a.title),
        id:a.id, source:a.source, date:a.date};
    });
    state.study = {mode:'title', items:items, idx:0, picked:null, score:0, done:false};
  } else {
    state.study = {mode:null};
  }
}

    const best = (state.profile.practiceBest || {})[s.mode];
    const msg = s.score >= 9 ? '정말 대단해요! 뉴스 탐정 실력이 쑥쑥 자라고 있어요.' : s.score >= 6 ? '잘했어요! 틀린 문제를 한 번 더 살펴봐요.' : '괜찮아요. 다시 하면 더 잘할 수 있어요.';

      '</div></div>';

  let body;

    body = '<p class="pq__k">이 기사에 가장 알맞은 제목은 무엇일까요?</p>' +

      '<div class="q__opts">' + it.options.map(function(o, i){
        let attrs = 'data-selected="'+(s.picked === i ? 1 : 0)+'"';
        if(answered){ if(i === it.answer) attrs += ' data-correct="1"'; else if(s.picked === i) attrs += ' data-wrong="1"'; }
        return '<button type="button" class="opt" '+attrs+' '+(answered ? 'disabled' : 'data-action="pr-pick" data-i="'+i+'"')+'><span class="opt__l">'+(i + 1)+'</span><span>'+escapeHtml(o)+'</span></button>';
      }).join('') + '</div>' +
      (answered ? '<p class="q__ex"><b>'+(s.picked === it.answer ? '정답이에요.' : '정답은 '+(it.answer + 1)+'번이에요.')+'</b> 제목은 기사에서 가장 중요한 내용을 짧게 담고 있어요.</p>' +
        '<button type="button" class="btn btn--line btn--sm pq__go" data-action="go-article" data-id="'+it.id+'">'+ic('paper')+'이 기사 읽어 보기</button>' : '');
  } else if(isWq){
    body ='<p class="pq__k">이 뜻을 가진 낱말은 무엇일까요?</p><p class="pq__t">'+escapeHtml(it.prompt)+'</p>' +
      '<div class="q__opts">' + it.options.map(function(o, i){
        let attrs = 'data-selected="'+(s.picked === i ? 1 : 0)+'"';
        if(answered){ if(i === it.answer) attrs += ' data-correct="1"'; else if(s.picked === i) attrs += ' data-wrong="1"'; }
        return '<button type="button" class="opt" '+attrs+' '+(answered ? 'disabled' : 'data-action="pr-pick" data-i="'+i+'"')+'><span class="opt__l">'+(i + 1)+'</span><span>'+escapeHtml(o)+'</span></button>';
      }).join('') + '</div>' +
      (answered ? '<p class="q__ex"><b>'+(s.picked === it.answer ? '정답이에요.' : '정답은 \''+escapeHtml(it.word)+'\''+(hasBatchim(it.word) ? '이에요.' : '예요.'))+'</b>'+(it.example ? ' '+markOne(it.example, it.word) : '')+'</p>' : '');
  } else {
    const ok = s.picked === it.type;
    body = (s.idx === 0 && !answered ? foGuide() : '') +
      '<p class="pq__k">이 문장은 사실일까요, 의견일까요?</p><p class="pq__t">'+escapeHtml(it.text)+'</p>' +
      '<p class="pq__src">'+ic('paper')+'<span>'+escapeHtml(it.from)+'</span></p>' +
      '<div class="pq__fo">' + ['fact','opinion'].map(function(t){
        let attrs = 'data-selected="'+(s.picked === t ? 1 : 0)+'"';
        if(answered){ if(t === it.type) attrs += ' data-correct="1"'; else if(s.picked === t) attrs += ' data-wrong="1"'; }
        return '<button type="button" class="opt opt--big" '+attrs+' '+(answered ? 'disabled' : 'data-action="pr-pick" data-v="'+t+'"')+'>'+(t === 'fact' ? '사실' : '의견')+'</button>';
      }).join('') + '</div>' +
      (answered ? '<p class="q__ex"><b>'+(ok ? '맞았어요.' : '정답은 '+(it.type === 'fact' ? '사실' : '의견')+'이에요.')+'</b> '+escapeHtml(it.reason)+'</p>' : '');
  }
  const prog = Math.round((s.idx + (answered ? 1 : 0)) / s.items.length * 100);
  return '<div class="mp">'+studyCrumb(title) +
    '<div class="st-h"><h1>'+title+'</h1><span class="sec__r">'+(s.idx + 1)+' / '+s.items.length+' · 맞힌 문제 <b>'+s.score+'</b></span></div>' +
    '<span class="bar pq__bar"><i style="width:'+prog+'%"></i></span>' +
    '<div class="pq">'+body +
      (answered ? '<div class="qz__foot"><button type="button" class="btn btn--main" data-action="pr-next">'+(s.idx < s.items.length - 1 ? '다음 문제' : '결과 보기')+ic('right')+'</button></div>' : '') +
    '</div></div>';
}

  return Math.max(1, Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(p[0], p[1]-1, p[2])) / 86400000) + 1);

  const p = String(s).split('-').map(Number);

/* ---------- 오늘의 미션 (날마다 새로) ---------- */
const MISSIONS = [
  {k:'read',     n:1, icon:'paper', t:'기사 1개 읽기'},
  {k:'words',    n:3, icon:'book',  t:'낱말 3개 외우기'},
  {k:'practice', n:1, icon:'quiz',  t:'퀴즈나 연습 1번'},
  {k:'think',    n:1, icon:'pen',   t:'생각 쓰기 1번'},
];
function dailyState(){
  const t = todayStr();
  const p = state.profile;
  if(!p.daily || p.daily.date !== t) p.daily = {date:t, read:0, words:0, practice:0, think:0, readIds:[], wordList:[], claimed:false};
  return p.daily;
}
function missionsDone(){
  const d = dailyState();
  return MISSIONS.filter(function(m){ return (d[m.k] || 0) >= m.n; }).length;
}
// key를 주면 같은 기사·같은 낱말은 하루에 한 번만 세요.
function bumpDaily(k, key){
  const d = dailyState();
  if(key){
    const list = k === 'read' ? (d.readIds || (d.readIds = [])) : (d.wordList || (d.wordList = []));
    if(list.indexOf(key) !== -1) return;
    list.push(key);
  }
  const before = missionsDone();
  d[k] = (d[k] || 0) + 1;
  saveProfile();
  if(before < MISSIONS.length && missionsDone() === MISSIONS.length && !d.claimed){
    setTimeout(function(){ toast('오늘의 미션을 모두 마쳤어요! 처음 화면에서 보상을 받아요', 3400); }, 900);
  }
}
function renderMissions(){
  const d = dailyState();
  const done = missionsDone();
  const all = done === MISSIONS.length;
  return '<section class="box mission" aria-label="오늘의 미션">' +
    '<div class="box__h"><p class="box__k">오늘의 미션</p><span class="box__d">'+done+' / '+MISSIONS.length+' 완료</span></div>' +
    '<ul class="ml">' + MISSIONS.map(function(m){
      const v = Math.min(d[m.k] || 0, m.n);
      const ok = v >= m.n;
      return '<li class="ml__i'+(ok ? ' is-ok' : '')+'"><span class="ml__ic">'+ic(ok ? 'check' : m.icon)+'</span>' +
        '<span class="ml__t">'+m.t+'</span><span class="ml__n">'+v+' / '+m.n+'</span></li>';
    }).join('') + '</ul>' +
    '<span class="bar" role="progressbar" aria-label="오늘의 미션" aria-valuemin="0" aria-valuemax="'+MISSIONS.length+'" aria-valuenow="'+done+'"><i style="width:'+Math.round(done / MISSIONS.length * 100)+'%"></i></span>' +
    (d.claimed ? '<p class="ml__done">'+ic('check')+'<span>보상을 받았어요. 내일 또 만나요!</span></p>' :
      '<button type="button" class="btn '+(all ? 'btn--main' : 'btn--line')+' btn--full" data-action="mission-claim"'+(all ? '' : ' disabled')+'>'+(all ? '보상 받기 +10P' : '모두 마치면 +10P')+'</button>') +
  '</section>';
}

const GRADES = [['', '모든 학년'], ['1-2', '1~2학년'], ['3-4', '3~4학년'], ['5-6', '5~6학년']];
// 기사 추천 학년(1-6: 누구나, 3-6: 3학년 이상, 5-6: 5~6학년)이 고른 학년에 맞는지
function suits(a, grade){
  if(!grade) return true;
  if(grade === '1-2') return a.level === '1-6';
  if(grade === '3-4') return a.level === '1-6' || a.level === '3-6';
  return true;
}

  {id:'fo5',       icon:'⚖️', name:'사실 탐정',   desc:'사실·의견 5번'},
  {id:'quiz3',     icon:'🎯', name:'퀴즈 달인',   desc:'퀴즈 만점 3번'},
  {id:'think3',    icon:'✏️', name:'생각 작가',   desc:'생각 쓰기 3번'},
  {id:'streak3',   icon:'🔥', name:'3일 연속',    desc:'3일 연속 읽기'},
  {id:'streak7',   icon:'🌟', name:'일주일 연속', desc:'7일 연속 읽기'},
  {id:'mission1',  icon:'✅', name:'미션 성공',   desc:'오늘의 미션 완료'},
  {id:'practice8', icon:'🏆', name:'연습 고수',   desc:'연습에서 8점 이상'},
];
function achStats(){
  const p = state.profile;
  const readIds = (p.readArticles || []).filter(function(x){ return String(x).indexOf(':') === -1; });
  const cats = {};
  readIds.forEach(function(id){ const a = findArticle(id); if(a) cats[a.category] = true; });
  const best = p.practiceBest || {};
  const qr = p.quizResults || {};
  return {
    read: readIds.length,
    cats: Object.keys(cats).length,
    words: Object.keys(p.wordStatus || {}).filter(function(w){ return p.wordStatus[w] === 'known'; }).length,
    fo: Object.keys(p.foResults || {}).length,
    quizPerfect: Object.keys(qr).filter(function(k){ return qr[k] && qr[k].total && qr[k].correct === qr[k].total; }).length,
    think: Object.keys(p.thoughts || {}).length,
    streak: Math.max(p.bestStreak || 0, (p.streak && p.streak.count) || 0),
    missions: p.missionDays || 0,
    practice: Object.keys(best).reduce(function(m, k){ return Math.max(m, best[k] || 0); }, 0)
  };
}
const ACH_RULES = {
  read1:function(s){ return s.read >= 1; },       read10:function(s){ return s.read >= 10; },
  read30:function(s){ return s.read >= 30; },     cats6:function(s){ return s.cats >= 6; },
  words10:function(s){ return s.words >= 10; },
  fo5:function(s){ return s.fo >= 5; },           quiz3:function(s){ return s.quizPerfect >= 3; },
  think3:function(s){ return s.think >= 3; },     streak3:function(s){ return s.streak >= 3; },
  streak7:function(s){ return s.streak >= 7; },   mission1:function(s){ return s.missions >= 1; },
  practice8:function(s){ return s.practice >= 8; }
};
// 새로 모은 배지가 있으면 축하 창을 띄워요. (한 번 받은 배지는 다시 띄우지 않아요)
let achTimer = null;
function scheduleAchCheck(){
  if(!achTimer) achTimer = setTimeout(function(){ achTimer = null; checkAchievements(); }, 700);
}
function checkAchievements(){
  const p = state.profile;
  if(!Array.isArray(p.achievements)) p.achievements = [];
  const s = achStats();
  const fresh = ACHIEVEMENTS.filter(function(a){ return p.achievements.indexOf(a.id) === -1 && ACH_RULES[a.id](s); });
  if(!fresh.length) return;
  fresh.forEach(function(a){ p.achievements.push(a.id); });
  saveProfile();
  if(fresh.length === 1) queueBadge({icon:fresh[0].icon, name:fresh[0].name+' 배지', sub:'새 배지를 모았어요! ('+fresh[0].desc+')'});
  else queueBadge({icon:fresh[0].icon, name:'배지 '+fresh.length+'개를 모았어요', sub:fresh.map(function(a){ return a.name; }).join(' · ')});
}
function renderBadges(){
  const got = state.profile.achievements || [];
  return '<div class="badges">' + ACHIEVEMENTS.map(function(a){
    const on = got.indexOf(a.id) !== -1;
    return '<div class="bdg'+(on ? ' is-on' : '')+'"><span class="bdg__i" aria-hidden="true">'+a.icon+'</span>' +
      '<b>'+a.name+'</b><small>'+a.desc+'</small><span class="bdg__s">'+(on ? '모았어요' : '아직')+'</span></div>';
  }).join('') + '</div>';
}

function renderRelated(a){

/* ---------- 기사 링크 복사 ---------- */
function articleLink(a){ return location.origin + location.pathname + '#/news/' + encodeURIComponent(a.id); }
function fallbackCopy(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }catch(e){ return false; }
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){
    return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return fallbackCopy(text); });
  }
  return Promise.resolve(fallbackCopy(text));
}

        q.options.map(function(o, j){ return '<span>'+nums[j]+' '+escapeHtml(o)+'</span>'; }).join('') + '</p></div>';

      '<p><b>원문 주소</b> '+escapeHtml(safeUrl(a.url))+'</p>' +

}
function printWorksheet(a){
  const root = document.getElementById('print-root');
  if(!root || !a) return;
  root.innerHTML = worksheetHtml(a);
  document.body.classList.add('is-printing');
  const done = function(){
    document.body.classList.remove('is-printing');
    root.innerHTML = '';
    window.removeEventListener('afterprint', done);
  };
  window.addEventListener('afterprint', done);
  setTimeout(function(){ window.print(); }, 60);
}

/* ---------- 주소(#)로 화면 옮기기 — 뒤로 가기·새로고침·링크 공유가 돼요 ----------
   #/  처음 화면 · #/cat/science  분야 · #/news/기사id  기사 · #/study(/cards|wordquiz|fo|title)  공부방 · #/me  내 탐정 수첩 */
const STUDY_MODES = ['cards', 'wordquiz', 'fo', 'title'];
const scrollMem = {};
let pendingNav = false, pendingRestart = false;
function curHash(){ const h = location.hash; return (!h || h === '#') ? '#/' : h; }
function navigate(hash, restart){
  scrollMem[curHash()] = window.scrollY;
  pendingRestart = !!restart;
  if(curHash() === hash){ applyRoute(true); return; }
  pendingNav = true;
  location.hash = hash;               // → hashchange → applyRoute
}
function syncHeaderH(){ const h = document.getElementById('hd'); if(h) document.documentElement.style.setProperty('--hdh', h.offsetHeight+'px'); }
window.addEventListener('resize', syncHeaderH);
function applyRoute(fromNav){
  const parts = curHash().replace(/^#\/?/, '').split('/').map(function(x){ try{ return decodeURIComponent(x); }catch(e){ return x; } });
  stopSpeak();
  state.wordPop = null;
  if(parts[0] === 'news' && parts[1]){
    if(fromNav || state.articleId !== parts[1]) state.mode = null;
    state.view = 'article';
    state.articleId = parts[1];
  } else if(parts[0] === 'study'){
    const mode = STUDY_MODES.indexOf(parts[1]) !== -1 ? parts[1] : null;
    // 뒤로 가기로 돌아오면 하던 연습을 이어서, 새로 누르면 처음부터 해요.
    if(pendingRestart || !state.study || state.study.mode !== mode) startPractice(mode);
    state.view = 'study';
  } else if(parts[0] === 'me'){
    state.view = 'mypage';
  } else {
    const cat = (parts[0] === 'cat' && CATEGORIES.some(function(c){ return c.id === parts[1]; })) ? parts[1] : 'all';
    if(state.category !== cat) state.listLimit = PAGE_SIZE;
    state.category = cat;
    state.view = 'home';
    state.mode = null;
  }
  pendingRestart = false;
  renderApp();
  syncHeaderH();
  window.scrollTo(0, fromNav ? 0 : (scrollMem[curHash()] || 0));
}
window.addEventListener('hashchange', function(){ const n = pendingNav; pendingNav = false; applyRoute(n); });
// 제목(로고)을 누르면 검색어·필터를 지우고 언제나 처음 화면 맨 위로 가요.
function goHome(){
  state.search = '';
  const si = document.getElementById('search-input'); if(si) si.value = '';
  state.unreadOnly = false;
  state.listLimit = PAGE_SIZE;
  navigate('#/');
}
function goArticle(id){ navigate('#/news/' + encodeURIComponent(id)); }
function goMyPage(){ navigate('#/me'); }
function goStudy(mode){ navigate('#/study' + (mode ? '/' + mode : ''), true); }
function setWordStatus(word, mark){
  if(!state.profile.wordStatus) state.profile.wordStatus = {};
  const before = state.profile.wordStatus[word];
  state.profile.wordStatus[word] = mark;
  saveProfile();
  if(mark === 'known' && before !== 'known') bumpDaily('words', word);
  if(!state.profile.wordPointed) state.profile.wordPointed = {};
  if(mark === 'known' && before !== 'known' && !state.profile.wordPointed[word]){
    state.profile.wordPointed[word] = true;
    saveProfile();
    addPoints(1, '낱말 하나를 외웠어요');
  }
}

function speakArticle(article){
  if(!('speechSynthesis' in window)){ toast('이 브라우저는 읽어 주기를 지원하지 않아요'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(article.title + '. ' + article.body.replace(/\n+/g,' '));
  utter.lang = 'ko-KR';
  utter.rate = state.ttsRate;
  utter.onend = function(){ state.ttsSpeaking = false; renderApp(); };
  utter.onerror = function(){ state.ttsSpeaking = false; renderApp(); };
  window.speechSynthesis.speak(utter);
  state.ttsSpeaking = true;
}
function stopSpeak(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  state.ttsSpeaking = false;
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  if(action === 'go-home') goHome();
  else if(action === 'go-mypage') goMyPage();
  else if(action === 'go-article') goArticle(el.getAttribute('data-id'));
  else if(action === 'set-category'){
    const cat = el.getAttribute('data-cat');
    state.listLimit = PAGE_SIZE;
    state.search = ''; document.getElementById('search-input').value = '';
    navigate(cat && cat !== 'all' ? '#/cat/' + cat : '#/');
  }
  else if(action === 'show-more'){ state.listLimit += PAGE_SIZE; renderApp(); }
  else if(action === 'clear-search'){ state.search=''; state.listLimit=PAGE_SIZE; document.getElementById('search-input').value=''; navigate('#/'); }
  else if(action === 'set-grade'){
    const g = el.getAttribute('data-grade') || '';
    state.profile.grade = g;
    if(g) state.level = g;
    state.listLimit = PAGE_SIZE;
    saveProfile();
    renderApp();
  }
  else if(action === 'toggle-unread'){ state.unreadOnly = !state.unreadOnly; state.listLimit = PAGE_SIZE; renderApp(); }
  else if(action === 'clear-filters'){ state.profile.grade = ''; state.unreadOnly = false; saveProfile(); renderApp(); }
  else if(action === 'mission-claim'){
    const d = dailyState();
    if(!d.claimed && missionsDone() === MISSIONS.length){
      d.claimed = true;
      state.profile.missionDays = (state.profile.missionDays || 0) + 1;
      saveProfile();
      addPoints(10, '오늘의 미션 완료');
      renderApp();
    }
  }
  else if(action === 'sod-pick'){
    const it = sentenceOfDay(), d = dailyState();
    if(it && d.foKey !== it.text){
      d.foKey = it.text;
      d.foPick = el.getAttribute('data-v');
      saveProfile();
      if(d.foPick === it.type) addPoints(2, '오늘의 문장 정답');
      renderApp();
    }
  }
  else if(action === 'copy-link'){
    const a = findArticle(el.getAttribute('data-id'));
    if(a) copyText(articleLink(a)).then(function(ok){ toast(ok ? '기사 주소를 복사했어요. 친구나 선생님께 보내 보세요' : '주소 칸의 주소를 길게 눌러 복사해 주세요', 2800); });
  }
  else if(action === 'print-ws'){ printWorksheet(findArticle(el.getAttribute('data-id'))); }
  else if(action === 'toggle-bookmark'){
    const id = el.getAttribute('data-id');
    const idx = state.profile.bookmarks.indexOf(id);
    if(idx === -1){ state.profile.bookmarks.push(id); toast('스크랩에 담았어요'); }
    else { state.profile.bookmarks.splice(idx,1); toast('스크랩을 해제했어요'); }
    saveProfile();
    renderApp();
  }
  else if(action === 'set-mode'){
    const m = el.getAttribute('data-mode');
    state.mode = (state.mode === m) ? null : m;
    if(state.mode === 'words'){
      if(!state.profile.actDone) state.profile.actDone = {};
      const d = state.profile.actDone[state.articleId] || (state.profile.actDone[state.articleId] = {});
      if(!d.words){ d.words = true; saveProfile(); addPoints(3, '낱말 익히기'); }
    }
    renderApp();
    const panel = document.getElementById('ai-panel');
    const sp = document.querySelector('.side__panel');
    // 넓은 화면에서는 오른쪽 칸 안에서만 맨 위로, 좁은 화면에서는 활동 화면이 보이게 내려가요.
    if(sp && getComputedStyle(sp).overflowY === 'auto') sp.scrollTop = 0;
    else if(panel) panel.scrollIntoView({behavior:'smooth', block:'nearest'});
  }
  else if(action === 'set-level'){
    state.level = el.getAttribute('data-level');
    renderApp();
  }
  else if(action === 'retry-ai'){
    const type = el.getAttribute('data-type');
    const key = loadingKey(state.articleId, type, type==='easy'?state.level:null);
    delete state.aiError[key];
    if(type==='easy') ensureEasy(state.articleId, state.level);
    else if(type==='facts') ensureFacts(state.articleId);
    else if(type==='quiz') ensureQuiz(state.articleId);
    renderApp();
  }
  else if(action === 'toggle-quiz'){ state.mode = 'quiz'; renderApp(); }
  else if(action === 'quiz-select'){
    const id = el.getAttribute('data-id'), qi = +el.getAttribute('data-qi'), oi = +el.getAttribute('data-oi');
    if(!state.quizState[id]) state.quizState[id] = {answers:{}, submitted:false};
    if(!state.quizState[id].submitted){
      state.quizState[id].answers[qi] = oi;
      renderApp();
    }
  }
  else if(action === 'quiz-submit'){
    const id = el.getAttribute('data-id');
    const qs = state.quizState[id];
    const data = quizDataFor(findArticle(id));
    if(qs && data){
      qs.submitted = true;
      let score = 0;
      const article = findArticle(id);
      if(!state.profile.wrongAnswers) state.profile.wrongAnswers = [];
      state.profile.wrongAnswers = state.profile.wrongAnswers.filter(function(w){ return w.articleId !== id; });
      (data.quiz||[]).forEach(function(q,qi){
        const isCorrect = qs.answers[qi] === q.answerIndex;
        if(isCorrect){ score++; }
        else{
          state.profile.wrongAnswers.push({
            articleId:id,
            articleTitle: article ? article.title : '',
            question:q.question,
            options:q.options,
            answerIndex:q.answerIndex,
            userIndex:qs.answers[qi],
            explanation:q.explanation
          });
        }
      });
      const total = (data.quiz||[]).length;
      const firstTime = !state.profile.quizResults[id];
      if(firstTime){
        state.profile.quizResults[id] = {correct:score, total:total};
        addPoints(score*7, '탐정 퀴즈 정답 '+score+'개');
      }
      saveProfile();
      bumpDaily('practice');
      renderApp();
    }
  }
  else if(action === 'quiz-retry'){
    const id = el.getAttribute('data-id');
    state.quizState[id] = {answers:{}, submitted:false};
    renderApp();
  }
  else if(action === 'tts-toggle'){
    const article = findArticle(state.articleId);
    if(state.ttsSpeaking) stopSpeak(); else speakArticle(article);
    renderApp();
  }
  else if(action === 'tts-rate'){
    state.ttsRate = +el.getAttribute('data-rate');
    if(state.ttsSpeaking){ speakArticle(findArticle(state.articleId)); }
    renderApp();
  }
  else if(action === 'font-size'){ state.fontSize = el.getAttribute('data-size'); renderApp(); }
  else if(action === 'cal-prev'){ state.calendarOffset -= 1; renderApp(); }
  else if(action === 'cal-next'){ state.calendarOffset = Math.min(0, state.calendarOffset + 1); renderApp(); }
  else if(action === 'toggle-theme'){
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    saveSettings();
    renderApp();
  }
  else if(action === 'reset-data'){
    if(confirm('정말 모든 기록(포인트, 등급, 스크랩, 낱말 수첩, 생각 노트, 오답 노트 등)을 지울까요? 이 동작은 되돌릴 수 없어요.')){
      state.profile = {
        points:0, bookmarks:[], readArticles:[], quizResults:{},
        streak:{count:0, lastDate:null}, masteredCategories:[], vocabNotebook:[],
        wrongAnswers:[], readDates:[],
        wordStatus:{}, foResults:{}, thoughts:{}, actDone:{}, practiceBest:{}, practiceDay:{},
        achievements:[], missionDays:0, bestStreak:0, grade:''
      };
      state.foState = {}; state.thinkDraft = {}; state.study = {mode:null}; state.unreadOnly = false;
      saveProfile();
      toast('기록을 초기화했어요');
      renderApp();
    }
  }
  else if(action === 'close-badge-modal'){ showNextBadge(); }
  else if(action === 'go-study'){ goStudy(el.getAttribute('data-mode')); }
  else if(action === 'study-start'){ goStudy(el.getAttribute('data-mode')); }
  else if(action === 'word-pop'){
    const a = findArticle(el.getAttribute('data-id'));
    const w = a && a.words && a.words[+el.getAttribute('data-i')];
    if(w){ state.wordPop = {word:w.word, meaning:w.meaning}; renderApp(); }
  }
  else if(action === 'word-pop-close'){ state.wordPop = null; renderApp(); }
  else if(action === 'word-mark'){
    const word = el.getAttribute('data-word'), mark = el.getAttribute('data-mark');
    const s = state.study;
    if(el.getAttribute('data-next') && s && s.mode === 'cards'){
      const deckBefore = cardDeck().length;
      setWordStatus(word, mark);
      const deckAfter = cardDeck().length;
      if(deckAfter === deckBefore && s.idx < deckAfter - 1) s.idx++;
      s.flipped = false;
    } else {
      setWordStatus(word, mark);
    }
    if(mark === 'again' && !el.getAttribute('data-next')) toast('다시 볼 낱말에 담았어요');
    renderApp();
  }
  else if(action === 'fc-flip'){ state.study.flipped = !state.study.flipped; renderApp(); }
  else if(action === 'fc-prev'){ state.study.idx = Math.max(0, state.study.idx - 1); state.study.flipped = false; renderApp(); }
  else if(action === 'fc-next'){ state.study.idx = Math.min(cardDeck().length - 1, state.study.idx + 1); state.study.flipped = false; renderApp(); }
  else if(action === 'fc-filter'){ state.study.filter = el.getAttribute('data-f'); state.study.idx = 0; state.study.flipped = false; renderApp(); }
  else if(action === 'fo-pick'){
    const id = el.getAttribute('data-id');
    const st = state.foState[id] || (state.foState[id] = {answers:{}, submitted:false});
    if(!st.submitted){ st.answers[+el.getAttribute('data-i')] = el.getAttribute('data-v'); renderApp(); }
  }
  else if(action === 'fo-submit'){
    const id = el.getAttribute('data-id');
    const a = findArticle(id), st = state.foState[id];
    if(a && st){
      st.submitted = true;
      const fo = a.fo || [];
      const correct = fo.filter(function(f, i){ return st.answers[i] === f.type; }).length;
      if(!state.profile.foResults) state.profile.foResults = {};
      if(!state.profile.foResults[id]){
        state.profile.foResults[id] = {correct:correct, total:fo.length};
        addPoints(correct * 2, '사실·의견 '+correct+'개 맞힘');
      }
      saveProfile();
      bumpDaily('practice');
      renderApp();
    }
  }
  else if(action === 'fo-retry'){ state.foState[el.getAttribute('data-id')] = {answers:{}, submitted:false}; renderApp(); }
  else if(action === 'think-save'){
    const id = el.getAttribute('data-id');
    const box = document.getElementById('think-input');
    const text = (box ? box.value : (state.thinkDraft[id] || '')).trim();
    if(text.length < 10){ toast('조금 더 자세히 써 볼까요? (10자 이상)'); return; }
    if(!state.profile.thoughts) state.profile.thoughts = {};
    const first = !state.profile.thoughts[id];
    const a = findArticle(id);
    state.profile.thoughts[id] = {text:text, date:todayStr(), title: a ? a.title : ''};
    delete state.thinkDraft[id];
    saveProfile();
    bumpDaily('think');
    if(first) addPoints(5, '내 생각을 썼어요'); else toast('고친 생각을 저장했어요');
    renderApp();
  }
  else if(action === 'pr-pick'){
    const s = state.study;
    if(!s || s.done || (s.picked !== null && s.picked !== undefined)) return;
    const it = s.items[s.idx];
    if(s.mode === 'wordquiz'){
      s.picked = +el.getAttribute('data-i');
      if(s.picked === it.answer) s.score++;
      else setWordStatus(it.word, 'again');
    } else if(s.mode === 'title'){
      s.picked = +el.getAttribute('data-i');
      if(s.picked === it.answer) s.score++;
    } else {
      s.picked = el.getAttribute('data-v');
      if(s.picked === it.type) s.score++;
    }
    renderApp();
  }
  else if(action === 'pr-next'){
    const s = state.study;
    if(!s) return;
    if(s.idx < s.items.length - 1){ s.idx++; s.picked = null; window.scrollTo(0,0); renderApp(); return; }
    s.done = true;
    const p = state.profile;
    if(!p.practiceBest) p.practiceBest = {};
    if(!p.practiceDay) p.practiceDay = {};
    if(p.practiceBest[s.mode] == null || s.score > p.practiceBest[s.mode]) p.practiceBest[s.mode] = s.score;
    saveProfile();
    bumpDaily('practice');
    if(s.score >= 7 && p.practiceDay[s.mode] !== todayStr()){
      p.practiceDay[s.mode] = todayStr();
      saveProfile();
      addPoints(5, (PRACTICE_NAMES[s.mode] || '연습')+' 통과');
    }
    window.scrollTo(0, 0);
    renderApp();
  }
});

document.addEventListener('input', function(e){
  if(e.target && e.target.id === 'think-input'){
    state.thinkDraft[e.target.getAttribute('data-id')] = e.target.value;
    const h = document.getElementById('think-hint');
    if(h) h.textContent = thinkHint(e.target.value);
  }
});
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && state.wordPop){ state.wordPop = null; renderApp(); }
  // 밑줄 낱말·뉴스 카드처럼 단추가 아닌 곳도 키보드(Enter·Space)로 열 수 있어요.
  const t = e.target;
  if((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('data-action') && t.hasAttribute('tabindex') &&
     ['BUTTON','A','INPUT','TEXTAREA','SUMMARY'].indexOf(t.tagName) === -1){
    e.preventDefault(); t.click();
  }
});

let searchTimer = null;
document.getElementById('search-input').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(function(){
    state.search = val;
    if(!val.trim()){ renderApp(); return; }
    // 검색은 모든 분야에서 찾아요.
    state.category = 'all';
    state.listLimit = PAGE_SIZE;
    if(state.view !== 'home'){ navigate('#/'); return; }
    if(curHash() !== '#/') history.replaceState(null, '', '#/');
    renderApp();
  }, 250);
});

/* =========================================================
   접속자 수 (맨 위 분야 줄 오른쪽 끝, 내 탐정 수첩 아래)
   /api/visits 가 좋은탴월드와 같은 Upstash 저장소에 숫자를 쌓아요. 저장소가 없으면 탭을 숨겨요.
========================================================= */
const VISIT_SID = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
function fmtN(n){ return Number(n || 0).toLocaleString('ko-KR'); }
function visitsInner(v){
  return '<span class="vis__live"><span class="vis__dot" aria-hidden="true"></span>지금 <b>'+fmtN(v.online)+'</b></span>' +
    '<span class="vis__sep" aria-hidden="true"></span><span>오늘 <b>'+fmtN(v.today)+'</b></span>';
}
function visitsChip(){
  const v = state.visits;
  if(!v) return '';
  return '<span class="vis" id="gnb-vis" role="status" title="지금 접속 '+fmtN(v.online)+'명 · 오늘 방문 '+fmtN(v.today)+'명 · 지금까지 '+fmtN(v.total)+'명">'+visitsInner(v)+'</span>';
}
async function pingVisits(){
  if(location.protocol === 'file:') return;
  const KEY = 'kidsNewsLab:visitDay';
  let seen = null;
  try{ seen = localStorage.getItem(KEY); }catch(e){}
  const visit = seen !== todayStr();
  try{
    const r = await fetch('/api/visits', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({sid:VISIT_SID, visit:visit})});
    const d = await r.json();
    if(!d || !d.ok || !d.enabled) return;
    if(visit){ try{ localStorage.setItem(KEY, todayStr()); }catch(e){} }
    const first = !state.visits;
    state.visits = {online:d.online, today:d.today, total:d.total};
    const el = document.getElementById('gnb-vis');
    if(el){ el.innerHTML = visitsInner(state.visits); el.title = '지금 접속 '+fmtN(d.online)+'명 · 오늘 방문 '+fmtN(d.today)+'명 · 지금까지 '+fmtN(d.total)+'명'; }
    else if(first){ const g = document.getElementById('gnb'); if(g) g.insertAdjacentHTML('beforeend', visitsChip()); }
  }catch(e){}
}
function startVisits(){
  pingVisits();
  setInterval(function(){ if(!document.hidden) pingVisits(); }, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) pingVisits(); });
}

/* =========================================================
   INIT
========================================================= */
async function init(){
  await loadProfile();
  try{ if('scrollRestoration' in history) history.scrollRestoration = 'manual'; }catch(e){}
  applyRoute(true);
  window.addEventListener('resize', fitHeader);
  startVisits();
}
init();

})();
</script>
