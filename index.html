<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090B">
<meta name="description" content="어려운 뉴스를 눈높이에 맞게 쉽게 읽고, 사실과 의견을 스스로 구별해 보는 초등학생용 AI 뉴스 학습 사이트">
<title>AI 어린이 뉴스 연구소</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232F5BEA'/%3E%3Ccircle cx='14.5' cy='14.5' r='6.5' fill='none' stroke='%23fff' stroke-width='2.6'/%3E%3Cpath d='M19.5 19.5l5 5' stroke='%23fff' stroke-width='2.8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<!-- 신문 제호 글꼴: 제목 글자만 받아 와요 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@900&text=%20AI%EA%B5%AC%EB%89%B4%EB%A6%B0%EC%86%8C%EC%8A%A4%EC%96%B4%EC%97%B0%EC%9D%B4&display=swap">
<script>
  /* 화면이 뜨기 전에 고른 밝기를 먼저 적용해 깜박임을 막아요 (처음 오면 어두운 화면) */
  try{var s=JSON.parse(localStorage.getItem('kidsNewsLab:settings')||'{}');document.documentElement.dataset.theme=s.theme==='light'?'light':'dark'}catch(e){document.documentElement.dataset.theme='dark'}
</script>
<style>
/* AI 어린이 뉴스 연구소 — 선생님이 만든 다른 사이트(그림책 전시회·좋은탴월드)와 같은 규칙:
   하얀(어두운 화면은 검은) 바탕, Pretendard, 회색 단계 + 강조색 하나(파랑), 선 아이콘, 알약 모양 단추 */
:root{
  --ink:#111113;--ink-2:#52535B;--ink-3:#6E6F78;--line:#E6E6EA;--line-2:#D4D5DB;--bg:#F4F4F6;
  --page:#FAFAFB;--surface:#fff;--surface-2:#fff;--surface-hover:#EBEBEF;--hd-bg:rgba(250,250,251,.88);
  --main:#2F5BEA;--main-d:#2149CC;--main-soft:#EEF2FF;--on-main:#fff;
  --fact:#0E7A5F;--fact-soft:#E4F4EC;--opinion:#C2410C;--opinion-soft:#FFF0E6;
  --ok:#0B7A55;--ok-soft:#E3F8EF;--err:#C2343A;--err-soft:#FFEDEE;--think:#FFF7DD;
  --shadow:rgba(17,17,19,.10);
  --edge:inset 0 1px 0 rgba(255,255,255,.9);
  --sh-1:0 1px 2px rgba(17,17,19,.06),0 3px 10px -4px rgba(17,17,19,.12);
  --sh-2:0 2px 4px rgba(17,17,19,.05),0 14px 28px -12px rgba(17,17,19,.22),0 30px 56px -28px rgba(17,17,19,.18);
  --sh-3:0 4px 8px rgba(17,17,19,.05),0 24px 48px -20px rgba(17,17,19,.30);
  /* 카드(뉴스·타일·상자) 전용 음영: 가까운 그림자 + 넓게 퍼지는 그림자 두 겹 */
  --sh-card:0 1px 2px rgba(17,17,19,.07),0 6px 16px -6px rgba(17,17,19,.16),0 18px 36px -22px rgba(17,17,19,.24);
  --sh-card-h:0 2px 6px rgba(17,17,19,.07),0 18px 32px -12px rgba(17,17,19,.26),0 36px 60px -30px rgba(17,17,19,.28);
  --glow:.42;
  --c-science:#2563EB;--c-tech:#4F46E5;--c-env:#0F766E;--c-nature:#4D7C0F;--c-society:#C2410C;--c-school:#0369A1;
  --c-economy:#A16207;--c-world:#0E7490;--c-kids:#BE185D;--c-history:#8B5E34;--c-culture:#7C3AED;--c-sports:#DC2626;
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:16px;
  color-scheme:light;
}
[data-theme=dark]{
  --ink:#F4F4F6;--ink-2:#B3B3BC;--ink-3:#868690;--line:#26262B;--line-2:#34343A;--bg:#18181C;
  --page:#09090B;--surface:#121215;--surface-2:#18181D;--surface-hover:#212126;--hd-bg:rgba(9,9,11,.82);
  --main:#7C9BFF;--main-d:#9AB2FF;--main-soft:#151B2E;--on-main:#0B1230;
  --fact:#5FD3A6;--fact-soft:#0F2A20;--opinion:#FF9F6B;--opinion-soft:#2E1B10;
  --ok:#62D8A8;--ok-soft:#12352C;--err:#FF8C95;--err-soft:#3A1A20;--think:#262111;
  --shadow:rgba(0,0,0,.6);
  --edge:inset 0 1px 0 rgba(255,255,255,.08);
  /* 어두운 화면: 검은 그림자는 바탕에 묻혀 안 보여서, 테두리 빛 + 은은하게 번지는 푸른 빛으로 음영을 만들어요 */
  --sh-1:0 0 0 1px rgba(255,255,255,.035),0 2px 6px rgba(0,0,0,.5),0 6px 18px -10px rgba(124,155,255,.24);
  --sh-2:0 0 0 1px rgba(255,255,255,.06),0 2px 6px rgba(0,0,0,.5),0 18px 40px -16px rgba(124,155,255,.42);
  --sh-3:0 0 0 1px rgba(255,255,255,.07),0 4px 10px rgba(0,0,0,.5),0 28px 60px -20px rgba(124,155,255,.45);
  --sh-card:0 0 0 1px rgba(255,255,255,.05),0 2px 5px rgba(0,0,0,.55),0 14px 34px -14px rgba(124,155,255,.34);
  --sh-card-h:0 0 0 1px rgba(255,255,255,.09),0 2px 5px rgba(0,0,0,.55),0 24px 50px -16px rgba(124,155,255,.55);
  --glow:.5;
  --c-science:#82A8FF;--c-tech:#A5A3FF;--c-env:#4FD1C5;--c-nature:#A3D65C;--c-society:#FF9F5A;--c-school:#6CC3F2;
  --c-economy:#E8C24D;--c-world:#5CC8DC;--c-kids:#FF8FC0;--c-history:#D9A877;--c-culture:#C4A6FF;--c-sports:#FF7B7B;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.6 var(--sans);word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,ul,dl,dd{margin:0;padding:0}ul{list-style:none}a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--main);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
.ic{width:20px;height:20px;display:block;flex:none}
.sent{display:block}
.wrap{width:100%;max-width:1200px;margin-inline:auto;padding-inline:24px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--bg);padding:1px 6px;border-radius:5px}

/* 단추 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 20px;border:0;border-radius:999px;font:700 15px var(--sans);white-space:nowrap;background:var(--bg);color:var(--ink);transition:background .15s,box-shadow .15s,opacity .15s}
.btn:hover{background:var(--surface-hover)}
.btn .ic{width:18px;height:18px}
.btn--main{background:var(--main);color:var(--on-main)}.btn--main:hover{background:var(--main-d)}
.btn--ink{background:var(--ink);color:var(--page)}.btn--ink:hover{background:var(--ink);opacity:.86}
.btn--line{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line)}.btn--line:hover{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.btn--sm{height:36px;padding:0 14px;font-size:14px;gap:5px}.btn--sm .ic{width:16px;height:16px}
.btn--full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg)}
.seg button{height:32px;padding:0 13px;border:0;border-radius:999px;background:none;font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
[data-theme=dark] .seg button[aria-pressed=true]{background:var(--surface-hover)}

/* 머리 */
.hd{position:sticky;top:0;z-index:40;background:var(--hd-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.hd__top{display:flex;align-items:center;gap:24px;height:68px}
.logo{display:flex;align-items:center;gap:9px;flex:none;height:46px;padding:0;border:0;background:none;font-size:18px;font-weight:500;letter-spacing:-.035em;color:var(--ink)}
.logo b{font-weight:800}
.logo__m{width:32px;height:32px;flex:none}
.search{flex:1;min-width:0;max-width:440px;margin-inline:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 6px 0 16px;border:1.5px solid transparent;border-radius:999px;background:var(--bg);cursor:text}
.search:focus-within{background:var(--surface);border-color:var(--main)}
.search .ic{width:18px;height:18px;color:var(--ink-3)}
.search input{flex:1;width:0;min-width:0;border:0;background:none;outline:0;font:500 15px var(--sans);color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search__x{width:30px;height:30px;border:0;border-radius:50%;background:var(--surface-hover);display:grid;place-items:center;color:var(--ink-2)}
.search__x .ic{width:15px;height:15px}
.search__x[hidden]{display:none}
.hd__r{display:flex;align-items:center;gap:8px;flex:none}
.round{width:42px;height:42px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink);transition:background .15s}
.round:hover{background:var(--surface-hover)}
/* 화면 밝기 스위치 (어둡게 | 밝게) */
.tsw{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;align-items:center;height:42px;padding:4px;border:0;border-radius:999px;background:var(--bg);color:var(--ink-2);font:800 13.5px var(--sans);cursor:pointer;box-shadow:inset 0 0 0 1px var(--line),var(--edge),var(--sh-1);transition:box-shadow .2s,transform .15s}
.tsw__k{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--main);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--main) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .28s cubic-bezier(.3,.7,.3,1),background .28s,box-shadow .28s}
.tsw[data-mode=light] .tsw__k{transform:translateX(100%);background:#F5A623;box-shadow:0 6px 16px -6px rgba(245,166,35,.9),inset 0 1px 0 rgba(255,255,255,.35)}
.tsw__o{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 13px;border-radius:999px;white-space:nowrap;transition:color .25s}
.tsw__o .ic{width:16px;height:16px}
.tsw[data-mode=dark] .tsw__o--d{color:var(--on-main)}
.tsw[data-mode=light] .tsw__o--l{color:#3A2500}
/* 학습지 인쇄: 기사 화면에서 가장 눈에 띄는 단추 */
.btn--print{background:linear-gradient(135deg,var(--main),color-mix(in srgb,var(--main) 62%,#B06BFF));color:var(--on-main)}
.btn--print:hover{background:linear-gradient(135deg,var(--main-d),color-mix(in srgb,var(--main-d) 62%,#B06BFF))}
@media(max-width:1000px){.tsw__t{display:none}.tsw__o{padding:0 11px}}
.btn__tag{display:inline-flex;align-items:center;height:19px;margin-left:2px;padding:0 6px;border-radius:6px;background:color-mix(in srgb,var(--on-main) 20%,transparent);font-size:11px;font-weight:800;letter-spacing:.3px}
.me{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 6px 0 14px;border:0;border-radius:999px;background:var(--bg);font-weight:700;font-size:14.5px;transition:background .15s}
.me:hover{background:var(--surface-hover)}
.me[aria-current=page]{background:var(--ink);color:var(--page)}
.me .ic{width:19px;height:19px}
.me__pt{display:inline-flex;align-items:center;height:30px;padding:0 11px;border-radius:999px;background:var(--main);color:var(--on-main);font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.gnb .wrap{display:flex;gap:2px;height:50px;overflow-x:auto;scrollbar-width:none}
.gnb .wrap::-webkit-scrollbar{display:none}
.gnb button{position:relative;flex:none;display:flex;align-items:center;padding:0 14px;border:0;background:none;font-size:15.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.gnb button:hover{color:var(--ink)}
.gnb button[aria-current=true]{color:var(--ink)}
.gnb button[aria-current=true]::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--main)}
.gnb .dot{width:7px;height:7px;border-radius:50%;background:var(--cc);margin-right:7px}
.gnb i{font-style:normal;margin-left:5px;font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* 접속자 수 탭 */
.gnb .vis{flex:none;margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border-radius:999px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),inset 0 0 0 1px var(--line),var(--sh-1);font-size:12.5px;font-weight:700;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.gnb .vis b{margin-left:3px;font-weight:800;color:var(--ink)}
.vis__live{display:inline-flex;align-items:center}
.vis__dot{width:7px;height:7px;margin-right:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent);animation:visPulse 2s ease-in-out infinite}
.vis__sep{width:1px;height:11px;background:var(--line-2)}
@keyframes visPulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 6%,transparent)}}
@media(prefers-reduced-motion:reduce){.vis__dot{animation:none}}

/* 처음 화면 */
.intro{padding-top:40px}
.intro__k{font-size:13px;font-weight:800;letter-spacing:.02em;color:var(--main)}
.intro h1{margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1.3}
.intro p.intro__line{margin-top:6px;font-size:16.5px;color:var(--ink-2)}
.clause{display:inline-block}
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;margin-top:26px}
.feat{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:0;padding:36px 40px;border-radius:20px;background:var(--bg);cursor:pointer}
.feat__k{font-size:12.5px;font-weight:800;color:var(--page);background:var(--ink);border-radius:6px;padding:3px 10px}
.feat__meta{display:flex;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--ink-2)}
.feat__meta>*+*::before{content:'';display:inline-block;width:1px;height:11px;margin:0 10px;background:var(--line-2);vertical-align:-1px}
.feat__meta b{color:var(--cc);font-weight:800}
.feat h2{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.32;max-width:680px}
.feat:hover h2{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.feat__ex{font-size:16px;color:var(--ink-2);max-width:640px}
.feat .btn{margin-top:auto}
.mycard{display:flex;flex-direction:column;gap:14px;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.mycard__k{font-size:13px;font-weight:800;color:var(--main)}
.mycard__h{display:flex;align-items:center;gap:12px}
.mycard__h b{display:block;font-size:18px;font-weight:800;letter-spacing:-.02em}
.mycard__h small{display:block;font-size:13px;color:var(--ink-2)}
.mycard dl{display:grid;gap:8px;font-size:14.5px}
.mycard dl div{display:flex;justify-content:space-between;gap:8px}
.mycard dt{color:var(--ink-2)}.mycard dd{font-weight:800;font-variant-numeric:tabular-nums}
.mycard .btn{margin-top:auto}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:26px;line-height:1}
.bar{display:block;height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--main);transition:width .6s cubic-bezier(.3,1,.4,1)}

/* 구역 제목 */
.sec{padding-top:52px}
.sec__h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--ink)}
.sec__h h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px;font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.sec__h h2 small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:-.01em}
.sec__r{flex:none;font-size:14px;font-weight:600;color:var(--ink-2)}
.sec__r b{color:var(--main)}

/* 뉴스 카드 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.nc{display:flex;flex-direction:column;gap:10px;min-width:0;padding:20px 22px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.nc:hover{border-color:var(--ink-3);box-shadow:0 12px 26px -14px var(--shadow);transform:translateY(-2px)}
.nc__top{display:flex;align-items:center;gap:8px;height:30px}
.kick{font-size:13px;font-weight:800;color:var(--cc)}
.read-tag{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:700}
.read-tag .ic{width:13px;height:13px}
.bm{margin-left:auto;width:34px;height:34px;margin-right:-8px;border:0;border-radius:50%;background:none;display:grid;place-items:center;color:var(--ink-3);transition:background .15s,color .15s}
.bm:hover{background:var(--bg);color:var(--ink)}
.bm[aria-pressed=true]{color:var(--main)}
.bm[aria-pressed=true] path,.bm-btn[aria-pressed=true] path{fill:currentColor}
.nc h3{font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.42;min-height:2.84em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc[data-read="1"] h3{color:var(--ink-2)}
.nc__ex{font-size:14.5px;line-height:1.6;color:var(--ink-2);min-height:3.2em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc__meta{display:flex;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.nc__meta>*+*::before{content:'';display:inline-block;width:1px;height:10px;margin:0 9px;background:var(--line-2);vertical-align:-1px}
.nc__meta b{font-weight:700;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.nc__meta span{display:inline-flex;align-items:center;gap:4px}
.nc__meta .ic{width:14px;height:14px}
.nc__meta span::before{flex:none}
.more{display:flex;justify-content:center;margin-top:28px}
.more__n{color:var(--main)}
.empty{display:grid;justify-items:center;gap:14px;padding:64px 20px;border-radius:var(--r);background:var(--bg);text-align:center;color:var(--ink-2)}
.empty>.ic{width:34px;height:34px;color:var(--ink-3)}

/* 기사 화면 */
.art{max-width:800px;margin:0 auto;padding:28px 24px 0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:22px;font-size:13.5px;color:var(--ink-2)}
.crumb button{padding:0;border:0;background:none;font:inherit;color:inherit}
.crumb button:hover{color:var(--ink);text-decoration:underline}
.crumb>*+*::before{content:'›';margin-right:6px;color:var(--ink-3)}
.art__k{font-size:14px;font-weight:800;color:var(--cc)}
.art h1{margin-top:6px;font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1.3}
.art__meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:18px;padding:12px 0;border-block:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.art__meta>span{display:inline-flex;align-items:center;gap:6px}
.art__meta .ic{width:16px;height:16px;color:var(--ink-3)}
.art__meta b{color:var(--ink);font-weight:700}
.art__meta .btn{margin-left:auto}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin-top:16px}
.tool{display:flex;align-items:center;gap:8px}
.tool__l{font-size:13px;font-weight:700;color:var(--ink-3)}
.seg--fs button{width:36px;padding:0}
.body{margin-top:28px;font-size:var(--fs,17px);line-height:1.9}
.body p+p{margin-top:1.2em}
.verify{margin-top:34px;padding:22px 24px;border-radius:var(--r);background:var(--bg)}
.verify h2{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:800;letter-spacing:-.02em}
.verify h2 .ic{color:var(--main)}
.verify dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 18px;margin-top:14px;font-size:14.5px}
.verify dt{font-weight:700;color:var(--ink-3);white-space:nowrap}
.verify dd{font-weight:600}
.verify__note{margin-top:14px;font-size:14px;color:var(--ink-2)}
.verify .btn{margin-top:16px}

/* AI 읽기 도우미 */
.helper{padding-top:48px}
.mtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mtab{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;transition:border-color .15s,background .15s}
.mtab:hover{border-color:var(--ink-3)}
.mtab[aria-pressed=true]{border-color:var(--main);background:var(--main-soft)}
.mtab__i{width:42px;height:42px;border-radius:12px;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.mtab[aria-pressed=true] .mtab__i{background:var(--main);color:var(--on-main)}
.mtab b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.mtab small{display:block;margin-top:1px;font-size:13.5px;color:var(--ink-2)}
.panel{margin-top:14px;padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.panel__h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}
.panel__h h3{font-size:19px;font-weight:800;letter-spacing:-.03em}
.ai-tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:3px 9px}
.easy{font-size:18px;line-height:1.85;font-weight:500}
.sub{display:flex;align-items:baseline;gap:8px;margin:26px 0 10px;font-size:15px;font-weight:800}
.sub small{font-size:13px;font-weight:600;color:var(--ink-3)}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.voc{padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;line-height:1.55;color:var(--ink-2)}
.voc b{display:block;margin-bottom:2px;font-size:15px;color:var(--ink)}
.think{display:flex;gap:12px;margin-top:24px;padding:16px 18px;border-radius:14px;background:var(--think)}
.think>.ic{width:22px;height:22px;color:#B7791F}
[data-theme=dark] .think>.ic{color:#F2C14E}
.think b{display:block;margin-bottom:2px;font-weight:800}
.ai-note{display:flex;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3)}
.ai-note .ic{width:16px;height:16px;margin-top:2px}
.ratio{display:grid;gap:10px}
.ratio__bar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg)}
.ratio__bar i{display:block;height:100%}
.ratio__bar .f,.ratio__lg .f{background:var(--fact)}
.ratio__bar .o,.ratio__lg .o{background:var(--opinion)}
.ratio__lg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink-2)}
.ratio__lg span{display:inline-flex;align-items:center;gap:6px}
.ratio__lg i{width:10px;height:10px;border-radius:3px}
.ratio__lg b{color:var(--ink)}
.fl{display:grid;gap:10px}
.fi{padding:14px 16px;border:1px solid var(--line);border-left:4px solid var(--fact);border-radius:12px}
.fi.o{border-left-color:var(--opinion)}
.fi__tag{display:inline-block;margin-bottom:6px;padding:2px 8px;border-radius:6px;background:var(--fact-soft);color:var(--fact);font-size:12px;font-weight:800}
.fi.o .fi__tag{background:var(--opinion-soft);color:var(--opinion)}
.fi p{font-weight:600;line-height:1.6}
.fi small{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-2)}
.none{padding:14px 16px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--ink-2)}
.qz{display:grid;gap:26px}
.q__t{display:flex;gap:10px;margin-bottom:12px;font-size:16.5px;font-weight:800;line-height:1.5}
.q__n{flex:none;width:26px;height:26px;margin-top:1px;border-radius:50%;background:var(--ink);color:var(--page);display:grid;place-items:center;font-size:13px}
.q__opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:15px;font-weight:600;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt__l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink-2)}
.opt[data-selected="1"]{border-color:var(--main);background:var(--main-soft)}
.opt[data-selected="1"] .opt__l{background:var(--main);color:var(--on-main)}
.opt[data-correct="1"]{border-color:var(--ok);background:var(--ok-soft)}
.opt[data-correct="1"] .opt__l{background:var(--ok);color:var(--page)}
.opt[data-wrong="1"]{border-color:var(--err);background:var(--err-soft)}
.opt[data-wrong="1"] .opt__l{background:var(--err);color:var(--page)}
.q__ex{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--bg);font-size:14.5px;color:var(--ink-2)}
.q__ex b{color:var(--ink)}
.qz__foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.qz__score{font-size:17px;font-weight:800}
.qz__score b{color:var(--main)}
.hint{font-size:13.5px;color:var(--ink-3)}
.load{display:grid;gap:12px}
.load__t{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--ink-2)}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--main);border-radius:50%;animation:spin .8s linear infinite}
.sk{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--bg) 25%,var(--surface-hover) 50%,var(--bg) 75%);background-size:200% 100%;animation:sk 1.3s linear infinite}
.err{display:grid;justify-items:center;gap:8px;padding:10px 0;text-align:center}
.err__i{width:56px;height:56px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink-2)}
.err__i .ic{width:26px;height:26px}
.err h4{font-size:18px;font-weight:800;letter-spacing:-.02em}
.err p{font-size:15px;color:var(--ink-2)}
.err .btn{margin-top:6px}
.tnote{width:100%;max-width:520px;margin-top:12px;border:1px solid var(--line);border-radius:12px;text-align:left;font-size:14px}
.tnote summary{padding:12px 14px;font-weight:700;color:var(--ink-2);cursor:pointer}
.tnote div{padding:0 14px 14px;line-height:1.75;color:var(--ink-2)}

/* 내 탐정 수첩 */
.mp{max-width:1000px;margin:0 auto;padding:28px 24px 0}
.mp__hero{display:flex;align-items:center;gap:24px;padding:28px 30px;border-radius:20px;background:var(--bg)}
.mp__hero .av{width:88px;height:88px;font-size:44px;background:var(--surface)}
.mp__hi{flex:1;min-width:0}
.mp__k{font-size:13px;font-weight:800;color:var(--main)}
.mp__hero h1{font-size:28px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.mp__hero p.mp__p{margin-top:2px;font-size:14.5px;color:var(--ink-2)}
.mp__hero .bar{max-width:440px;margin-top:12px;background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{padding:18px 20px;border:1px solid var(--line);border-radius:var(--r)}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.stat b.muted{color:var(--ink-3)}
.stat span{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.pr{display:grid;grid-template-columns:110px minmax(0,1fr) 92px 64px;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.pr__n{display:flex;align-items:center;gap:8px;font-weight:800}
.pr__n i{width:8px;height:8px;border-radius:50%;background:var(--cc)}
.pr .bar>i{background:var(--cc)}
.pr__t{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.pr__t.is-top{color:var(--main)}
.pr__c{text-align:right;font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pr__c b{font-size:16px;color:var(--ink)}
.rk{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}
.rk .av{width:42px;height:42px;font-size:21px}
.rk__t{flex:1;min-width:0}
.rk__t b{display:block;font-size:15.5px;font-weight:800}
.rk__t small{display:block;font-size:13px;color:var(--ink-3)}
.rk__s{font-size:13px;font-weight:700;color:var(--ink-3)}
.rk.is-on .rk__s{color:var(--ok)}
.rk:not(.is-on){opacity:.5}
.rk.is-now{padding-inline:14px;border-radius:14px;border-bottom-color:transparent;background:var(--main-soft);opacity:1}
.rk.is-now .rk__s{color:var(--main)}
.cal{max-width:460px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r)}
.cal__h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal__h b{font-size:16px;font-weight:800}
.cal__nav{width:34px;height:34px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.cal__nav:disabled{opacity:.3;cursor:default}
.cal__nav .ic{width:16px;height:16px}
.cal__g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal__d{padding:4px 0;font-size:12px;font-weight:700;color:var(--ink-3)}
.cal__c{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.cal__c.on{background:var(--main);color:var(--on-main);font-weight:800}
.cal__c.is-today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal__c.on.is-today{box-shadow:inset 0 0 0 2px var(--on-main),0 0 0 1.5px var(--main)}
.cal__lg{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:var(--ink-3)}
.cal__lg i{width:10px;height:10px;border-radius:3px;background:var(--main)}
.wn{display:grid;gap:12px}
.wn__c{padding:16px 18px;border:1px solid var(--line);border-radius:14px}
.wn__src{font-size:13px;font-weight:700;color:var(--ink-3)}
.wn__q{margin:4px 0 10px;font-weight:800}
.wn__o{display:grid;gap:4px;font-size:14.5px;color:var(--ink-2)}
.wn__o .ok{color:var(--ok);font-weight:800}
.wn__o .no{color:var(--err);text-decoration:line-through}
.wn__ex{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14px;color:var(--ink-2)}
.note{padding:22px;border-radius:14px;background:var(--bg);font-size:14.5px;color:var(--ink-2)}
.reset{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:52px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;font-size:14px;color:var(--ink-2)}
.btn--danger{color:var(--err)}

/* 꼬리 */
.ft{margin-top:84px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}
.ft .wrap{display:grid;gap:8px;padding-block:26px 44px}
.ft__name{font-size:15px;font-weight:800;color:var(--ink)}

/* 알림·축하 창 */
.toasts{position:fixed;left:50%;bottom:24px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateX(-50%);pointer-events:none}
.toast{padding:11px 18px;border-radius:999px;background:#111113;color:#fff;font-size:14px;font-weight:700;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s}
[data-theme=dark] .toast{background:#F5F5F7;color:#111113}
.toast.show{opacity:1;transform:none}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(16,18,24,.55);animation:fade .2s ease both}
.modal__box{display:grid;justify-items:center;gap:6px;width:100%;max-width:360px;padding:32px 26px 24px;border-radius:20px;background:var(--surface);text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .32s cubic-bezier(.2,1.3,.4,1) both}
.modal__ic{margin-bottom:6px;font-size:56px;line-height:1.1}
.modal__box p{font-size:14.5px;color:var(--ink-2)}
.modal__box h3{font-size:22px;font-weight:800;letter-spacing:-.03em}
.modal__box .btn{width:100%;margin-top:16px}

/* 학습 기능 */
mark{padding:0 2px;border-radius:4px;background:var(--main-soft);color:inherit;font-weight:800}
.me--study{padding:0 14px}
.lv{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.new-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--main-soft);color:var(--main);font-size:12px;font-weight:800}
.upd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:12px;font-size:13.5px;color:var(--ink-3)}
.upd .ic{width:15px;height:15px}
.upd b{padding:2px 9px;border-radius:6px;background:var(--main-soft);color:var(--main);font-size:12.5px;font-weight:800}
.sec__more{display:inline-flex;align-items:center;gap:2px;flex:none;padding:0;border:0;background:none;font-size:14px;font-weight:700;color:var(--ink-2)}
.sec__more:hover{color:var(--ink)}
.sec__more .ic{width:16px;height:16px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink-3);transform:translateY(-2px)}
.tile .mtab__i{margin-bottom:6px}
.tile b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.tile small{font-size:13.5px;color:var(--ink-2)}
.tile__m{margin-top:8px;font-size:13px;font-weight:700;color:var(--main)}
.w{border-radius:3px;text-decoration:underline dotted var(--main) 2px;text-underline-offset:5px;cursor:pointer}
.w:hover{background:var(--main-soft)}
.pop{position:fixed;left:50%;bottom:20px;z-index:95;width:min(440px,calc(100% - 32px));padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:0 18px 50px rgba(0,0,0,.22);transform:translateX(-50%);animation:rise .25s ease both}
.pop__h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pop__h b{font-size:21px;font-weight:800;letter-spacing:-.02em}
.pop__x{width:34px;height:34px;border:0;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--ink-2)}
.pop__x .ic{width:16px;height:16px}
.pop>p{margin-top:4px;font-size:16px;font-weight:500;color:var(--ink-2)}
.pop__a{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.mtab{position:relative}
.mtabs--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.mtabs--4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mtab__done{position:absolute;top:14px;right:14px;display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 7px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-size:12px;font-weight:800}
.mtab__done .ic{width:13px;height:13px}
.helper+.helper{padding-top:40px}
.wl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wl__i{display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:14px}
.wl__h{display:flex;align-items:center;gap:8px}
.wl__h b{font-size:18px;font-weight:800;letter-spacing:-.02em}
.wl__st{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--ok)}
.wl__st .ic{width:13px;height:13px}
.wl__m{font-size:15px;font-weight:600;line-height:1.55;min-height:3.1em}
.wl__ex{padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.wl__i .seg{align-self:flex-start;margin-top:auto}
.guide{display:grid;gap:6px;margin-bottom:16px;padding:14px 16px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--ink-2)}
.guide p{display:flex;align-items:baseline;gap:10px}
.guide b{flex:none;padding:1px 9px;border-radius:6px;font-size:12.5px;font-weight:800}
.g-f{background:var(--fact-soft);color:var(--fact)}
.g-o{background:var(--opinion-soft);color:var(--opinion)}
.fol{display:grid;gap:10px}
.foq{display:grid;gap:10px;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px}
.foq.is-ok{border-color:var(--ok)}
.foq.is-no{border-color:var(--err)}
.foq__t{display:flex;gap:10px;font-weight:700;line-height:1.55}
.foq__b{justify-self:start}
.foq__b button[data-v=fact][aria-pressed=true]{background:var(--fact);color:var(--page)}
.foq__b button[data-v=opinion][aria-pressed=true]{background:var(--opinion);color:var(--page)}
.foq__b button:disabled{cursor:default}
.foq__r{font-size:14px;color:var(--ink-2)}
.foq.is-ok .foq__r b{color:var(--ok)}
.foq.is-no .foq__r b{color:var(--err)}
.tq{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;font-size:17px;line-height:1.5}
.tq .ic{width:22px;height:22px;margin-top:2px;color:#B7791F}
[data-theme=dark] .tq .ic{color:#F2C14E}
.frame{margin-bottom:12px;padding:12px 14px;border-radius:12px;background:var(--bg);font-size:14px;color:var(--ink-2)}
.ta{display:block;width:100%;min-height:140px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font:500 16px/1.7 var(--sans);resize:vertical}
.ta:focus{outline:0;border-color:var(--main)}
.saved{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:13.5px;font-weight:600;color:var(--ok)}
.saved .ic{width:16px;height:16px}
.rv{margin-top:14px;font-size:13.5px}
.rv summary{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--ok);cursor:pointer;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv summary .ic{width:16px;height:16px}
.rv p{margin-top:6px;color:var(--ink-2)}
.tn-text{margin-top:4px;white-space:pre-wrap;line-height:1.7}
.av--ic{color:var(--main)}
.av--ic .ic{width:40%;height:40%}
.mp__p--s{margin-top:6px;font-size:13px}
.st-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.st-h h1{font-size:26px;font-weight:800;letter-spacing:-.035em}
.st-h .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.fc{display:grid;gap:14px;max-width:560px;margin:0 auto}
.fc__face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:290px;padding:32px 24px;border:1.5px solid var(--line);border-radius:24px;background:var(--surface);text-align:center;box-shadow:0 16px 34px -20px var(--shadow);transition:border-color .2s,background .2s}
.fc.is-flip .fc__face{border-color:var(--main);background:var(--main-soft)}
.fc__k{font-size:13px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.fc__w{font-size:40px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.fc__m{max-width:420px;font-size:18px;font-weight:600;line-height:1.55}
.fc__ex{max-width:440px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:14px;line-height:1.6;color:var(--ink-2)}
.fc__hint{font-size:14px;color:var(--ink-3)}
.fc__nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fc__marks{display:flex;gap:8px}
.round:disabled{opacity:.3;cursor:default}
.fc__src{display:inline-flex;align-items:center;gap:6px;justify-self:center;max-width:100%;padding:0;border:0;background:none;font-size:13.5px;color:var(--ink-2)}
.fc__src:hover{color:var(--ink);text-decoration:underline}
.fc__src .ic{width:16px;height:16px}
.fc__src span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pq{max-width:680px}
.pq__bar{margin-bottom:22px}
.pq__k{font-size:13.5px;font-weight:800;color:var(--main)}
.pq__t{margin:6px 0 16px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.5}
.pq__src{display:flex;align-items:center;gap:6px;margin:-8px 0 16px;font-size:13px;color:var(--ink-3)}
.pq__src .ic{width:15px;height:15px}
.pq__fo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt--big{justify-content:center;min-height:64px;font-size:18px;font-weight:800}
.result{display:grid;justify-items:center;gap:10px;padding:40px 20px;border-radius:20px;background:var(--bg);text-align:center}
.result .av{width:76px;height:76px;font-size:38px;background:var(--surface)}
.result h1{font-size:24px;font-weight:800;letter-spacing:-.03em}
.result p{color:var(--ink-2)}
.result__a{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- 세련된 음영·효과 ---------- */
body{background:
  radial-gradient(900px 420px at 92% -140px,color-mix(in srgb,var(--main) 10%,transparent),transparent 70%),
  radial-gradient(760px 380px at -12% -60px,color-mix(in srgb,var(--c-culture) 7%,transparent),transparent 70%),
  var(--page);background-repeat:no-repeat}
.hd{box-shadow:0 12px 32px -26px rgba(0,0,0,.6)}
.search{box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:border-color .15s,background .15s,box-shadow .15s}
.search:focus-within{box-shadow:0 0 0 4px color-mix(in srgb,var(--main) 18%,transparent)}
.round,.me{box-shadow:var(--edge),var(--sh-1);transition:background .15s,transform .15s,box-shadow .2s}
.me__pt{box-shadow:0 4px 12px -4px color-mix(in srgb,var(--main) 80%,transparent)}
/* 분야 탭: 알약 모양, 고른 탭은 분야 색으로 은은하게 빛나요 */
.gnb .wrap{align-items:center;gap:2px}
.gnb button{height:36px;padding:0 9px;border-radius:999px;transition:background .18s,color .18s,box-shadow .2s,transform .18s}
.gnb i{display:none}
.gnb button[aria-current=true] i{display:inline}
.gnb button[aria-current=true]{color:var(--ink);background:color-mix(in srgb,var(--cc,var(--main)) 15%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc,var(--main)) 45%,transparent),0 6px 16px -8px color-mix(in srgb,var(--cc,var(--main)) 75%,transparent)}
.gnb button[aria-current=true]::after{display:none}
.gnb .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 20%,transparent)}
/* 단추 */
.btn{transition:background .15s,box-shadow .2s,opacity .15s,transform .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn--main{box-shadow:0 8px 20px -10px color-mix(in srgb,var(--main) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
.btn--ink{box-shadow:var(--sh-1)}
.btn--line{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1)}
.btn--print{box-shadow:0 8px 22px -8px color-mix(in srgb,var(--main) 95%,transparent),0 0 0 1px color-mix(in srgb,var(--main) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.seg{box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.seg button{transition:background .15s,color .15s,box-shadow .15s}
.seg button[aria-pressed=true]{box-shadow:0 1px 2px rgba(0,0,0,.18),0 4px 10px -4px rgba(0,0,0,.22)}
/* 제목·구역 */
.intro h1{background:linear-gradient(100deg,var(--ink) 35%,color-mix(in srgb,var(--main) 80%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.sec__h{border-bottom:0;background:linear-gradient(var(--main),var(--main)) left bottom/48px 2px no-repeat,linear-gradient(var(--line-2),var(--line-2)) left bottom/100% 1px no-repeat}
/* 카드·판 */
.feat{position:relative;overflow:hidden;border:1px solid var(--line);background:radial-gradient(120% 150% at 100% 0,color-mix(in srgb,var(--cc) 22%,transparent) 0,transparent 55%),linear-gradient(180deg,var(--surface-2),var(--bg));box-shadow:var(--edge),var(--sh-2);transition:transform .22s,box-shadow .22s,border-color .22s}
.feat__k{box-shadow:var(--sh-1)}
.mycard,.panel,.result{background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-2)}
.result{border:1px solid var(--line)}
.av{box-shadow:var(--edge),inset 0 0 0 1px var(--line)}
.bar{box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
.bar>i{background:linear-gradient(90deg,var(--main),color-mix(in srgb,var(--main) 55%,var(--c-culture)));box-shadow:0 0 12px -2px color-mix(in srgb,var(--main) 70%,transparent)}
.nc{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-1);transition:transform .22s,box-shadow .22s,border-color .22s}
.nc::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--cc),color-mix(in srgb,var(--cc) 30%,transparent));opacity:0;transition:opacity .22s}
.kick{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;background:color-mix(in srgb,var(--cc) 14%,transparent)}
.kick::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cc)}
.read-tag,.new-tag{box-shadow:var(--edge)}
.mtab,.tile{background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-1);transition:border-color .18s,background .18s,box-shadow .22s,transform .22s}
.mtab[aria-pressed=true]{border-color:var(--main);background:linear-gradient(180deg,color-mix(in srgb,var(--main) 16%,var(--surface)),var(--surface));box-shadow:var(--edge),0 0 0 3px color-mix(in srgb,var(--main) 16%,transparent),0 18px 36px -20px color-mix(in srgb,var(--main) 80%,transparent)}
.mtab__i{background:linear-gradient(145deg,var(--surface-hover),var(--bg));box-shadow:var(--edge),inset 0 0 0 1px var(--line);transition:transform .22s,background .22s,box-shadow .22s}
.mtab[aria-pressed=true] .mtab__i{background:linear-gradient(145deg,var(--main),color-mix(in srgb,var(--main) 60%,var(--c-culture)));box-shadow:0 8px 18px -8px color-mix(in srgb,var(--main) 85%,transparent)}
.verify{border:1px solid var(--line);box-shadow:var(--edge)}
.mp__hero{border:1px solid var(--line);background:radial-gradient(90% 150% at 100% 0,color-mix(in srgb,var(--main) 15%,transparent),transparent 60%),linear-gradient(180deg,var(--surface-2),var(--bg));box-shadow:var(--edge),var(--sh-2)}
.stat,.wl__i,.foq,.wn__c,.cal{background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-1)}
.stat{transition:transform .2s,box-shadow .2s}
.opt{box-shadow:var(--sh-1);transition:border-color .15s,background .15s,transform .15s,box-shadow .15s}
.fc__face{box-shadow:var(--edge),var(--sh-3)}
.fc.is-flip .fc__face{box-shadow:var(--edge),var(--sh-3),0 0 0 4px color-mix(in srgb,var(--main) 16%,transparent)}
.pop,.modal__box{box-shadow:var(--edge),var(--sh-3)}
.toast{box-shadow:var(--sh-3)}
.empty{border:1px dashed var(--line-2)}
.nc:focus-visible,.feat:focus-visible{outline-offset:3px}
/* 마우스를 올릴 수 있는 기기에서만 들림 효과 (휴대폰은 눌렀을 때 그대로) */
@media(hover:hover){
  .gnb button:hover{background:var(--bg);color:var(--ink);transform:translateY(-1px)}
  .gnb button[aria-current=true]:hover{background:color-mix(in srgb,var(--cc,var(--main)) 20%,var(--surface))}
  .round:hover:not(:disabled),.me:hover{transform:translateY(-1px);box-shadow:var(--edge),var(--sh-2)}
  .btn--main:hover{transform:translateY(-1px);box-shadow:0 12px 24px -10px color-mix(in srgb,var(--main) 90%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
  .btn--line:hover{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--ink-3),var(--sh-2);transform:translateY(-1px)}
  .btn--print:hover{transform:translateY(-1px);box-shadow:0 14px 30px -8px color-mix(in srgb,var(--main) 100%,transparent),0 0 0 1px color-mix(in srgb,var(--main) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
  .tsw:hover{transform:translateY(-1px);box-shadow:inset 0 0 0 1px var(--ink-3),var(--edge),var(--sh-2)}
  .tsw:hover .tsw__o{color:var(--ink)}
  .tsw[data-mode=dark]:hover .tsw__o--d{color:var(--on-main)}
  .tsw[data-mode=light]:hover .tsw__o--l{color:#3A2500}
  .feat:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--cc) 40%,var(--line));box-shadow:var(--edge),var(--sh-3),0 22px 44px -26px color-mix(in srgb,var(--cc) 80%,transparent)}
  .nc:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--cc) 45%,var(--line));box-shadow:var(--edge),var(--sh-2),0 18px 36px -22px color-mix(in srgb,var(--cc) 85%,transparent)}
  .nc:hover::before{opacity:1}
  .mtab:hover,.tile:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--edge),var(--sh-2)}
  .tile:hover{border-color:color-mix(in srgb,var(--main) 45%,var(--line))}
  .mtab[aria-pressed=true]:hover{border-color:var(--main)}
  .mtab:hover .mtab__i,.tile:hover .mtab__i{transform:scale(1.06) rotate(-4deg)}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--edge),var(--sh-2)}
  .opt:hover:not(:disabled){transform:translateY(-1px);box-shadow:var(--sh-2)}
}
.nc:hover{transform:none}
@media(hover:hover){.nc:hover{transform:translateY(-4px)}}

/* ---------- 카드 음영 더 짙게 (뉴스 카드·공부방 타일·학습 활동 탭) ---------- */
.nc{background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 5%,var(--surface-2)) 0,var(--surface) 64%);box-shadow:var(--edge),var(--sh-card),0 16px 30px -24px color-mix(in srgb,var(--cc) 70%,transparent)}
.mtab,.tile{box-shadow:var(--edge),var(--sh-card)}
.mycard,.feat{box-shadow:var(--edge),var(--sh-card-h)}
.stat,.wl__i,.foq,.wn__c,.cal{box-shadow:var(--edge),var(--sh-card)}
@media(hover:hover){
  .nc:hover{transform:translateY(-5px);box-shadow:var(--edge),var(--sh-card-h),0 22px 40px -24px color-mix(in srgb,var(--cc) 90%,transparent)}
  .mtab:hover,.tile:hover{box-shadow:var(--edge),var(--sh-card-h)}
}
.nc:active,.tile:active,.mtab:active{transform:translateY(-1px) scale(.995)}

/* ---------- 더 많은 기능: 오늘의 공부 · 학년별 보기 · 분야 둘러보기 · 배지 · 다음 기사 ---------- */
.box{display:flex;flex-direction:column;gap:12px;min-width:0;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-card)}
.box__h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
.box__k{font-size:13px;font-weight:800;color:var(--main)}
.box__d{font-size:13px;font-weight:700;color:var(--ink-3)}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.ml{display:grid;gap:9px}
.ml__i{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.ml__ic{flex:none;width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--ink-2);box-shadow:var(--edge),inset 0 0 0 1px var(--line)}
.ml__ic .ic{width:16px;height:16px}
.ml__t{flex:1;min-width:0}
.ml__n{font-size:13px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ml__i.is-ok .ml__ic{background:var(--ok-soft);color:var(--ok);box-shadow:none}
.ml__i.is-ok .ml__t{color:var(--ink-3);text-decoration:line-through}
.ml__i.is-ok .ml__n{color:var(--ok)}
.ml__done{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;margin-top:auto;border-radius:999px;background:var(--ok-soft);font-size:14.5px;font-weight:800;color:var(--ok)}
.ml__done .ic{width:18px;height:18px}
.box>.btn{margin-top:auto}
.wod__w{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1.25}
.wod__m{font-size:15.5px;font-weight:600;line-height:1.55}
.wod__a{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.sod__t{font-size:16.5px;font-weight:800;line-height:1.55}
.sod__b{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt--mid{justify-content:center;min-height:46px;font-size:16px;font-weight:800}
.sod__r{font-size:14px;color:var(--ink-2)}
.sod__r b{color:var(--ink)}
.box__link{display:inline-flex;align-items:center;gap:6px;max-width:100%;margin-top:auto;padding:0;border:0;background:none;font-size:13px;color:var(--ink-3);text-align:left}
.box__link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box__link .ic{width:15px;height:15px}
.box__link:hover{color:var(--ink);text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin:-4px 0 18px}
.filters__g{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 15px;border:0;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--line),var(--sh-1);font-size:14px;font-weight:700;color:var(--ink-2);transition:background .15s,color .15s,box-shadow .15s}
.chip .ic{width:16px;height:16px;opacity:.35}
.chip[aria-pressed=true]{background:var(--main-soft);color:var(--main);box-shadow:inset 0 0 0 1.5px var(--main),0 6px 16px -10px color-mix(in srgb,var(--main) 80%,transparent)}
.chip[aria-pressed=true] .ic{opacity:1}
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.catc{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;padding:16px 16px 15px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 9%,var(--surface-2)),var(--surface));text-align:left;box-shadow:var(--edge),var(--sh-card);transition:transform .2s,box-shadow .2s,border-color .2s}
.catc[aria-current=true]{border-color:color-mix(in srgb,var(--cc) 60%,var(--line));box-shadow:var(--edge),var(--sh-card),0 0 0 3px color-mix(in srgb,var(--cc) 18%,transparent)}
.catc__h{display:flex;align-items:center;gap:8px}
.catc__h i{width:8px;height:8px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 3px color-mix(in srgb,var(--cc) 22%,transparent)}
.catc__h b{font-size:15.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.catc__n{font-size:12.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.catc .bar{width:100%;height:6px;margin-top:5px}
.catc .bar>i{background:var(--cc);box-shadow:none}
.intro__k--cat{color:var(--cc)}
.badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;padding:18px 10px 14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,var(--surface-2),var(--surface));text-align:center;box-shadow:var(--edge),var(--sh-card)}
.bdg__i{display:grid;place-items:center;width:54px;height:54px;margin-bottom:8px;border-radius:50%;background:var(--bg);font-size:27px;line-height:1;filter:grayscale(1);opacity:.4}
.bdg b{font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.bdg small{max-width:100%;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bdg__s{margin-top:8px;padding:2px 9px;border-radius:6px;background:var(--bg);font-size:11.5px;font-weight:800;color:var(--ink-3)}
.bdg.is-on{border-color:color-mix(in srgb,var(--main) 38%,var(--line))}
.bdg.is-on .bdg__i{filter:none;opacity:1;background:var(--main-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--main) 12%,transparent)}
.bdg.is-on .bdg__s{background:var(--main-soft);color:var(--main)}
.art__bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;margin-bottom:22px}
.art__bar .crumb{margin-bottom:0}
.art__acts{display:flex;flex-wrap:wrap;gap:6px}
.rel{display:grid;gap:10px}
.rel__i{display:flex;align-items:center;gap:14px;width:100%;min-width:0;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--cc) 5%,var(--surface-2)),var(--surface));text-align:left;box-shadow:var(--edge),var(--sh-card);transition:transform .2s,box-shadow .2s,border-color .2s}
.rel__i .kick{flex:none}
.rel__t{flex:1;min-width:0}
.rel__t b{display:block;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel__t small{display:block;margin-top:1px;font-size:13px;color:var(--ink-3)}
.rel__i>.ic{color:var(--ink-3)}
.pq__p{margin:8px 0 12px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--bg);font-size:17px;font-weight:500;line-height:1.8;box-shadow:var(--edge)}
.pq__go{margin-top:12px}
.ft__name{padding:0;border:0;background:none;text-align:left}
.ft__name:hover{text-decoration:underline}
#print-root{display:none}
@media(hover:hover){
  .catc:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--cc) 45%,var(--line));box-shadow:var(--edge),var(--sh-card-h),0 14px 28px -18px color-mix(in srgb,var(--cc) 85%,transparent)}
  .rel__i:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--cc) 45%,var(--line));box-shadow:var(--edge),var(--sh-card-h)}
  .chip:hover{color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink-3),var(--sh-2)}
  .bdg.is-on:hover{transform:translateY(-2px);box-shadow:var(--edge),var(--sh-card-h)}
}
.bdg{transition:transform .2s,box-shadow .2s}

/* 어두운 화면의 분야 카드: 분야 색으로 빛나는 그림자 */
[data-theme=dark] .nc,[data-theme=dark] .catc,[data-theme=dark] .rel__i{box-shadow:var(--edge),0 0 0 1px rgba(255,255,255,.05),0 2px 5px rgba(0,0,0,.55),0 16px 36px -14px color-mix(in srgb,var(--cc) 46%,transparent)}
[data-theme=dark] .nc,[data-theme=dark] .mtab,[data-theme=dark] .tile,[data-theme=dark] .box,[data-theme=dark] .catc,[data-theme=dark] .rel__i,[data-theme=dark] .bdg,[data-theme=dark] .stat{border-color:#2C2C33}
[data-theme=dark] .feat{box-shadow:var(--edge),0 0 0 1px rgba(255,255,255,.06),0 26px 60px -22px color-mix(in srgb,var(--cc) 50%,transparent)}
@media(hover:hover){
  [data-theme=dark] .nc:hover,[data-theme=dark] .catc:hover,[data-theme=dark] .rel__i:hover{box-shadow:var(--edge),0 0 0 1px color-mix(in srgb,var(--cc) 40%,transparent),0 2px 5px rgba(0,0,0,.55),0 22px 48px -14px color-mix(in srgb,var(--cc) 70%,transparent)}
  [data-theme=dark] .feat:hover{box-shadow:var(--edge),0 0 0 1px color-mix(in srgb,var(--cc) 35%,transparent),0 30px 70px -22px color-mix(in srgb,var(--cc) 70%,transparent)}
}

/* ---------- 신문 느낌: 망점 바탕 · 제호 · 헤드라인 띠 ---------- */
body{position:relative}
body::before{content:'';position:absolute;inset:0 0 auto 0;height:1100px;z-index:-1;pointer-events:none;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 16%,transparent) .9px,transparent 1.4px);background-size:11px 11px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 45%,transparent);mask-image:linear-gradient(180deg,rgba(0,0,0,.9),rgba(0,0,0,.35) 45%,transparent)}
[data-theme=dark] body::before{background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) .9px,transparent 1.4px)}
.mast{position:relative;text-align:center}
.mast>*{position:relative}
.mast__top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 2px;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);font-size:12.5px;font-weight:700;color:var(--ink-2);letter-spacing:.01em}
.mast__top b{font-weight:800;color:var(--ink)}
.intro h1.mast__t{margin:18px 0 12px;background:none;color:var(--ink);-webkit-text-fill-color:currentColor;font-family:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang','바탕',serif;font-size:54px;font-weight:900;letter-spacing:-.02em;line-height:1.15}
.mast__rule{display:block;height:6px;border-top:1px solid var(--ink);border-bottom:2px solid var(--ink)}
.mast .intro__line{margin-top:14px}
.mast .upd{justify-content:center}
.mast__art{position:absolute;top:66px;width:200px;height:250px;color:var(--ink);opacity:.07;pointer-events:none}
.mast__art--l{left:-8px;transform:rotate(-9deg)}
.mast__art--r{right:-8px;transform:rotate(8deg)}
[data-theme=dark] .mast__art{opacity:.09}
.ticker{display:flex;align-items:center;height:48px;margin-top:22px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-card);overflow:hidden}
.ticker__k{flex:none;display:inline-flex;align-items:center;gap:7px;height:100%;padding:0 18px;background:var(--ink);color:var(--page);font-size:13.5px;font-weight:800;letter-spacing:.01em}
.ticker__k i{width:7px;height:7px;border-radius:50%;background:#FF4D4F;box-shadow:0 0 0 3px rgba(255,77,79,.25);animation:blink 1.6s ease-in-out infinite}
.ticker__v{flex:1;min-width:0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent,#000 28px,#000 calc(100% - 28px),transparent)}
.ticker__t{display:flex;width:max-content;animation:tick 80s linear infinite}
.ticker:hover .ticker__t,.ticker:focus-within .ticker__t{animation-play-state:paused}
.ticker__t button{flex:none;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px 0 22px;border:0;background:none;font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.ticker__t button:hover{text-decoration:underline;text-underline-offset:4px}
.ticker__t button b{font-size:12.5px;font-weight:800;color:var(--cc)}
.ticker__t button::after{content:'';width:4px;height:4px;margin-left:12px;border-radius:50%;background:var(--ink-3)}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes blink{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){
  .ticker__v{overflow-x:auto;scrollbar-width:none}
  .ticker__t{animation:none!important}
  .ticker__k i{animation:none!important}
}

/* ---------- 오늘의 공부 4칸 (맨 오른쪽 공부방 정사각형 탭 4개) ---------- */
.today{grid-template-columns:repeat(4,minmax(0,1fr))}
.box__go{display:inline-flex;align-items:center;gap:2px;padding:0;border:0;background:none;font-size:13px;font-weight:700;color:var(--ink-3)}
.box__go .ic{width:14px;height:14px}
.box__go:hover{color:var(--ink)}
.sq4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:auto}
.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;min-width:0;padding:8px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-1);text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s}
.sq__i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,var(--surface-hover),var(--bg));box-shadow:var(--edge),inset 0 0 0 1px var(--line);color:var(--ink)}
.sq__i .ic{width:18px;height:18px}
.sq b{font-size:14px;font-weight:800;letter-spacing:-.02em;line-height:1.25;white-space:nowrap}
.sq small{font-size:11.5px;font-weight:700;color:var(--main);white-space:nowrap}
@media(hover:hover){.sq:hover{transform:translateY(-3px);border-color:var(--main)}.sq:hover .sq__i{background:var(--main);color:var(--on-main)}}
.ft__top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.ft__by{font-size:13.5px;font-weight:700;color:var(--ink-2)}

/* ---------- 기사 화면: 왼쪽 기사 + 오른쪽 학습 활동·AI 읽기 도우미 ---------- */
/* 넓은 화면(컴퓨터·가로 패드)에서는 오른쪽 칸을 화면 너비의 약 42%로 넉넉하게 */
.art--split{max-width:1480px}
.split{display:grid;grid-template-columns:minmax(0,1fr) clamp(400px,42vw,600px);grid-template-areas:"main side" "rel side";gap:0 clamp(24px,3vw,44px);align-items:start}
.split__main{grid-area:main;min-width:0}
.split__rel{grid-area:rel;min-width:0}
.side{grid-area:side;position:sticky;top:calc(var(--hdh,100px) + 12px);display:flex;flex-direction:column;height:calc(100vh - var(--hdh,100px) - 24px);height:calc(100dvh - var(--hdh,100px) - 24px);min-height:520px;padding:20px 22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,var(--surface-2),var(--surface));box-shadow:var(--edge),var(--sh-card)}
.side .helper{padding-top:0}
.side .helper+.helper{padding-top:18px}
.side .sec__h{margin-bottom:12px;padding-bottom:9px}
.side .sec__h h2{font-size:19px}
.side .mtabs{gap:10px}
.side .mtab{align-items:center;justify-content:center;gap:8px;padding:14px 8px;text-align:center;border-radius:16px}
.side .mtab>span:last-child{display:grid;gap:2px}
.side .mtab b{font-size:15.5px;white-space:nowrap}
.side .mtab small{font-size:12.5px;white-space:nowrap}
.side .mtab__i{width:40px;height:40px;border-radius:12px}
.side .mtab__i .ic{width:20px;height:20px}
.side .mtab__done{top:7px;right:7px;height:20px;padding:0 5px;font-size:0;gap:0}
.side .mtab__done .ic{width:13px;height:13px}
.side .mtabs--2 .mtab{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 16px;text-align:left}
.side__panel{flex:1 1 auto;min-height:0;margin:18px -8px 0;padding:0 8px 4px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.side__panel .panel{margin-top:0;padding:22px}
.panel--guide{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-size:15px;border-style:dashed}
.panel--guide>.ic{flex:none;width:24px;height:24px;color:var(--main)}
.split__main .verify{margin-bottom:0}
.split__rel .helper{padding-top:40px}
/* 가로 패드·작은 노트북: 오른쪽 칸 설명 글은 줄이고 탭을 조금 촘촘하게 */
@media(max-width:1280px) and (min-width:961px){
  .side{padding:16px 16px}
  .side .mtab{padding:12px 6px}
  .side .mtab b{font-size:14.5px}
  .side .mtabs--4 .mtab small{display:none}
  .side__panel .panel{padding:18px}
}
/* 낮은 화면(가로 패드 등): 탭 높이를 줄여 활동 화면을 넓게 */
@media(min-width:961px) and (max-height:820px){
  .side .sec__h{margin-bottom:8px}
  .side .mtab__i{width:32px;height:32px}
  .side .mtab{padding:10px 6px;gap:6px}
  .side .mtabs--4 .mtab small{display:none}
  .side .helper+.helper{padding-top:12px}
}
/* 세로 패드·휴대폰: 기사 아래에 넓게 */
@media(max-width:960px){
  .art--split{max-width:820px}
  .split{grid-template-columns:minmax(0,1fr);grid-template-areas:"main" "side" "rel"}
  .side{position:static;display:block;height:auto;min-height:0;margin-top:34px}
  .side__panel{overflow:visible;margin:0;padding:0}
  .side__panel .panel{margin-top:14px}
  .side .mtab{align-items:flex-start;text-align:left;padding:14px}
  .panel--guide{display:none}
}
@media print{.side,.split__rel{display:none!important}.split{display:block}}

@media(max-width:1080px){
  .gnb .wrap{padding-right:32px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
}
@media(max-width:1000px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .today{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}
  .badges{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(max-width:720px){
  .wrap{padding-inline:16px}
  .hd__top{flex-wrap:wrap;height:auto;gap:0 8px;padding-top:6px}
  .logo{font-size:16.5px;gap:8px}
  .logo__m{width:30px;height:30px}
  .hd__r{margin-left:auto;gap:6px}
  .round{width:38px;height:38px}
  /* 좁은 화면: 지금 화면을 색 동그라미로 보여 줘요 (어둡게 = 파랑 달, 밝게 = 노랑 해) */
  .tsw{grid-template-columns:1fr;width:38px;height:38px;padding:0}
  .tsw__k,.tsw[data-mode=light] .tsw__k{top:0;bottom:0;left:0;width:100%;transform:none}
  .tsw[data-mode=dark] .tsw__o--l,.tsw[data-mode=light] .tsw__o--d{display:none}
  .tsw__o{height:38px;padding:0}
  .tsw__o .ic{width:18px;height:18px}
  .me{height:38px;padding:0 4px 0 10px;gap:6px}
  .me__lbl{display:none}
  .me__pt{height:28px}
  .search{order:3;flex:1 0 100%;max-width:none;margin:4px 0 10px}
  .gnb .wrap{height:48px;padding-inline:10px 28px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
  .gnb button{height:34px}
  .gnb button{padding:0 10px;font-size:15px}
  .gnb button[aria-current=true]::after{left:8px;right:8px}
  .intro{padding-top:26px}
  .intro h1{font-size:25px}
  .intro p.intro__line{font-size:15px}
  .top{margin-top:20px;gap:14px}
  .feat{padding:24px 22px;border-radius:18px}
  .feat h2{font-size:23px}
  .feat__ex{font-size:15px}
  .sec{padding-top:40px}
  .sec__h h2{font-size:20px}
  .grid{grid-template-columns:1fr;gap:12px}
  .nc{padding:18px 18px 16px}
  .art,.mp{padding-inline:16px}
  .art h1{font-size:26px}
  .art__meta .btn{margin-left:0}
  .tools{gap:10px 14px}
  .verify{padding:18px}
  .mtabs{grid-template-columns:1fr}
  .mtab{flex-direction:row;align-items:center;gap:14px;padding:14px 16px}
  .panel{padding:18px}
  .easy{font-size:17px}
  .mp__hero{gap:16px;padding:20px}
  .mp__hero .av{width:64px;height:64px;font-size:32px}
  .mp__hero h1{font-size:23px}
  .stats{gap:8px}
  .stat{padding:14px 16px}
  .stat b{font-size:23px}
  .pr{grid-template-columns:76px minmax(0,1fr) 52px;gap:12px}
  .pr__t{display:none}
  .me--study{width:38px;padding:0;justify-content:center}
  .tiles{grid-template-columns:1fr}

  .wl{grid-template-columns:1fr}
  .wl__m{min-height:0}
  .st-h h1{font-size:22px}
  .fc__face{min-height:250px;padding:26px 18px}
  .fc__w{font-size:32px}
  .pq__t{font-size:18.5px}
  /* 오늘의 공부: 휴대폰에서는 옆으로 밀어 보는 카드 */
  .today{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:86%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 22px;scroll-padding-inline:16px;scrollbar-width:none}
  .today::-webkit-scrollbar{display:none}

  .ws__src{margin-top:4px;font-size:9pt}
  .ws__body{margin-top:12px;padding:12px 14px;border:1px solid #888;border-radius:8px}

  .ws h2{margin:16px 0 7px;font-size:12pt;font-weight:800}

}

<script>
(function(){
'use strict';

/* =========================================================
   DATA
========================================================= */
const CATEGORIES = [

  {id:'nature',  label:'동물·자연', desc:'동물, 식물, 자연 생태'},
  {id:'society', label:'사회',      desc:'생활, 인구, 안전, 지역'},
  {id:'school',  label:'교육',      desc:'학교, 교육 정책, 배움 활동'},
  {id:'economy', label:'경제',      desc:'물가, 돈, 기업과 소비'},
